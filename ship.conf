# scripts/ship.sh pushes the task branch to this git remote and opens its pull request on this repo: the copy whose
# merge queue tests pull requests together and whose workflow then fast-forwards Johnlon/openisd main
# (John, 10 Nov 2026: option D). Not a gate file, so it changes like any code.
SHIP_REMOTE=portingle
SHIP_REPO=portingle/openisd
# The local checks ship.sh runs before the push, the same scripts the pull request's `architecture` and `unit` jobs run (T815).
SHIP_ARCH_CMD="bash scripts/land/unit-architecture.sh"
SHIP_UNIT_CMD="bash scripts/land/unit-changed.sh"
