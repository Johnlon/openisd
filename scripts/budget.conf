# Memory budget of the machine's heavy jobs, in MB. Every figure was measured on 16 Oct 2026 (PSS and
# cgroup memory.peak, quiet box; scripts/measure-peak.sh, scripts/test-reporters/spec-memory-playwright.mjs).
# Re-measure when a job grows; scripts/land/test/budget-conf.test.sh fails when the figures no longer fit.
#
# 15.6 GB of RAM, less 4.6 GB for the agent sessions, the desktop and the kernel: the processes outside the
# slices (claude, node, agy, chrome, tmux, Xvfb) summed to 3.9 GB of PSS on 16 Oct 2026, plus 20% and 0.5 GB.
BUDGET_MB=10500
TOKEN_MB=100

# Pools. A job takes tokens from one pool only; a job never takes memory from another pool's share.
# small:   typecheck and changed-file lint, which start at once (John): one typecheck and two lints fit.
# general: browser spec runs, unit test runs, full lint, the suite (pool name "suite" is an alias of general).
# The old 1400 MB suite pool sat idle once the suite moved to GitHub Actions (T487); it is in general now.
POOL_SMALL_MB=4000
POOL_GENERAL_MB=6500

# CPU. One token per core, shared by every pool (and by every repo that calls scripts/budget.sh). A job holds
# its memory tokens and its CPU tokens together, or neither. A job asking for more cores than there are is
# capped at all of them, so it can always run alone. CPU_TOKENS in the environment overrides (tests).
CPU_TOKENS="${CPU_TOKENS:-$(nproc)}"

# Costs.
COST_BROWSER_RUN_BASE_MB=300     # playwright runner + the vite web server
COST_BROWSER_WORKER_MB=700       # one worker with its Chromium: measured 390 to 640
COST_SUITE_MB=1400               # the post-land suite at 2 workers: measured 1040 plus vite headroom
SUITE_WORKERS=2                  # fixed: the same tests every run
BROWSER_RUN_MAX_WORKERS=2
COST_VITEST_TARGETED_MB=800      # a few spec files; one file measured 280
COST_VITEST_FULL_MB=2400         # full unit suite with 4 workers: measured 2290
VITEST_FULL_WORKERS=4
COST_LINT_MB=3400                # full eslint over packages/, with or without --cache: measured 3310. Waits like any job.
COST_TYPECHECK_MB=2000           # tsc design + tsc persistence + vue-tsc ui in parallel: 650+420+860
COST_LINT_CHANGED_MB=1000        # eslint over a few changed files: measured 510 (1 file) and 800 (12 files)

# CPU costs, in cores (T487). Memory alone let ten 4-worker runs onto 10 cores: load 90 on 20 Oct 2026.
COST_CPU_VITEST_TARGETED=2       # a few spec files: main thread plus a worker or two
COST_CPU_VITEST_FULL=4           # = VITEST_FULL_WORKERS
COST_CPU_BROWSER_RUN_BASE=1      # playwright runner + vite
COST_CPU_BROWSER_WORKER=1        # one worker busy with its Chromium
COST_CPU_TYPECHECK=3             # tsc design + tsc persistence + vue-tsc ui in parallel
COST_CPU_LINT_CHANGED=1
COST_CPU_LINT=2
