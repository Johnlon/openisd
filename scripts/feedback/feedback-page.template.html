<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f4f4f4; --line:#ddd; --done:#1b7f3b; --wait:#a15c00; }
@media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#eee; --muted:#aaa; --card:#1e1e1e; --line:#333; --done:#5fd383; --wait:#f0a64a; } }
* { box-sizing:border-box; }
body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
h1 { font-size:20px; margin:0 0 4px; }
.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
.fix { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin:0 0 16px; }
.fix h2 { font-size:17px; margin:0 0 4px; }
.meta { font-size:13px; color:var(--muted); margin:0 0 8px; }
.meta .state.done { color:var(--done); font-weight:600; }
.meta .state.wait { color:var(--wait); font-weight:600; }
.group { margin:8px 0 0; }
.group h3 { font-size:14px; margin:0 0 4px; color:var(--muted); font-weight:600; }
.pair { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:8px; }
figure { margin:0; }
img { width:100%; height:auto; border:1px solid var(--line); border-radius:4px; display:block; background:#fff; }
a { color:inherit; }
.note { font-size:14px; color:var(--muted); }
.look { font-size:15px; margin:4px 0 8px; padding:6px 8px; border-left:4px solid #1d5fd0; background:var(--card); }
.look.missing { border-color:#c62828; color:#c62828; }
.todo { font-size:16px; color:var(--fg); background:var(--card); border:2px solid #1d5fd0; border-radius:8px; padding:10px; margin:0 0 12px; }
.cm { display:flex; gap:6px; margin:6px 0 0; }
.cm input, .cm textarea { flex:1; min-width:0; font:inherit; font-size:15px; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
.cm button { font:inherit; font-size:15px; padding:8px 14px; border:0; border-radius:6px; background:#1d5fd0; color:#fff; }
.said { font-size:14px; margin:4px 0 0; padding:4px 8px; border-left:3px solid var(--line); }
.sent, .sending { font-size:14px; color:var(--muted); margin:4px 0 0 11px; }
.said.john { border-color:#1d5fd0; }
.cm-err { color:#c00; font-size:13px; }
.live { display:inline-block; margin:6px 0 0; padding:10px 14px; border-radius:6px; background:#1d5fd0; color:#fff; font-size:15px; font-weight:600; text-decoration:none; }
.permalink { float:right; font-size:13px; line-height:1; color:var(--muted); text-decoration:none; padding:2px 4px; }
.side { min-width:0; }
.lbl { display:block; font-size:12px; color:var(--muted); margin:0 0 2px; }

figure.here { outline:3px solid #c62828; outline-offset:3px; border-radius:4px; }
details.ruled { margin:8px 0 0; }
details.ruled summary { font-size:15px; color:var(--muted); padding:8px 0; cursor:pointer; }
</style>
</head>
<body>
<p class="sub todo"><b>What to do:</b> __TODO__</p>
<h1>__TITLE__</h1>
<main id="out"><p class="note">Loading…</p></main>
<script>
// Reads index.md (the table agents keep) and shows each fix with its pictures inline.
const out = document.getElementById('out');
const linkRe = /\[([^\]]+)\]\(([^)]+)\)/g;
const isLive = (l) => /^live$/i.test(l.label.trim());
const slug = (n) => n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
// A before picture is a still of today's app, never the live mock.
const isBefore = (label) => /^before$/i.test(label.trim());
const isAfter = (label) => /^after$/i.test(label.trim());
const isImg = (u) => /\.(png|jpe?g|gif|webp|svg)$/i.test(u);
const ITEM = '__ITEM__';
const FOLDER = '__FOLDER__';  // every comment on this page goes to this board item, prefixed with its picture
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pictures(cell) {
  // Groups are separated by " · ". A group may start with "name:" followed by links.
  const groups = cell.split(' · ').map((g) => {
    const m = g.match(/^\s*([^\[]+?):\s*(\[.*)$/);
    const name = m ? m[1] : '';
    const all = [...(m ? m[2] : g).matchAll(linkRe)].map((x) => ({ label: x[1], url: x[2] }));
    return { name, links: all.filter((l) => !isLive(l)), live: all.find(isLive)?.url || '' };
  });
  // Ungrouped single links (before · after) belong together.
  const together = groups.every((g) => !g.name && g.links.length <= 1)
    ? [{ name: '', links: groups.flatMap((g) => g.links), live: groups.map((g) => g.live).find(Boolean) || '' }] : groups;
  // A side-by-side already holds the before and the after: show it alone, never the same picture twice.
  return together.map((g) => {
    const sbs = g.links.filter((l) => /side-by-side/i.test(l.url));
    if (sbs.length) return { name: g.name, items: sbs.map((l) => ({ lone: l })), live: g.live };
    // A before and its after are ONE item (compare them side by side); any other link stands alone.
    const before = g.links.find((l) => isBefore(l.label) && isImg(l.url));
    const after = g.links.find((l) => isAfter(l.label) && isImg(l.url));
    const paired = before && after;
    const items = g.links.filter((l) => !paired || (l !== before && l !== after)).map((l) => ({ lone: l }));
    if (paired) items.unshift({ before, after });
    return { name: g.name, items, live: g.live };
  });
}

// The server renders index.md as a page; turn its table back into [label](url) text per cell.
function cellText(td) {
  return [...td.childNodes].map((n) => n.nodeName === 'A'
    ? `[${n.textContent}](${n.getAttribute('href')})` : n.textContent).join('').trim();
}

function render(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const rows = [...doc.querySelectorAll('table tbody tr')].map((tr) => [...tr.cells].map(cellText));
  if (!rows.length) { out.innerHTML = '<p class="note">No fixes listed.</p>'; return; }
  // "Look at" cell: "group: text · group: text", or plain text for a fix with one group.
function lookFor(cell, group) {
  const parts = (cell || '').split(' · ');
  const hit = parts.find((p) => group && p.startsWith(group + ':'));
  if (hit) return hit.slice(group.length + 1).trim();
  return parts.length === 1 || !group ? (cell || '').trim() : '';
}
function lookLine(text) {
  return text ? `<p class="look"><b>Look at:</b> ${esc(text)}</p>`
    : '<p class="look missing"><b>Look at:</b> not written yet. Tell us in the box what is unclear.</p>';
}

  out.innerHTML = rows.reverse().map(([fix, task, state, cell, look]) => {
    const name = (label, group, url) => url ? FOLDER + '/' + url : FOLDER + '/' + task;
    const cls = /^landed/.test(state) ? 'done' : 'wait';
    const groups = pictures(cell || '');
    const rowLive = groups.map((g) => g.live).find(Boolean) || '';
    const any = groups.some((g) => g.items.length || g.live);
    const btn = (u) => u ? `<a class="live" href="${esc(u)}">Open live mock</a>` : '';
    const idOf = (n) => `id="${esc(slug(n))}"`;
    const link = (n) => `<a class="permalink" href="#${esc(slug(n))}" aria-label="link to this item" title="link to this item">\u{1F517}</a>`;
    const textItem = (n, lk, u) => `<figure ${idOf(n)} data-item data-kind="item" data-name="${esc(n)}">${link(n)}${lk}${btn(u)}</figure>`;
    const body = !any ? textItem(name('', '', ''), lookLine(look), '') : groups.map((g) => {
      const lk = lookLine(lookFor(look, g.name));
      const u = g.live || rowLive;
      const pic = (l, lbl) => `<div class="side">${lbl ? `<span class="lbl">${lbl}</span>` : ''}<a href="${esc(l.url)}"><img loading="lazy" src="${esc(l.url)}" alt="${esc(l.label)}"></a></div>`;
      const figs = g.items.length ? g.items.map((it) => {
        if (it.lone && !isImg(it.lone.url)) return `<p><a href="${esc(it.lone.url)}">${esc(it.lone.label)}</a></p>`;
        if (it.lone) {
          const { label, url } = it.lone, n = name(label, g.name, url);
          return `<figure ${idOf(n)} data-item data-kind="picture" data-name="${esc(n)}">${link(n)}${lk}${isBefore(label) ? '' : btn(u)}${pic(it.lone, '')}</figure>`;
        }
        const n = name('', g.name, it.before.url), other = name('', g.name, it.after.url);
        return `<figure ${idOf(n)} data-item data-kind="picture" data-pair="pair" data-name="${esc(n)}" data-also="${esc(other)}">${link(n)}${lk}${btn(u)}<div class="pair">${pic(it.before, 'before')}${pic(it.after, 'after')}</div></figure>`;
      }).join('')
        : textItem(name('', '', g.live), lk, g.live);
      return `<div class="group">${g.name ? `<h3>${esc(g.name)}</h3>` : ''}<div class="${g.items.some((i) => i.lone) && !g.items.some((i) => i.before) ? 'pair' : 'items'}">${figs}</div></div>`;
    }).join('');
    return `<section class="fix"><h2>${esc(fix)}</h2><p class="meta">${esc(task)} · <span class="state ${cls}">${esc(state)}</span></p>${body}</section>`;
  }).join('');
}

const entryNo = (id) => { const m = /(\d+)$/.exec(id || ''); return m ? Number(m[1]) : NaN; };
// Entry-number order (QO271.c12 -> 12), never by time string; an entry with no number sorts by time after the numbered ones.
const byEntry = (a, b) => {
  const x = entryNo(a.id), y = entryNo(b.id);
  if (!Number.isNaN(x) && !Number.isNaN(y)) return x - y;
  if (!Number.isNaN(x)) return -1;
  if (!Number.isNaN(y)) return 1;
  return (a.at || '') < (b.at || '') ? -1 : 1;
};
const ANSWER_TIMEOUT_S = 120, DUPLICATE_MS = 10000, POLL_MS = 3000;
const shown = new Set();     // entry ids already on the page
const boxes = [];            // { fig, take(entry) -> bool } per picture
let owner = 'fable';
let newestId = '';

function said(fig, text, at, john, id) {
  const d = document.createElement('div');
  d.className = 'said' + (john ? ' john' : '');
  if (id) { d.dataset.id = id; shown.add(id); }
  d.textContent = `${john ? 'You' : 'Agent'}${at ? ' · ' + new Date(at).toLocaleDateString('en-GB', {day:'numeric', month:'short'}) : ''}: ${text}`;
  fig.querySelector('form').before(d);
  return d;
}

function noteNewest(id) { if (id && (!newestId || entryNo(id) > entryNo(newestId))) newestId = id; }
const stripTag = (t) => t.replace(/^\[(picture|item): [^\]]*\]/, '').trim();

// "<owner> is answering… 0:03" under John's entry, counting; the answer replaces it; after 120 s it says nobody has answered yet.
function waitingLine(after, id, since) {
  const line = document.createElement('div'); line.className = 'sent'; line.dataset.for = id;
  const t0 = since;
  const paint = () => {
    const s = Math.floor((Date.now() - t0) / 1000);
    if (s >= ANSWER_TIMEOUT_S) { line.textContent = `No answer yet; ${owner} will answer.`; line.dataset.late = '1'; clearInterval(line._t); return; }
    line.textContent = `Sent, ${owner} is answering… ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };
  paint(); line._t = setInterval(paint, 1000);
  after.after(line);
}
function stopWaiting(fig) {
  for (const l of fig.querySelectorAll('.sent')) { clearInterval(l._t); l.remove(); }
}

function commentBoxes(thread) {
  for (const fig of document.querySelectorAll('figure[data-item]')) {
    const n = fig.dataset.name;
    const f = document.createElement('form'); f.className = 'cm';
    f.innerHTML = `<textarea rows="2" aria-label="Comment on ${esc(n)}" placeholder="Your comment"></textarea><button type="submit">Send</button>`;
    const err = document.createElement('div'); err.className = 'cm-err'; err.hidden = true;
    fig.append(f, err);
    const also = fig.dataset.also;  // a pair holds two pictures: comments on either belong to it
    const tagged = (t, m) => typeof t.text === 'string' && (t.text.startsWith(`[${fig.dataset.kind}: ${m}]`) || t.text.startsWith(`[picture: ${m}]`) || t.text.startsWith(`[item: ${m}]`));
    // An answer, reply, decision or reopen names the entry it is about, not the picture: it goes where that entry is.
    const own = new Set();
    const onPicture = (t) => t.picture === n || (also && t.picture === also) || tagged(t, n) || (also && tagged(t, also));
    const linked = (t) => [t.answers, t.replies_to, t.decides, t.reopens].some((r) => r && own.has(r));
    const belongs = (t) => onPicture(t) || linked(t);
    const mine = [...thread].sort(byEntry).filter((t) => belongs(t) && (own.add(t.id), true));
    const divs = mine.map((t) => said(fig, stripTag(t.text), t.at, t.by === 'John', t.id));
    // John's comment is the last word on it: he has ruled, so it is folded where it stands until an agent answers.
    const johnOnBefore = mine.some((t) => t.by === 'John' && (t.picture === n || tagged(t, n)));
    const lastE = mine[mine.length - 1];
    // After a reload, a John question nobody has answered yet shows the answering line again, counted from its time.
    const open = lastE && lastE.by === 'John' && lastE.kind === 'question' && Date.parse(lastE.at) > 0;
    if (open) waitingLine(divs[divs.length - 1], lastE.id, Date.parse(lastE.at));
    else if (lastE && lastE.by === 'John' && (!also || johnOnBefore)) fig.dataset.ruled = '1';
    boxes.push({ fig, take(t) {
      if (!belongs(t) || (t.id && shown.has(t.id))) return false;
      own.add(t.id);
      const john = t.by === 'John';
      said(fig, stripTag(t.text), t.at, john, t.id);
      if (!john) { stopWaiting(fig); unfold(fig); }
      return true;
    } });
    const ta = f.querySelector('textarea'), btn = f.querySelector('button');
    let last = { text: '', at: 0 };
    const refresh = () => { btn.disabled = ta.value.trim() === last.text && Date.now() - last.at < DUPLICATE_MS; };
    ta.addEventListener('input', refresh);
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const words = ta.value.trim();
      if (!words) return;
      refresh(); if (btn.disabled) return;
      btn.disabled = true; btn.textContent = 'Sending…'; err.hidden = true;
      // His entry shows in place at once and the box clears; the server takes about a second to save it.
      const d = said(fig, words, new Date().toISOString(), true, '');
      const sending = document.createElement('div'); sending.className = 'sending'; sending.textContent = 'Sending…';
      d.after(sending); ta.value = ''; ta.focus({ preventScroll: true });
      const undo = (why) => { sending.remove(); d.remove(); ta.value = words; err.textContent = why; err.hidden = false; btn.textContent = 'Send'; };
      try {
        const r = await fetch('/board/api/inbox', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kind: 'comment', item: ITEM, text: `[${fig.dataset.kind}: ${n}] ${words}` }) });
        if (r.ok) {
          const id = (await r.json().catch(() => ({}))).id || '';
          sending.remove();
          if (id) { d.dataset.id = id; shown.add(id); }
          if (/\.c\d+$/.test(id)) { own.add(id); waitingLine(d, id, Date.now()); noteNewest(id); }
          last = { text: words, at: Date.now() };
          btn.textContent = 'Sent'; ta.focus({ preventScroll: true });
          setTimeout(() => { btn.textContent = 'Send'; }, DUPLICATE_MS);
          pollThread(true);
        } else undo((await r.text()) || `Not sent: HTTP ${r.status}`);
      } catch (x) { undo(`Not sent: ${x.message}`); }
      btn.disabled = false; refresh();
    });
  }
}

// Answered pictures stay where they are in the page order, each in its own closed fold.
function foldRuled() {
  const ruled = [...document.querySelectorAll('figure[data-item][data-ruled]')];
  for (const fig of ruled) {
    const fold = document.createElement('details'); fold.className = 'ruled';
    fold.innerHTML = '<summary>Answered: tap to show</summary>';
    fig.before(fold); fold.append(fig);
  }
  if (ruled.length && !out.querySelector('figure[data-item]:not([data-ruled])')) out.insertAdjacentHTML('afterbegin', '<p class="note">Nothing new to look at: every picture here has your answer.</p>');
}
function unfold(fig) { const d = fig.closest('details.ruled'); if (d) { d.replaceWith(fig); delete fig.dataset.ruled; } }

// Live: while the page is visible, ask for entries after the newest one known, every 3 s.
let polling = false;
async function pollThread(force) {
  if (polling || (document.hidden && !force)) return;
  polling = true;
  try {
    const r = await fetch(`/board/api/thread?item=${encodeURIComponent(ITEM)}&since=${encodeURIComponent(newestId)}`, { cache: 'no-store' });
    if (!r.ok) return;
    const res = await r.json();
    for (const t of (res.entries || []).sort(byEntry)) { noteNewest(t.id); for (const b of boxes) b.take(t); }
  } catch (x) { /* the next tick retries */ } finally { polling = false; }
}
setInterval(() => pollThread(false), POLL_MS);

// Deep link: index.html#<id> opens the answered fold if needed, scrolls to the item and rings it.
function goToHash() {
  document.querySelectorAll('figure.here').forEach((f) => f.classList.remove('here'));
  const id = decodeURIComponent(location.hash.slice(1));
  const el = id && document.getElementById(id);
  if (!el) return;
  const fold = el.closest('details.ruled'); if (fold) fold.open = true;
  el.classList.add('here');
  el.scrollIntoView({ block: 'center' });
}
addEventListener('hashchange', goToHash);

const threadP = fetch('/board/api/items', { cache: 'no-store' })
  .then((r) => (r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
  .then((b) => { const it = b.items.find((i) => i.id === ITEM); owner = it?.owner || 'fable'; const th = it?.thread || []; th.forEach((t) => noteNewest(t.id)); return th; })
  .catch((x) => { const e = document.createElement('p'); e.className = 'cm-err'; e.textContent = `Earlier comments not loaded: ${x.message}`; document.body.prepend(e); return []; });

fetch('index.md?html', { cache: 'no-store' })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(render)
  .then(() => threadP).then(commentBoxes).then(foldRuled).then(goToHash)
  .catch((e) => { out.innerHTML = `<p class="note">Could not read index.md (${esc(String(e))}).</p>`; });
</script>
</body>
</html>
