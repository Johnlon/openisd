- id: QO15
  title: 'Driver editor unit/binding defects: SPLref vs SPL, fLe scale x1000, VCCon 0/1 vs WinISD 1/2,
    Dimensions in metres, Thick in inches'
  status: decided
  raised: '2026-08-05'
  body: ''
  notes:
  - at: '2026-08-05'
    text: |-
      Six concrete binding/unit defects found reading DriverEditorModal.vue against the model and
      confirmed against the live panel. These are BUGS, not decisions — listed here so they are not
      lost, and because several are one-line fixes that should land with the QO14 work.

      1. SPL FIELD IS PERMANENTLY BLANK. Template line 415 reads cellVal('SPLref'), but the ADT
         writes the derived value to `SPL` (packages/winisd/src/driver.ts:382, r.SPL = 112.1 + 10log10(no)).
         Confirmed live: `no` shows 0.37 and SPL shows empty on a driver where both are derivable.

      2. TWO FORMULAS AND TWO CONVENTIONS FOR `no`, both live. The ADT computes it as a FRACTION
         (4pi^2/c^3 * Fs^3*Vas/Qes, driver.ts:381) and the editor multiplies by 100 to show a %.
         The engine's deriveDriver computes it as 9.64e-10*Fs^3*Vas_L/Qes and then treats it as a
         PERCENT (SPLref = 112.2 + 10log10(no/100), engine/src/driver.ts:163-165). Also 112.1 vs
         112.2. Both files carry comments saying this is unresolved; it is now user-visible.

      3. fLe SCALE IS INVERTED. `:scale="1000"` with unit kHz means display = SI x 1000, i.e. Hz
         shown as (Hz x 1000) labelled kHz — out by 1e6. To show Hz as kHz the scale is 1e-3.

      4. VCCon MAPPING CONTRADICTS THE FILE FORMAT. The select offers 0=Parallel / 1=Series
         (template line 424), but the WDR/WinISD convention this repo documents elsewhere is
         1=parallel / 2=series (DriverDefineModal PARAMS entry: unit '1(parallel)/2(series)'). A
         driver carrying VCCon=2 matches no option and renders blank.

      5. Voicecoils shows blank where fromWdr defaults it to 1 — the editor reads cellVal('numVC')
         and nothing derives it, so an unspecified DVC count reads as "no answer" not "1".

      6. DIMENSIONS TAB UNITS. Depth/MagnetDepth/Magnet/Basket/Outer/VCd are labelled `m` with
         scale 1 (a 6.5" driver's basket reads 0.165), while the Parameters tab shows Xmax/Hc/Hg in
         mm — and `Thick` is labelled `in` with no conversion at all, so it prints metres under an
         inches label. WinISD shows these in mm.

      7. Dd is shown in metres at 2 dp (0.13 m) because `precision` defaults to 2 for any field
         with no registry entry — +/- 5 mm of resolution on a cone diameter.
  answer:
    at: '2026-08-13'
    text: |-
      "My recommendation: dispatch an agent to fix 1, 3, 4, 5, 6, 7 with tests, and treat #2 as its own question resolved by WinISD evidence rather than preference." << YEs background now

      D1 SPL FIELD BLANK — ALREADY FIXED before this pass, no work needed. The editor binds
      cellVal('SPL') (DriverEditorModal.vue, the SPL field in Miscellaneous parameters), which is
      exactly what the ADT writes (packages/winisd/src/driver.ts:422). No cellVal('SPLref') exists
