      (fromJSON, authored in-app) left it absent, so the editor rendered N/blank where WinISD shows 1
      (docs/winisd/edit_driver_pg2_parameters.png). Added `if (r.numVC == null) r.numVC = 1;` to
      Driver#derive, beside the existing c/roo autofills — same mechanism, so it reads C (Calculated),
      not E: the app supplied it, not a human. An entered value still overrides and marks E.
      Tests: packages/winisd/test/driver-derive.test.ts :: "numVC autofills to 1 as C on every
      construction path, not only fromWdr" and "an entered numVC overrides the default and is marked
      E"; plus driver-editor-units.test.ts :: "Voicecoils reads 1 on a driver that never specified a
      coil count".

      D6 DIMENSIONS TAB UNITS — FIXED, and QO15's premise about WinISD was wrong. Primary evidence
      (docs/winisd/edit_driver_pg4_dimensions.png, the real WinISD Dimensions tab) shows WinISD
      displaying Depth/Magnet Depth/Magnet/Basket/Outer/VCd in **m** at 3 dp, Thick in **in**, Dvol in
