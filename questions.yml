- id: QO2
  title: "Question numbering \u2014 the prefix names the LEDGER"
  status: done
  raised: '2026-08-05'
  body: "## Question numbering \u2014 the prefix names the LEDGER\n\nEvery question\
    \ ID carries a directory prefix, so a Q-number is unique across the whole\nworkspace\
    \ and a cross-repo reference is unambiguous. **This repo's prefix is `QO`.**\n\
    \n| prefix | ledger | what lives there |\n|---|---|---|\n| `QP` | `winisd/TODO.md`\
    \ | **P**arent \u2014 workspace-wide and parent-dir matters |\n| `QT` | `winisd_tools/TODO.md`\
    \ | **T**ools \u2014 the scraping pipeline |\n| `QD` | `winisd_drivers/TODO.md`\
    \ | **D**atabase \u2014 the driver data repo |\n| `QO` | `openisd/TODO.md` | **O**penisd\
    \ \u2014 this file: the Vue/TS app and engine |\n| `QR` | `winisd_research/TODO.md`\
    \ | **R**esearch \u2014 WinISD behaviour investigation |\n\nNumbers run independently\
    \ per ledger: `QT1` and `QO1` are different questions. **Never write\na bare `Q12`**\
    \ \u2014 with five ledgers it names nothing.\n\nFormat:\n\n    ### QOn. <one-line\
    \ question> \u2014 UNDECIDED\n    - [ ] **UNDECIDED:** [QOn] <what is being decided,\
    \ and what it costs either way>\n\nStatus prefixes: `UNDECIDED:` awaiting a human\
    \ ruling \xB7 `DECIDED:` ruled, not yet coded \xB7\n`IMPLEMENTED:` coded and verified.\
    \ When the human rules, flip the status and write the\nruling inline under `**Answer:**`\
    \ in the SAME turn.\n"
  notes:
  - at: '2026-08-05'
    text: "Migrated verbatim from openisd/TODO.md. May be a TASK rather than a decision\
      \ \u2014 needs triage."
  - at: '2026-08-05'
    text: "not a question \u2014 migrated numbering table"
  answer:
    at: '2026-08-05'
    text: close
