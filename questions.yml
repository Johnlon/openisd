- id: QO2
  title: Question numbering — the prefix names the LEDGER
  status: done
  raised: '2026-08-05'
  body: |
    ## Question numbering — the prefix names the LEDGER

    Every question ID carries a directory prefix, so a Q-number is unique across the whole
    workspace and a cross-repo reference is unambiguous. **This repo's prefix is `QO`.**

    | prefix | ledger | what lives there |
    |---|---|---|
    | `QP` | `winisd/TODO.md` | **P**arent — workspace-wide and parent-dir matters |
    | `QT` | `winisd_tools/TODO.md` | **T**ools — the scraping pipeline |
    | `QD` | `winisd_drivers/TODO.md` | **D**atabase — the driver data repo |
    | `QO` | `openisd/TODO.md` | **O**penisd — this file: the Vue/TS app and engine |
    | `QR` | `winisd_research/TODO.md` | **R**esearch — WinISD behaviour investigation |

    Numbers run independently per ledger: `QT1` and `QO1` are different questions. **Never write
    a bare `Q12`** — with five ledgers it names nothing.

    Format:

        ### QOn. <one-line question> — UNDECIDED
        - [ ] **UNDECIDED:** [QOn] <what is being decided, and what it costs either way>

    Status prefixes: `UNDECIDED:` awaiting a human ruling · `DECIDED:` ruled, not yet coded ·
    `IMPLEMENTED:` coded and verified. When the human rules, flip the status and write the
    ruling inline under `**Answer:**` in the SAME turn.
  notes:
  - at: '2026-08-05'
    text: Migrated verbatim from openisd/TODO.md. May be a TASK rather than a decision — needs triage.
  - at: '2026-08-05'
    text: not a question — migrated numbering table
  answer:
    at: '2026-08-05'
    text: close
