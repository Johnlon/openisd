  - at: '2026-08-05'
    text: "2026-08-05 \u2014 BOTH ROUTES ARE REAL, and they are ORDERED. Human ran\
      \ the test:\n\n  \"If I set Vd to 0 it's not entered, then the other calc kicks\
      \ in of Hc and Hg - but Vd/Sd\n   takes precedence\"\n\nSo row 19 (Xmax = abs(Hc-Hg)/2)\
      \ is LIVE code in WinISD, not a dormant relation. It had simply\nnever been\
      \ seen because row 20 outranks it and Vd is almost always present. My \"no evidence\n\
      for route 1\" was right about the evidence and wrong about the conclusion \u2014\
      \ the precondition\nhad never been cleared, and clearing it is what exposed\
      \ the behaviour.\n\n  priority 1   Xmax = Vd / Sd            (row 20, run backwards)\n\
