  title: 'Box/vents/PRs have no facade: flat state.P fields + a parallel ''entered'' provenance system'
  status: decided
  raised: '2026-08-14'
  body: ''
  notes:
  - at: '2026-08-14'
    text: |-
      The driver got ManagedDriver; the rest of the project did not.

      WHERE THEY LIVE NOW (verified 2026-08-14):
      - Vents and PRs are FLAT FIELDS in state.P (store.ts P_DEFAULTS): Vb, Vf, ventShape,
        ventD, ventW, ventH, ventL, Fb, Frc / prSd, prNum, prMmd, prMadd, prCms, prRms,
        prXmax, prFp, prName, prMode. No object, no owner - any component can write them.
      - Their provenance is state.P.entered, a Record<string,true> where presence means
        Entered. That is a SECOND, hand-rolled E/C/N system, unrelated to the driver's
        SpecEntry/origin/readings + cell().state.
      - Their solving is in logic/useVentGroup.ts (solveVentGroup) and logic/usePrGroup.ts
        (solvePrGroup), driven by two watch()ers in store.ts, with enterVentField/
        clearVentField/ventFieldState/ventTargetUnreachable/ventMaxReachableFb and
        enterPrField/clearPrField/prFieldState/prTargetUnreachable wrapping them.

      THE QUESTION: the store owns the PROJECT - box, vents, PRs, filters, environment,
      metadata - not merely persistent scalars plus a ManagedDriver. Should each of those
      get the same treatment the driver got (an owning facade with one provenance model),
      or does the project get ONE facade covering all of them?

      This is the same structural weakness the driver had before ManagedDriver existed:
      one concept, no owner, written from anywhere.
  - at: '2026-08-14'
    text: |-
      THE ASYMMETRY IS ARBITRARY, not designed (human, 2026-08-14). Verified state:

                    facade          provenance              what-if            solver
        driver      ManagedDriver   SpecEntry/origin/       ManagedDriver      solveConsistencyGroup
                                    readings, cell().state  (built, gated)
        vent        NONE            state.P.entered (27x    NONE               solveVentGroup
                                    in useVentGroup.ts)
        PR          NONE            state.P.entered (13x    ??? see below      solvePrGroup
                                    in usePrGroup.ts)

      Three group solvers of the same kind. TWO unrelated provenance mechanisms for one
      E/C/N concept. One facade out of three.

      UNRESOLVED - PREditModal.vue:14 names "PRWhatIfPanel" in a comment. No such
      component exists anywhere in packages/ui/src; that comment is the ONLY match for
      the string in the whole source tree. Either it was designed and never built, or
      built and deleted leaving the reference behind. NOT investigated - flagged rather
      than guessed. Establish which before deciding the PR's what-if story.
  answer:
    at: '2026-08-14'
    text: |-
      RULED (human, 2026-08-14): ManagedDriver DIES. ManagedProject replaces it.

      "the entire project enters a whatif NOT a driver or pr or box or vent config in
      isolation - we need an OpenIsdProject object that encapsulates the driver pr vents
      (3 or 4 different kinds) and also handle the what ifs at the project level not
      driver level - managed driver dies. ManagedProject contains OpenIsdProject (ground,
      modified, whatif/edit) and the driver + pr and other components and data sit within
      the project."

        ManagedProject { ground, modified, overlay }  each an OpenISDProject
        OpenISDProject { driver: OpenISDDriver, box, vents, radiators, filters,
                         environment, signal, metadata }

      OpenISDDriver's job is unchanged - it maps openisd.yml and owns the driver's fields
      and provenance - but it becomes a MEMBER of OpenISDProject rather than a thing
      wrapped alone.

      EVIDENCE THIS IS RIGHT, from the code as it stands: OgTune.vue opens a "driver"
      what-if then scrubs Vb, a BOX value the driver what-if cannot cover, so it
      hand-rolls a one-field undo:
          let vbSnapshot = state.P.Vb;
          function cancel() { managedDriver.cancelWhatIf(); state.P.Vb = vbSnapshot; ... }
      That snapshot exists only because the overlay was drawn around the wrong object.

      This also resolves this question's original subject: vents and PRs stop being flat
      state.P fields with a parallel `entered` provenance system and become members of
      OpenISDProject under ONE provenance model, with the edit/what-if lifecycle covering
      all of them at once.

      Recorded in ARCHITECTURE.md as target state, and in HANDOVER.md.
