- id: QO25
  title: 'Understand @openisd/engine and @openisd/winisd: what each package is for,
    and why both export

    a type/class named `Driver`'
  status: decided
  raised: '2026-08-12'
  body: ''
  answer:
    at: '2026-08-13'
    text: "These are guikd to be revised in the reqorkign coming up -\n\nExplanation\
      \ recorded; the driver types are revised in the upcoming rework, so no separate\
      \ action.\n\nWHAT THE TWO PACKAGES ARE:\n  @openisd/engine  -- the physics.\
      \ Pure functions, zero dependencies: sweeps, alignments, filters,\n    circuits,\
      \ the T/S consistency solver. Its `Driver` (packages/engine/src/types.ts:113)\
      \ is an\n    INTERFACE extending DriverRaw, requiring Fs/Re/Sd/Vas/Qts/Qes/Qms/Cms/Mms/Rms/Bl\
      \ non-null. It is\n    the RESULT type of deriveDriver: \"a driver with nothing\
      \ missing, ready to simulate\".\n  @openisd/winisd  -- WinISD interop: .wdr/.wpr\
      \ parse and serialise, ParState E/C/N provenance. Its\n    `Driver` (packages/winisd/src/driver.ts:117)\
      \ is a CLASS: the editable document. It holds\n    #inputs (what the human entered\
      \ => state E), a memoised derivation dropped on every mutation,\n    memoised\
      \ consistency issues, the autoCalculate toggle, and change listeners.\n\nSo\
      \ engine's Driver is a RESULT and winisd's Driver is a DOCUMENT. They are not\
      \ two versions of one\nconcept. packages/winisd/src/driver.ts:27 already imports\
      \ engine's as EngineDriver to keep the two\napart at the call site.\n\nFOUR\
      \ driver-shaped types are in play -- DriverRaw, engine Driver, winisd Driver,\
      \ OpenISDDriver --\nand ARCHITECTURE.md AD-9 already plans DriverRaw's retirement\n\
      (noted at packages/winisd/src/native/openisdDerive.ts:54). Per this ruling that\
      \ consolidation lands\nwith the upcoming rework rather than as its own pass."
