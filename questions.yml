- id: QO38
  title: 'Layering ruling: ui depends on logic; logic consumes services (driver_db,
    browser stores, file io, diagnostics)'
  status: decided
  raised: '2026-08-13'
  body: ''
  notes:
  - at: '2026-08-13'
    text: "RULED by the human 2026-08-13, verbatim:\n\n  \"ui shoudl depende on logic\
      \ and logic uses servcices like the driver_db and internal browser\n   stores\
      \ abdn file io and diagnostics etc.\"\n\nTHE LAYERING:\n\n    ui  ->  logic\
      \  ->  services  ->  engine / serialisation\n\n  ui         presentation only.\
      \ Depends on `logic` and NOTHING else. It does not reach past it\n         \
      \    into a service.\n  logic      the app's orchestration and its model. Owns\
      \ the store, the project, the driver\n             model, the workflows. CONSUMES\
      \ services; is consumed only by ui.\n  services   driver_db, the browser-local\
      \ stores (localStorage: My Drivers, favourites,\n             session), file\
      \ I/O, diagnostics, logging. Each takes arguments and returns data.\n      \
      \       A service NEVER reads or writes the app's global `state`.\n  engine\
      \     pure physics. Serialisation (.wdr/.wpr) is the other leaf, reached from\
      \ logic.\n\nVIOLATIONS IN THE TREE TODAY, measured 2026-08-13:\n\n  1. `db ->\
      \ logic` -- BACKWARDS. `packages/ui/src/db/useDriverLibrary.ts:5,10` imports\
      \ `state`,\n     `driverShort`, and the favourites persistence from `logic/`;\
      \ `db/useDriverSelection.ts:6`\n     imports `state`, `setDriverFromSerialized`,\
      \ `getDriverModel`, `setDriverBaseline`,\n     `cancelDriverWhatIf`, `isDriverWhatIfActive`.\
      \ No cycle exists (nothing in `logic/` imports\n     `db/`), but the arrow points\
      \ the wrong way.\n\n  2. THE CAUSE: `db/` is not a store. It mixes genuine data\
      \ access (library index, search, My\n     Drivers persistence) with UI WORKFLOW.\
      \ `useDriverSelection.ts` is \"the user chose a driver\":\n     it sets `state.browseOpen`,\
      \ `state.editDriverInfo`, `state.editDriver` and cancels the\n     what-if overlay.\
      \ `useDriverLibrary.ts:747` even `watch`es `state.editDriverInfo` to reload.\n\
      \     Controller code cannot help reaching up into the store -- that is why\
      \ the dependency\n     inverted.\n\n  3. `ui -> db`, `ui -> diagnostics`, `ui\
      \ -> logging` -- ui reaching past logic directly into\n     services.\n\nTHE\
      \ FIX, and it is structural, not cosmetic:\n  - The workflow half of `db/` moves\
      \ UP into `logic/`. \"The user chose a driver\" is orchestration.\n  - What\
      \ remains in `db/` becomes a real service: arguments in, data out, no `state`\
      \ import.\n  - ui's imports of db/diagnostics/logging are routed through logic.\n\
      \  - A mechanical gate should then enforce the layering by import SHAPE, so\
      \ a new file cannot\n    reintroduce the inversion silently.\n\nINTERLOCK WITH\
      \ THE MODEL MIGRATION (QO36): the migration rewrites exactly these files --\
      \ the\nstore, the driver model, the library. Doing the layering fix as part\
      \ of it is one pass; doing it\nafter is two rewrites of the same code."
