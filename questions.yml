      \ it before any parser sees it. .wpr included \u2014 it embeds its\n     [Driver]\
      \ block verbatim.\n  2. `OpenISDDriverJson`/`Project` -> `OpenISDDriver`/`OpenISDProject`.\
      \ As declared today it hands\n     the private record shape to the UI, which\
      \ the standing ruling forbids without exception, and\n     it could not compile\
      \ past the current gate.\n  3. The DESTINATION half splits into a separate `FileStore`\
      \ port (open/save/saveAs over a\n     FileSystemFileHandle or a download). FileIO\
      \ is then PURE \u2014 bytes in, bytes out, no browser,\n     no clock, no dialog\
      \ \u2014 which is what makes it unit-testable.\n\nThe export picker in DriverEditorModal.vue\
      \ is the one place a format is genuinely a runtime value;\nit maps its dropdown\
      \ choice to a method locally rather than the interface carrying a discriminator.\n\
      \nThis is plan objective 6. ARCHITECTURE.md still lists createFileIO as \"not\
      \ yet built\", which stays\ntrue until it lands."
- id: QO62
  title: 29 bundled .wdr files are not UTF-8 - what should the reader do, and what
    does WinISD actually write?
  status: decided
  raised: '2026-08-21'
  body: ''
  notes:
  - at: '2026-08-21'
    text: "29 of 1626 bundled `.wdr` files (all in `drivers/winisd/`, the third-party\
      \ set \u2014 NOT the\nWinISD-written oracles in `drivers/sample/winisd/`) are\
      \ not valid UTF-8 even once the 0xA4\nnewline sentinels are removed. `wdrBytesToText`\
      \ decodes UTF-8, so those files' non-ASCII\ncharacters become replacement characters\
      \ on import.\n\nWHAT THE BYTES ACTUALLY SHOW (measured 2026-08-21, not assumed):\n\
      Every non-ASCII byte in those 29 files, excluding the 0xA4 sentinel:\n  0x95\
      \ x52   latin-1: undefined C1 control   cp1252: \u2022\n  0xae x13   latin-1:\
      \ \xAE                      cp1252: \xAE   (identical)\n  0xb1 x3    latin-1:\
      \ \xB1                      cp1252: \xB1   (identical)\n  0xbd x1    latin-1:\
      \ \xBD                      cp1252: \xBD   (identical)\n  0xe6 x1 / 0xff x2\
      \ \u2014 appear in 'reproductio \xFF\xFF h a \xE6 ...n of low frequencies',\n\
      \                      which is garbage in EVERY encoding; the source data looks\
      \ damaged.\n\nSo only ONE byte, 0x95, discriminates cp1252 from latin-1, and\
      \ only in one address line\n('RNL Audio \u2022 5035 NW 37th Avenue \u2022 Fort\
      \ Lauderdale'), where a bullet reads as intended\ntext and a C1 control does\
      \ not. That is suggestive, NOT proof. The claim \"these were\nwritten as CP1252\"\
      \ is NOT established.\n\nWHAT IS ESTABLISHED: the bytes are single-byte high-Latin\
      \ and are definitely not UTF-8.\n\nWHAT IS NOT KNOWN, and is the more important\
      \ half: what encoding does WinISD ITSELF write?\n`drivers/sample/winisd/driver-with-unicode-text.wdr`\
      \ (WinISD-written) holds \u20AC as UTF-8\nE2 82 AC and \u6F22\u5B57 as UTF-8\
      \ \u2014 so WinISD writes UTF-8 there. The 29 files are a third-party\ndatabase\
      \ export and say nothing about WinISD's own behaviour.\n\nTHE DECISION NEEDED:\n\
      (a) fall back to CP1252 when the UTF-8 decode fails, per file; or\n(b) keep\
      \ the decode strict and surface a damaged-file import warning naming the byte\
      \ offset,\n    treating the 29 files as data to FIX at source; or\n(c) something\
      \ else.\n\nBLOCKED ON: the wine probe of how WinISD encodes a character whose\
      \ UTF-8 carries 0xA4 as a\ncontinuation byte (\xA4 = C2 A4). If WinISD writes\
      \ a bare 0xA4 for \xA4, the format is genuinely\nambiguous and this whole area\
      \ needs rethinking, not just a fallback."
  - at: '2026-08-21'
    text: "C1 implementation status: wdrBytesToText now returns {text, encoding} (WdrEncoding\
      \ string enum, utf-8|cp1252); the API reports the encoding used. The UI display\
      \ of that fact ('the UI can say so') is NOT yet wired \u2014 intended surface:\
      \ the import status line in driverLibrary.ts (statusMsg). Outstanding until\
      \ surfaced."
  answer:
    at: '2026-08-21'
    text: "HUMAN RULING, verbatim: \"62 - since classic winisd ONLY works on windows\
      \ it is quite likely that\nexisting wdr wpr files have cp1252 - so yes build\
      \ in an appropriate encoding for old files, but\nour own writes need to be compat\
      \ where possible\"\n\nDECIDED \u2014 READ: accept legacy single-byte encoding.\
      \ A .wdr/.wpr that does not decode as UTF-8 is\ndecoded as CP1252 rather than\
      \ yielding replacement characters. The reasoning is the human's and it\nis stronger\
      \ than the byte evidence alone: classic WinISD is Windows-only, so its native\
      \ output and\neverything written alongside it is overwhelmingly likely to be\
      \ the Windows ANSI codepage. That is\na statement about the population of files,\
      \ which one address line's 0x95 could never establish.\n\nDECIDED \u2014 WRITE:\
      \ our own output stays compatible where possible.\n\nWHAT THE PROBE ESTABLISHED,\
      \ and why it does not contradict the ruling\n(winisd_research/COMMENT_ENCODING.md,\
      \ measured 2026-08-21 against the real WinISD.exe under wine):\n  - WinISD WRITES\
      \ UTF-8. Typed characters came back as C2 A4 (\xA4), D0 A4 (\u0424), E0 A4 84\
      \ (\u0904), and an\n    Enter keystroke as a bare A4. So the newline sentinel\
      \ is distinguishable by UTF-8 LEAD\n    POSITION, which packages/winisd/src/wdrBytes.ts\
      \ already implements.\n  - WinISD does NOT decode CP1252. Loading the CP1252\
      \ file drivers/winisd/Selenium SW108 .wdr\n    displays literal '?' glyphs,\
      \ and a no-edit re-save is DESTRUCTIVE: FF FF -> ??, E6 -> ?,\n    AE -> ?,\
      \ so \"Kapton\xAE\" silently becomes \"Kapton?\".\nSo current WinISD writes\
      \ UTF-8 while OLDER files in circulation are CP1252 \u2014 the two facts are\n\
      about different eras, and the ruling covers the era WinISD itself mishandles.\n\
      \nCONSEQUENCE WORTH STATING: on these files OpenISD will read BETTER than WinISD\
      \ does, and will\nround-trip content WinISD destroys.\n\nWORK (tracked, not\
      \ a further decision):\n  - packages/winisd/src/wdrBytes.ts \u2014 wdrBytesToText\
      \ currently ends in a non-fatal\n    TextDecoder('utf-8'), so bad bytes become\
      \ U+FFFD silently. Decode UTF-8 STRICT (fatal), and on\n    failure re-decode\
      \ the whole file as CP1252. Per FILE, not per character \u2014 a mixed-encoding\
      \ file\n    is not a thing WinISD can produce.\n  - Report which encoding was\
      \ used, so the UI can say so rather than the choice being invisible.\n  - WRITE\
      \ stays UTF-8, which is what WinISD itself writes today, so our output is compatible\
      \ with\n    current WinISD. Where a character cannot survive a consumer that\
      \ expects the legacy codepage,\n    compatibility is best-effort \u2014 we do\
      \ not degrade our own records to match a lossy reader.\n  - Tests: drivers/winisd/Selenium\
      \ SW108 .wdr must read back with '\u2022' (0x95), '\xAE' (0xAE), '\xB1',\n \
      \   '\xBD' intact. Its FF FF / E6 run is garbage in EVERY encoding (spliced\
      \ mid-word into\n    \"reproduction\") and is source damage to fix separately\
      \ \u2014 it must not be used as an\n    encoding-correctness oracle."
