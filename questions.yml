- id: QO23
  title: Is WinISD's field solver PRECEDENCE-ordered or LAST-EDIT-WINS? One 3-edit
    test settles it
  status: decided
  raised: '2026-08-05'
  body: ''
  notes:
  - at: '2026-08-05'
    text: "Raised 2026-08-05 by the human:\n\n  \"Sd is also influenced by Dd - hmm\
      \ it's a big graph where some values are definitely entered\n   or not entered,\
      \ at the same time it looks like the last manual update determines the\n   calculated\
      \ values.\"\n\nTHE CORRECTION THIS FORCES. I recorded in WDR_SCHEMA 4.1 that\
      \ WinISD has a FIXED PRECEDENCE\nbetween two routes to Xmax (Vd/Sd outranking\
      \ abs(Hc-Hg)/2). That was one observation \u2014 Vd\npresent, Vd wins \u2014\
      \ and it does NOT distinguish precedence from recency. If the rule is \"last\n\
      manual edit wins\", Vd won because it was typed later, and the precedence I\
      \ documented is my\ninvention. 4.1 has been corrected to state both hypotheses\
      \ and to warn against building on\neither.\n\nRECENCY EXPLAINS MORE THAN PRECEDENCE\
      \ DOES:\n  - Hc/Hg flipping C <-> N: they are C when reachable from the current\
      \ anchor, N when not.\n  - Qts pinning when entered: the anchor is whatever\
      \ was touched last.\n  - Why WinISD never warns about an inconsistency: there\
      \ is nothing to warn about if the graph\n    simply re-solves around the newest\
      \ edit. This would also explain the TfrmParErrors dialog\n    that exists in\
      \ the binary but was never observed firing (WDR_SCHEMA 4).\n\nIT IS ONE GRAPH,\
      \ NOT INDEPENDENT GROUPS. Dd = 2*sqrt(Sd/pi) (row 6) makes Sd two-way with Dd,\n\
      and Sd also sits in row 20 {Vd, Sd, Xmax}, so Dd <-> Sd <-> {Vd, Xmax} is a\
      \ single connected\ncomponent: editing Dd can propagate as far as Xmax.\n\n\
      THE TEST \u2014 three edits in WinISD, five minutes:\n  1. Enter Hc and Hg.\
      \ Xmax should take the geometry answer.\n  2. Enter Vd. Check Xmax switches\
      \ to Vd/Sd.\n  3. Re-edit Hc.\n     Xmax returns to abs(Hc-Hg)/2  -> RECENCY.\n\
      \     Xmax stays on Vd/Sd           -> PRECEDENCE.\n\nWHY IT MATTERS BEYOND\
      \ CURIOSITY. If the rule is recency, then WinISD's C/E/N marks are not a\nproperty\
      \ of the DATA at all \u2014 they are a property of the EDIT HISTORY, and the\
      \ same .wdr opened\ntwice with different edit sequences carries different marks.\
      \ That would make ParState\nunreproducible from a record alone, which bears\
      \ directly on QP8's emit rules and on QO8's\nparity suite."
  - at: '2026-08-05'
    text: "2026-08-05 \u2014 TIE-BREAK ESTABLISHED, completing the rule closed above.\n\
      \nWhen two relations could each fill the same hole, row 20 (Vd = Sd x Xmax)\
      \ LOSES. It is the\nfallback, used only when nothing else can supply the field.\
      \ Observed twice:\n\n  hole    competing routes                            \
      \  winner\n  Xmax    row 19 |Hc-Hg|/2   vs  row 20 Vd/Sd           row 19\n\
      \  Sd      row 6  pi.Dd^2/4   vs  row 20 Vd/Xmax         row 6\n\nPhysically\
      \ consistent: Dd and Hc/Hg are measured geometry; Vd is a displacement volume\
      \ derived\nFROM geometry. WinISD treats row 20 as producing Vd and only runs\
      \ it backwards as a last resort.\n\nThis retro-explains the FIRST observation\
      \ of the session \u2014 Xmax appearing to come from Vd/Sd\n\"in preference\"\
      \ to the geometry route. It did not: Hc and Hg were blank, so the preferred\
      \ route\nwas unavailable, not outranked.\n\nSupersedes the note above marking\
      \ the tie-break untested. The human's intermediate reading that\n\"Sd tracks\
      \ Vd preferentially\" is not reproduced under controlled conditions \u2014 with\
      \ Dd, Xmax and\nVd all entered and Sd blank, Sd comes from Dd."
  answer:
    at: '2026-08-05'
    text: "NEITHER. Settled 2026-08-05 by the human driving WinISD through ~15 states,\
      \ every one\nreproduced arithmetically. Both hypotheses in the question are\
      \ wrong.\n\nTHE RULE, and it is the whole model:\n\n    A relation fires only\
      \ when exactly ONE of its members is unknown.\n    An entered value is never\
      \ recomputed, and never questioned.\n\nEVIDENCE, each independently checked:\n\
      \  - Dd:=300 re-derived Sd (blank) but left Vd at its typed 200, though Sd x\
      \ Xmax implied 35343.\n    Deleting Vd filled it with 35343 exactly.\n  - Sd\
      \ sits in TWO relations: row 6 (Sd = pi.Dd^2/4) and row 20 (Sd = Vd/Xmax). With\
      \ Dd entered,\n    row 6 fires and Sd ignores Xmax completely. Delete Dd and\
      \ row 6 has two unknowns, so row 20\n    takes over \u2014 Sd tracks Vd/Xmax\
      \ and Dd becomes derived FROM Sd (356.8mm from Sd=0.1, exact).\n  - Deleting\
      \ Hg blanked Xmax rather than falling back to Vd/Sd, because Vd was itself derived\
      \ at\n    that moment. A derived value is not an anchor; deriving from it would\
      \ be circular.\n  - Fill every member and the app goes inert \u2014 nothing\
      \ recomputes because nothing is unknown.\n    The human read this as \"the calcs\
      \ just stop working\". There is simply no hole left to fill.\n  - Sd:=2 beside\
      \ Dd:=300, both entered: Dd does not follow (it would be 1596mm). No propagation\n\
      \    between two entered fields.\n\nWHY THE EARLIER READINGS WERE WRONG:\n \
      \ - PRECEDENCE came from one observation where Hc/Hg were blank, so there was\
      \ no contest.\n  - RECENCY was refuted by the final step: the newest edits were\
      \ Sd and Vd, yet Xmax derived\n    from Hc/Hg.\n\nCONSEQUENCE THAT MATTERS MOST:\
      \ contradiction is INVISIBLE by construction. Sd=1.0 entered\nbeside Dd=300\
      \ entered \u2014 off by 14x \u2014 produces no warning, no mark, no correction,\
      \ because\nneither can be recomputed and so neither is ever compared. That is\
      \ why the TfrmParErrors\n\"consistency check failed\" dialog exists in winisd.exe\
      \ but has never been observed firing.\n\nIt also means openisd's DQ marking\
      \ (QP18/QO12) has no WinISD counterpart at all. It is not a\nparity feature;\
      \ it is something WinISD structurally cannot do.\n\nRecorded in openisd/WDR_SCHEMA.md\
      \ 4.1."
