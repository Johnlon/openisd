- id: QO27
  title: Two live formulas and two conventions for reference efficiency `no` — fraction vs percent, 112.1
    vs 112.2
  status: decided
  raised: '2026-08-13'
  body: ''
  notes:
  - at: '2026-08-13'
    text: |-
      Split out of QO15 defect 2 on the human's ruling: "treat #2 as its own question resolved by
      WinISD evidence rather than preference".

      LINE NUMBERS BELOW WERE RE-VERIFIED 2026-08-13 against the working tree (QO15's originals,
      recorded 2026-08-05, had all moved).

      THREE IMPLEMENTATIONS ARE LIVE AND THEY DISAGREE ON BOTH THE UNIT AND THE CONSTANT:

        1. The Driver ADT — `no` as a FRACTION, constant 112.1
           packages/winisd/src/driver.ts:421  r.no = 4*pi^2/c^3 * Fs^3*Vas/Qes
           packages/winisd/src/driver.ts:422  r.SPL = 112.1 + 10*log10(no)
           The driver editor multiplies by 100 to show a percentage
           (DriverEditorModal.vue, the `no` field's :scale="100" under a "%" label).

        2. The engine's solveConsistencyGroup — `no` as a FRACTION, constant 112.2
           packages/engine/src/driver.ts:161  setVal('no', CONST_NO * Fs^3 * Vas / Qes)   (CONST_NO = 4*pi^2/c^3, line 54)
           packages/engine/src/driver.ts:174  setVal('SPLref', 112.2 + 10*log10(no))
           Same formula as the ADT, different constant.

        3. The engine's deriveDriver — `no` as a PERCENT, constant 112.2
           packages/engine/src/driver.ts:256  r.no = 9.64e-10 * Fs^3 * (Vas*1000) / Qes     (Vas in litres)
           packages/engine/src/driver.ts:258  r.SPLref = 112.2 + 10*log10(no/100)
           The /100 makes this the only one of the three that reads its own `no` as a percentage.

      A FOURTH constant is named in the code but unused: the comment at
      packages/engine/src/driver.ts:252-254 records "three disagreeing constants exist across the
      codebase (109 inferred / 112.1 / 112.2, PLAN_JS_CALC_CONSOLIDATION.md section 2 row 18)" and
      says resolving it was out of scope for that pass. It is now user-visible: the driver editor's
      SPL field renders from (1) while the charts run on the engine.

      EVIDENCE ALREADY IN THE REPO — resolves the UNIT axis, not the CONSTANT:
        - docs/design/WDR_SCHEMA.md:169 states the .wdr stores `no` as a FRACTION and WinISD
          DISPLAYS it as a percent ("0.000754 = 0.0754%"). That makes (3)'s percent reading the
          odd one out.
        - docs/winisd/edit_driver_pg2_parameters.png (real WinISD Driver editor) shows `no` at
          4 dp under a "%" label and SPL at 2 dp under "dB", confirming the display side only.
        - docs/winisd/sample_drive_Dayton_Audio_Epique_E150HE-44.wdr carries no=0 and SPL=0, so no
          sample in the tree pins the constant.

      WHAT STILL NEEDS MEASURING, AND HOW:
        Resolve against WinISD, not by preference — the workspace rule is that where WinISD deviates
        from textbook acoustics the .wdr must match WINISD, because WinISD is the consumer. Needed:
        what WinISD writes into `no` and `SPL` in a .wdr for a driver whose Fs/Vas/Qes are known and
        non-zero, and therefore which additive constant reproduces its own printed SPL. The win32
        harness in ../winisd_research (lib/control.py, lib/probes.py, lib/wdr.py) is the tool; the
        probe pattern already exists there (runs/map2.wdr is one such seeded file).

      WHEN IT IS RESOLVED there must be ONE implementation, not three — the two engine sites and the
      ADT site all compute the same physical quantity.
  - at: '2026-08-13'
    text: |-
      2026-08-13 -- THE WINISD ORACLE IS ALREADY ON DISK. This question is answerable now; only the
      consolidation work remains.

      HUMAN RULING, verbatim: "Alwyas use winisd as oracle - but min DP is 2dp"

      WHAT WINISD ACTUALLY DOES, from winisd_research/CALC_FINDINGS_FOR_REVIEW.md:733, back-solved
      against winisd_research/runs/env_sample1.wpr:

        1. `no` IS STORED AS A FRACTION, never a percent. It reproduces from BOTH routes:
              4*pi^2/c^3 * Fs^3*Vas/Qes            -3.3e-16
              roo/(2*pi*c) * BL^2*Sd^2/(Re*Mms^2)  -3.5e-16
           against the stored 0.180345391899866.

        2. THE CONSTANT IS NEITHER 112.1 NOR 112.2 -- IT IS DERIVED:
              SPL = K + 10*log10(no)      K = 10*log10(roo*c / (2*pi*p_ref^2))      p_ref = 20e-6 Pa
              K = 112.154453213, agreeing with the stored SPL to 1.4e-13 dB.
           109 / 112.1 / 112.2 are all rounded approximations of that derived quantity. Because WinISD
           fixes c and roo, K is fixed too -- but an implementation that varies air properties MUST vary
           K with them (0.073 dB from 20 C to 30 C). That interlocks with QO7's ruling: openisd uses
           humidity and pressure by default, so openisd's K is NOT a literal.

