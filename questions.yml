- id: QO25
  title: |-
    Understand @openisd/engine and @openisd/winisd: what each package is for, and why both export
    a type/class named `Driver`
  status: decided
  raised: '2026-08-12'
  body: ''
  answer:
    at: '2026-08-13'
    text: |-
      These are guikd to be revised in the reqorkign coming up -

      Explanation recorded; the driver types are revised in the upcoming rework, so no separate action.

      WHAT THE TWO PACKAGES ARE:
        @openisd/engine  -- the physics. Pure functions, zero dependencies: sweeps, alignments, filters,
          circuits, the T/S consistency solver. Its `Driver` (packages/engine/src/types.ts:113) is an
          INTERFACE extending DriverRaw, requiring Fs/Re/Sd/Vas/Qts/Qes/Qms/Cms/Mms/Rms/Bl non-null. It is
          the RESULT type of deriveDriver: "a driver with nothing missing, ready to simulate".
        @openisd/winisd  -- WinISD interop: .wdr/.wpr parse and serialise, ParState E/C/N provenance. Its
          `Driver` (packages/winisd/src/driver.ts:117) is a CLASS: the editable document. It holds
          #inputs (what the human entered => state E), a memoised derivation dropped on every mutation,
          memoised consistency issues, the autoCalculate toggle, and change listeners.

      So engine's Driver is a RESULT and winisd's Driver is a DOCUMENT. They are not two versions of one
      concept. packages/winisd/src/driver.ts:27 already imports engine's as EngineDriver to keep the two
      apart at the call site.

      FOUR driver-shaped types are in play -- DriverRaw, engine Driver, winisd Driver, OpenISDDriver --
      and ARCHITECTURE.md AD-9 already plans DriverRaw's retirement
      (noted at packages/winisd/src/native/openisdDerive.ts:54). Per this ruling that consolidation lands
      with the upcoming rework rather than as its own pass.
