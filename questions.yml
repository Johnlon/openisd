      \ \u2014 listed here so they are not\nlost, and because several are one-line\
      \ fixes that should land with the QO14 work.\n\n1. SPL FIELD IS PERMANENTLY\
      \ BLANK. Template line 415 reads cellVal('SPLref'), but the ADT\n   writes the\
