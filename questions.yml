- id: QO28
  title: 'numVC ParState slot: openisd emits C where WinISD pins E'
  status: open
  raised: '2026-08-13'
  body: ''
  notes:
  - at: '2026-08-13'
    text: |-
      NO CODE WORK NEEDED. This exists so the divergence is not later "fixed" back into WinISD's
      bug by someone reading a red row in the side-by-side parity suite (BACKLOG.md, the
      "Side-by-side WinISD vs openisd validation suite" item under "Quality / infrastructure").

      Human ruling, verbatim (2026-08-13):
        "Voicecoils << there was a winisd bug here - obvuously dont replicate that"

      THE WINISD BUG. `numVC` is pinned to ParState state `E` permanently, regardless of input:
      `winisd_research/KNOWLEDGE_REPORT.md:190` ("Several fields are permanently pinned regardless
      of input: `numVC` is always `E`") and `:198` (a reset puts `numVC` back to `E=1`). `E` means
      ENTERED BY THE HUMAN — WinISD asserts that of a value nobody typed.

      WHAT OPENISD DOES, verified by reading the file this turn:
        packages/winisd/src/driver.ts:432 — `if (r.numVC == null) r.numVC = 1;`
      inside `#derive()` (declared at :395), immediately after the `c`/`roo` autofills at :426-427.
      The app supplied the value, so it reports as `C` (calculated/default), never `E`. Correct as
      it stands — do not change it.

      CONSEQUENCE. openisd's exported ParState carries `C` in the `numVC` slot where WinISD writes
      `E`. A deliberate one-character divergence. The parity suite must EXPECT it, not flag it.

      RECORDED IN:
        - docs/spec/SPEC_ENGINE.md — the ParState paragraph now states WinISD's New+Save skeleton
          as an observation and adds that openisd writes `C` there, with the driver.ts:432 citation.
          The old parenthetical "(`E` — it has a real default)" endorsed the bug: having a default
          is exactly why the slot should be `C`. That endorsement is gone; the observation stays.
        - BACKLOG.md — a "Known deliberate divergences the suite EXPECTS rather than flags"
          sub-bullet on the parity-suite item.

      NOT A DIVERGENCE: `Xmax`. BACKLOG.md's group-solver item already records that this suite must
      DROP its `Xmax` divergence expectation because openisd matches WinISD on the group solve
      (both back-calc routes present: packages/engine/src/driver.ts:135 `abs(Hc-Hg)/2` and :144
      `Vd/Sd`). Not duplicated here.
