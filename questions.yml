- id: QO22
  title: Xmax is INPUT ONLY — never derived (ruled 2026-08-05)
  status: decided
  raised: '2026-08-05'
  body: ''
  answer:
    at: '2026-08-05'
    text: |-
      "No it's madness" — openisd does NOT reproduce WinISD's Xmax derivation.

      Xmax is a measured physical limit, the one member of {Vd, Sd, Xmax} that is not arithmetic.
      It is INPUT ONLY. Vd = Sd x Xmax runs one direction: Vd is computed when absent, never solved
      backwards.

      Three reasons, recorded in openisd/DRIVER_RECORD_MODEL.md 5:
        - CIRCULAR. Manufacturers publish Vd computed as Sd x Xmax, so deriving Xmax back returns our
          own number dressed as corroboration. A group that cannot disagree cannot be a check either.
        - IT INVENTS A LIMIT. A derived Xmax draws an excursion limit line. A limit the manufacturer
          never stated is not ours to assert, and a wrong line is worse than no line.
        - WINISD'S OWN ANSWER IS NOT STABLE. Two routes, undocumented precedence, so the same driver
          yields a different Xmax depending which fields happen to be populated.

      WinISD's actual behaviour stays documented in WDR_SCHEMA.md 4.1 — verified, including the
      precedence order and the Hc/Hg C-while-blank marks — because the parity suite needs it. It is a
      record of what WinISD does, not a specification to follow.

      CONSEQUENCE FOR QO8: this is a deliberate divergence. The side-by-side suite must expect
      openisd to report no Xmax where WinISD synthesises one.

      Code was already in this state: the abs(Hc-Hg)/2 derivation was deleted from
      packages/engine/src/driver.ts and the reverse Vd solve was never added. 398 unit tests pass,
      golden fixtures byte-identical.
  notes:
  - at: '2026-08-05'
    text: |-
      2026-08-05 REOPENED — the ruling as recorded is too broad, and the evidence changed under it.

      WHAT IS NOW ESTABLISHED, by direct observation in WinISD:
        Xmax = Vd / Sd IS a real WinISD derivation, and {Vd, Sd, Xmax} solves in ALL THREE
        directions. Observed: Vd=140cm3, Sd=0.0095 -> Xmax displayed 14.7mm. 140e-6/0.0095 =
        14.7368mm. Exact to the displayed digit. So "Xmax is never calculated" is wrong as stated.

      WHAT IS NOT ESTABLISHED:
        Xmax = |Hc-Hg|/2 has never been observed to fire. The group membership {Xmax, Hc, Hg} comes
        from winisd.exe binary strings (WDR_SCHEMA 4, offset ~8894); the FORMULA comes from the help
        file's definition of the quantity — "usually calculated as abs(Hc-Hg)/2" — which describes
        industry practice, not this program's behaviour. And WDR_SCHEMA 4 row 7 notes Hc/Hg are
        "never populated" in practice, so the precondition has never been met. Untested.

      CODE STATE: the |Hc-Hg|/2 derivation was deleted from driver.ts and stays deleted — it is
      unevidenced. Vd = Sd * Xmax remains ONE-DIRECTIONAL: openisd solves Vd, never Sd or Xmax.

      WHY THIS IS HARDER THAN ONE FIELD:
        1. Xmax is both a stated physical measurement and a member of an exact identity. A derived
           Xmax means "the excursion implied by a published Vd", not "the linear limit the
           manufacturer measured". Same number, different claim.
        2. Manufacturers usually compute Vd AS Sd x Xmax, so deriving Xmax back is often circular —
           it returns our own number. A group that cannot conflict cannot be used as a check either.
        3. THE REAL QUESTION IS NOT ABOUT XMAX. GAPS.md A4 already records it: "E/C/N derivation is
           one-directional; WinISD's is a group solver". openisd derives one way; WinISD solves in
           whichever direction the data allows. {Vd, Sd, Xmax} is only where it became visible.

      So the decision is whether openisd becomes a group solver, which is far larger than this field,
      and it moves computed values on every record holding two of any group's three members.
  - at: '2026-08-05'
    text: |-
      2026-08-05 — BOTH ROUTES ARE REAL, and they are ORDERED. Human ran the test:

        "If I set Vd to 0 it's not entered, then the other calc kicks in of Hc and Hg - but Vd/Sd
         takes precedence"

      So row 19 (Xmax = abs(Hc-Hg)/2) is LIVE code in WinISD, not a dormant relation. It had simply
      never been seen because row 20 outranks it and Vd is almost always present. My "no evidence
      for route 1" was right about the evidence and wrong about the conclusion — the precondition
      had never been cleared, and clearing it is what exposed the behaviour.

        priority 1   Xmax = Vd / Sd            (row 20, run backwards)
        priority 2   Xmax = abs(Hc - Hg) / 2   (row 19)

      THE GENERAL FINDING, which is worth more than the Xmax case: a field appearing in two relation
      groups is not an ambiguity in the table — WinISD picks between the routes in a FIXED ORDER.
      This is now observed for two fields:

        Xmax   Vd/Sd  beats  abs(Hc-Hg)/2                     (this session)
        Rme    2pi.Fs.Mms/Qes  beats  BL^2/Re                 (winisd_research GAPS.md A5)

      Any implementation claiming to match WinISD must reproduce the ORDER, not merely the formulas.
      Two implementations with identical correct formulas will disagree on a record that supplies
      inputs for both routes — which is exactly how the Rme 0.174% discrepancy presented itself
      earlier today before it was traced to inconsistent Cms/Vas inputs.

      Recorded in openisd/WDR_SCHEMA.md 4.1, with row 19 re-annotated "verified firing 2026-08-05,
      but only when Vd is absent".

      STILL OPEN, and unchanged by this: whether openisd becomes a group solver at all. It currently
      derives one-directionally (Vd from Sd x Xmax only). Matching WinISD means solving in every
      direction AND honouring the precedence order — and it moves computed values on every record
      holding two of any group's three members.
- id: QO23
  title: Is WinISD's field solver PRECEDENCE-ordered or LAST-EDIT-WINS? One 3-edit test settles it
  status: decided
  raised: '2026-08-05'
  body: ''
  notes:
  - at: '2026-08-05'
    text: |-
      Raised 2026-08-05 by the human:

        "Sd is also influenced by Dd - hmm it's a big graph where some values are definitely entered
         or not entered, at the same time it looks like the last manual update determines the
         calculated values."

      THE CORRECTION THIS FORCES. I recorded in WDR_SCHEMA 4.1 that WinISD has a FIXED PRECEDENCE
      between two routes to Xmax (Vd/Sd outranking abs(Hc-Hg)/2). That was one observation — Vd
      present, Vd wins — and it does NOT distinguish precedence from recency. If the rule is "last
      manual edit wins", Vd won because it was typed later, and the precedence I documented is my
      invention. 4.1 has been corrected to state both hypotheses and to warn against building on
      either.

      RECENCY EXPLAINS MORE THAN PRECEDENCE DOES:
        - Hc/Hg flipping C <-> N: they are C when reachable from the current anchor, N when not.
        - Qts pinning when entered: the anchor is whatever was touched last.
        - Why WinISD never warns about an inconsistency: there is nothing to warn about if the graph
          simply re-solves around the newest edit. This would also explain the TfrmParErrors dialog
          that exists in the binary but was never observed firing (WDR_SCHEMA 4).

      IT IS ONE GRAPH, NOT INDEPENDENT GROUPS. Dd = 2*sqrt(Sd/pi) (row 6) makes Sd two-way with Dd,
      and Sd also sits in row 20 {Vd, Sd, Xmax}, so Dd <-> Sd <-> {Vd, Xmax} is a single connected
      component: editing Dd can propagate as far as Xmax.

      THE TEST — three edits in WinISD, five minutes:
        1. Enter Hc and Hg. Xmax should take the geometry answer.
        2. Enter Vd. Check Xmax switches to Vd/Sd.
        3. Re-edit Hc.
           Xmax returns to abs(Hc-Hg)/2  -> RECENCY.
           Xmax stays on Vd/Sd           -> PRECEDENCE.

      WHY IT MATTERS BEYOND CURIOSITY. If the rule is recency, then WinISD's C/E/N marks are not a
      property of the DATA at all — they are a property of the EDIT HISTORY, and the same .wdr opened
      twice with different edit sequences carries different marks. That would make ParState
      unreproducible from a record alone, which bears directly on QP8's emit rules and on QO8's
      parity suite.
  - at: '2026-08-05'
    text: |-
      2026-08-05 — TIE-BREAK ESTABLISHED, completing the rule closed above.

      When two relations could each fill the same hole, row 20 (Vd = Sd x Xmax) LOSES. It is the
      fallback, used only when nothing else can supply the field. Observed twice:

        hole    competing routes                              winner
        Xmax    row 19 |Hc-Hg|/2   vs  row 20 Vd/Sd           row 19
        Sd      row 6  pi.Dd^2/4   vs  row 20 Vd/Xmax         row 6

      Physically consistent: Dd and Hc/Hg are measured geometry; Vd is a displacement volume derived
      FROM geometry. WinISD treats row 20 as producing Vd and only runs it backwards as a last resort.

      This retro-explains the FIRST observation of the session — Xmax appearing to come from Vd/Sd
      "in preference" to the geometry route. It did not: Hc and Hg were blank, so the preferred route
      was unavailable, not outranked.

      Supersedes the note above marking the tie-break untested. The human's intermediate reading that
      "Sd tracks Vd preferentially" is not reproduced under controlled conditions — with Dd, Xmax and
      Vd all entered and Sd blank, Sd comes from Dd.
  answer:
    at: '2026-08-05'
    text: |-
      NEITHER. Settled 2026-08-05 by the human driving WinISD through ~15 states, every one
      reproduced arithmetically. Both hypotheses in the question are wrong.

      THE RULE, and it is the whole model:

          A relation fires only when exactly ONE of its members is unknown.
          An entered value is never recomputed, and never questioned.

      EVIDENCE, each independently checked:
        - Dd:=300 re-derived Sd (blank) but left Vd at its typed 200, though Sd x Xmax implied 35343.
          Deleting Vd filled it with 35343 exactly.
        - Sd sits in TWO relations: row 6 (Sd = pi.Dd^2/4) and row 20 (Sd = Vd/Xmax). With Dd entered,
          row 6 fires and Sd ignores Xmax completely. Delete Dd and row 6 has two unknowns, so row 20
          takes over — Sd tracks Vd/Xmax and Dd becomes derived FROM Sd (356.8mm from Sd=0.1, exact).
        - Deleting Hg blanked Xmax rather than falling back to Vd/Sd, because Vd was itself derived at
          that moment. A derived value is not an anchor; deriving from it would be circular.
        - Fill every member and the app goes inert — nothing recomputes because nothing is unknown.
          The human read this as "the calcs just stop working". There is simply no hole left to fill.
        - Sd:=2 beside Dd:=300, both entered: Dd does not follow (it would be 1596mm). No propagation
          between two entered fields.

      WHY THE EARLIER READINGS WERE WRONG:
        - PRECEDENCE came from one observation where Hc/Hg were blank, so there was no contest.
        - RECENCY was refuted by the final step: the newest edits were Sd and Vd, yet Xmax derived
          from Hc/Hg.

      CONSEQUENCE THAT MATTERS MOST: contradiction is INVISIBLE by construction. Sd=1.0 entered
      beside Dd=300 entered — off by 14x — produces no warning, no mark, no correction, because
      neither can be recomputed and so neither is ever compared. That is why the TfrmParErrors
      "consistency check failed" dialog exists in winisd.exe but has never been observed firing.

      It also means openisd's DQ marking (QP18/QO12) has no WinISD counterpart at all. It is not a
      parity feature; it is something WinISD structurally cannot do.

      Recorded in openisd/WDR_SCHEMA.md 4.1.
