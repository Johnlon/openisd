- id: QO12
  title: 'Over-determined driver: entering Mms while Fs/Vas/Sd stay E is accepted silently and poisons
    Bl/Rms'
  status: decided
  raised: '2026-08-05'
  body: ''
  notes:
  - at: '2026-08-05'
    text: |-
      MEASURED live in the running app (vite 4321, Original skin, Demo - Generic 6.5" Woofer,
      Edit Project's Driver -> Parameters), 2026-08-05:

        before: Fs=37.00 [E]  Cms=1.1956 [C]  Mms=15.48 [C]  BL=7.097 [C]  Rms=0.5140 [C]
        typed Mms = 30 g
        after:  Fs=37.00 [E]  Cms=1.1956 [C]  Mms=30.00 [E]  BL=9.881 [C]  Rms=0.9963 [C]

      Fs, Cms and Mms are now mutually impossible: 1/((2pi*37)^2 * 1.1956e-3) = 15.48 g, not 30 g.
      No error, no warning, no DQ mark — and BL/Rms were recomputed FROM the impossible Mms, so the
      charts moved. This is the direct consequence of QO11 (make every calculated field editable):
      the ADT's solveConsistencyGroup (packages/engine/src/driver.ts:46) only FILLS nulls, so an
      over-determined set is never checked, only silently believed.

      THE DECISION (WinISD does not have this problem — its group solver re-solves):
        (a) SOLVE BACK: entering Mms recomputes the least-recently-entered member of its group
            (e.g. Fs or Cms) and marks it C. Matches WinISD, needs an eviction rule.
        (b) FLAG: keep the entered value, add an error/DQ mark "Fs, Cms and Mms are inconsistent"
            and refuse to simulate until the human resolves it.
        (c) ACCEPT: current behaviour, documented — the human owns the contradiction.
      Until this is ruled, every editable derived field is a way to produce a wrong chart silently.
  - at: '2026-08-05'
    text: |-
      The human asked for EBP to be editable on the What-If panel. Bl and Mms were done; EBP cannot
      be, without a ruling.

      WHY IT IS DIFFERENT FROM Bl AND Mms. Bl and Mms are members of the ADT's derivation set:
      solveConsistencyGroup produces them, Driver.enter() overrides them, cell() reports E or C. EBP
      is not there at all — it is engine/src/alignments.ts:40, `ebp(d) = d.Fs / d.Qes`, computed on
      the way to the screen. So cell('EBP') is permanently N.

      THE TWO WAYS TO MAKE IT EDITABLE, AND WHY NEITHER IS THE AGENT'S TO PICK:

      (a) Store it. enter('EBP', v) writes #inputs.EBP and cell() reports E — but nothing reads it.
          The panel would show the number back and the charts would ignore it: a field that LOOKS
          like an override and is not one. Rejected on sight.

      (b) Solve backwards. EBP = Fs/Qes has two unknowns, so an entered EBP can set EITHER
          Qes = Fs/EBP or Fs = EBP*Qes. They are different edits with different consequences —
          changing Qes moves Qts and the whole alignment; changing Fs moves the driver's resonance.
          There is no way to infer which the human means, and picking one silently rewrites a field
          they did not touch.

      Also note (b) adds calculation logic, which openisd/AGENTS.md gates on explicit human
      permission in the conversation. Both reasons point the same way: ask.

      WHAT IS NEEDED: which field an entered EBP should drive (Qes, or Fs), or a ruling that EBP
      stays a read-out. It is currently a read-out on both panels, tooltipped
      "EBP = Fs / Qes — a read-out of the two fields above, not a field of its own."
  - at: '2026-08-05'
    text: |-
      DISREGARD THE NOTE IMMEDIATELY ABOVE THIS ONE — it is misfiled. It belongs to QO20 ("EBP is
      not a driver field — what should typing one DO?") and was appended here by a concurrent agent
      session that minted QO20 while assuming the next free id was QO12. The text has been added to
      QO20, which is where it should be read. Nothing in it applies to this over-determined-driver
      question. `inbox.py` has no verb to delete a note, so it is retracted in place rather than
      removed.
  - at: '2026-08-05'
    text: |-
      IMPLEMENTED 2026-08-05 (not committed). One mechanism serves this ruling and QP18's, as ruled.

        detector   packages/engine/src/consistency.ts -> checkConsistency(entered): ConsistencyIssue[]
                   Groups are WDR_SCHEMA.md section 4 verbatim (rows 1,2,3,4,5,6,8,9,10,11,13,20).
                   Detection only: it reads the solve, it never feeds one. No computed value moved —
                   regenerating packages/engine/test/fixtures/golden/ produced zero content changes.
        exposure   Driver.consistencyIssues() (packages/winisd/src/driver.ts), memoised, dropped on
                   every mutation; store.driverConsistencyIssues for the effective model.
        render     .de-dq beside EVERY member of a disagreeing group, in DriverEditorModal.vue,
                   shells/original/OgTune.vue and components/DriverWhatIfPanel.vue. Blocks nothing.

      TOLERANCE — not a chosen number. Each field's uncertainty is half the last significant decimal of
      the value AS STORED (Vas = 0.0355 => +-0.00005 m3); a COMPUTED field has no literal, so its
      uncertainty is propagated by bumping each entered field by its own half-ulp and re-solving. A
      group is reported only when the residual exceeds the sum of those intervals. This is what stops
      the 2026-08-05 failure being repeated in the other direction: a fixed tol: 0.01 was three times
      wider than the 0.174% error it existed to catch, whereas a precision-derived interval is by
      construction narrower than any disagreement the recorded digits can express.

      THE OVER-DETERMINED TRIGGER WAS DELIBERATELY NOT BUILT — see the note added to QO13 the same day.
      Every library driver is over-determined by construction (E means "present in the file", not
      "asserted by a human"), so that trigger would mark all 1912 of them. The inconsistent trigger
      delivers this ruling anyway: over-determination only harms when it contradicts, and the
      contradiction is what fires.

      NOT MARKED, and it is a judgement worth a human eye: Bl and Rms, which are recomputed FROM the
      impossible Mms, carry no mark. They reconcile perfectly with the group they were computed from.
      Marking them needs taint propagation, which is a second mechanism; both rulings say the GROUP is
      the unit, so the group is what is marked.
  - at: '2026-08-05'
    text: |-
      2026-08-05 — the strongest evidence yet for this feature, from the human driving WinISD:

        "A field might have two conflicting calculated solutions trying to write to it and one of them
         wins BUT there is no DQ indicated on that conflicted field."

      This is a DISTINCT failure from the entered-vs-entered case. There, neither field can be
      recomputed, so nothing is ever compared and WinISD structurally cannot notice. HERE the
      comparison is free: both routes are computable, they disagree, and the engine writes the winner
      and discards the loser without a word.

      Measured in the human's own state — Hc=1, Hg=2, Vd=1413720cm3, Sd=0.1707, Xmax blank:
          route 19 geometry : Xmax = 0.5000 m   WINS, written
          route 20 volume   : Xmax = 8.2819 m   discarded silently, 17x larger

      WHY OPENISD'S DETECTOR COVERS IT ANYWAY, with no extra mechanism: once the winner writes
      Xmax = 0.5, row 20 holds all three members and they no longer reconcile — Sd x Xmax = 85350 cm3
      against Vd = 1413720 cm3, out by 17x. checkConsistency fires on {Vd, Sd, Xmax} and marks all
      three, per the QP18 ruling that the group is the unit.

      So the losing route cannot vanish silently here: writing the winner is exactly what makes the
      loser's group inconsistent. No taint tracking and no second mechanism needed.

          WinISD                                          openisd
          two entered fields contradict     invisible     marked
          two routes disagree               invisible     marked (winner's value fails loser's group)

      WinISD is not failing to warn. It fills holes and never checks — which is why TfrmParErrors
      sits in winisd.exe having never been observed to fire.
  answer:
    at: '2026-08-05'
    text: |-
      "if this causes dq error then please add dq note at side of affected fields"

      RULED: an over-determined driver is NOT blocked and NOT silently accepted. Every field
      implicated in the over-determination carries a DQ note beside it.

      This is the same principle as QP18, ruled the same day: when a consistency group loses
      consistency, the mark goes on EVERY member of the group, not on one nominated field. A reader
      looking at any implicated field must see that something disagrees. Here the trigger is
      different — the group is over-determined rather than merely inconsistent — but the remedy is
      identical, and the two should share one mechanism rather than growing two.

      The defect: solveConsistencyGroup only fills nulls. It never checks whether the entered set
      already over-determines the group, so entering Mms while Fs and Cms remain entered is accepted
      and poisons Bl and Rms with no warning anywhere.

      Why it is now urgent rather than theoretical: QO11 made derived fields editable in the What-If
      panels on 2026-08-05 (Bl and Mms on OgTune.vue and DriverWhatIfPanel.vue). That is what the
      human asked for, and it is precisely what makes this reachable from the UI. Every newly
      editable derived field is a route to a wrong chart with no warning until this lands.
- id: QO13
  title: Qts never recalculates from Qms/Qes because a library driver arrives with EVERY field marked
    Entered
  status: decided
  raised: '2026-08-05'
  body: ''
  notes:
  - at: '2026-08-05'
    text: |-
      THE REPORTED SYMPTOM: "Qts isn't calculating when Qms and Qes set."

      MEASURED, and the maths is NOT the bug. packages/engine/src/driver.ts:62 does
      Qts = Qes*Qms/(Qes+Qms) correctly, and clearing the Qts field makes it recompute at once —
      0.400 & 7.000 -> 0.378, state C, verified live.

      THE CAUSE: Driver.fromRaw (packages/winisd/src/driver.ts:223) writes EVERY present field into
      #inputs, and presence in #inputs IS state E. So a driver loaded from the library / demo /
      project arrives with Qts, Qes and Qms all Entered. solveConsistencyGroup never overwrites an
      E value, so editing Qms or Qes leaves the stale Qts sitting there. The panel is behaving
      exactly as designed; the design is what is wrong.

      Same class of defect for Cms/Mms/Rms/Bl on any driver whose source file carries them.

      THE DECISION:
        (a) A WDR ParState is real provenance and is honoured (fromWdr already replays it). A plain
            DriverRaw has NO provenance, so it should enter only the INDEPENDENT set (Fs, Vas, Sd,
            Re, two Qs, Xmax, Pe, Le) and let everything derivable arrive as C.
        (b) Keep everything E, and make an edit to one member of a consistency group EVICT the
            others (the same eviction rule QO12 needs).
        (c) Leave it: the user clears the field they want recomputed. Cheap, but the panel then
            shows all-green "entered" for values nobody entered, which is false provenance.
  - at: '2026-08-05'
    text: |-
      MEASURED 2026-08-05 against the real bundle (packages/ui/src/drivers-bundle.json, 1912 drivers),
      while implementing the QP18 / QO12 DQ mark. QO13's claim is TRUE AS WRITTEN, and it is general:

        Library drivers reach the app as `DriverModel.fromJSON(f.record)` (useDriverSelection.ts:87),
        whose `inputs` bag becomes `#inputs` wholesale — and presence in `#inputs` IS state E.
        Count of the 16 core fields marked E, over the whole bundle:
            14 fields E : 412 drivers     13 : 588     12 : 423     11 : 120     10 : 68
            <=9         : 301 drivers
        A T/S set is determined by ~6 independent values. So essentially the WHOLE library arrives
        over-determined, and "E" here does NOT mean "a human asserted this" — it means "this key was
        present in the file". There is no third mark and no session-scoped edit flag: `enter()` is the
        only mutation path and construction uses it, so the model cannot tell the two apart.

      CONSEQUENCE FOR QO12, and what shipped: an OVER-DETERMINED trigger would fire on every driver in
      the library, which makes the mark wallpaper. It was therefore NOT built. What shipped is the
      INCONSISTENT trigger only (packages/engine/src/consistency.ts), and it covers the QO12 case in
      full — verified against QO12's own repro:

          demo driver, untouched          -> 0 issues (over-determined, but everything reconciles)
          type Mms = 30 g                 -> 1 issue: Fs, Mms, Cms marked, "disagree by 28.2%",
                                             Fs = 1/(2pi*sqrt(Mms*Cms)) gives 26.57 Hz vs the 37 entered

      Over-determination that does not contradict corrupts nothing — whichever path computes a derived
      value gives the same answer. The only over-determination worth marking is the one that shows up
      as an inconsistency, and that is exactly what fires.

      WHAT IS STILL OPEN HERE: this does not answer QO13's own question. The stale-Qts symptom
      ("editing Qms leaves the old Qts sitting there") is untouched — it now merely acquires a DQ mark
      once the stale value drifts beyond precision. QO13's (a)/(b)/(c) still needs a human ruling.
  answer:
    at: '2026-08-12'
    text: |-
      RULING (2026-08-12): option (b) from the 2026-08-05 note (auto-evict the stale group member)
      is WRONG and rejected. It contradicts the already-ruled DQ-marking policy (DRIVER_RECORD_MODEL.md
      §4, QP18): "which member is left to be derived does not matter; what matters is that the
      disagreement is visible." An Entered value is never silently cleared or overridden.

      Correct answer is closest to option (c): do nothing to entry/eviction. openisd.yml carries
      ASSERTED values only (DRIVER_RECORD_MODEL.md §1) -- a library driver arriving with Qts/Qes/Qms
      all Entered is CORRECT, not over-determination-as-bug, because presence in openisd.yml means
      someone genuinely asserted it (datasheet or human), full stop. When a fresh edit leaves an
      inherited Entered value no longer reconciling with freshly-typed siblings, checkConsistency()
      (packages/engine/src/consistency.ts) already flags the whole group with a DQ mark -- this
      mechanism already exists and is already tested (consistency.test.ts: "marks all three Q fields
