- id: QO12
  title: 'Over-determined driver: entering Mms while Fs/Vas/Sd stay E is accepted
    silently and poisons Bl/Rms'
  status: decided
  raised: '2026-08-05'
  body: ''
  notes:
  - at: '2026-08-05'
    text: "MEASURED live in the running app (vite 4321, Original skin, Demo - Generic\
      \ 6.5\" Woofer,\nEdit Project's Driver -> Parameters), 2026-08-05:\n\n  before:\
      \ Fs=37.00 [E]  Cms=1.1956 [C]  Mms=15.48 [C]  BL=7.097 [C]  Rms=0.5140 [C]\n\
      \  typed Mms = 30 g\n  after:  Fs=37.00 [E]  Cms=1.1956 [C]  Mms=30.00 [E] \
      \ BL=9.881 [C]  Rms=0.9963 [C]\n\nFs, Cms and Mms are now mutually impossible:\
      \ 1/((2pi*37)^2 * 1.1956e-3) = 15.48 g, not 30 g.\nNo error, no warning, no\
      \ DQ mark \u2014 and BL/Rms were recomputed FROM the impossible Mms, so the\n\
      charts moved. This is the direct consequence of QO11 (make every calculated\
      \ field editable):\nthe ADT's solveConsistencyGroup (packages/engine/src/driver.ts:46)\
      \ only FILLS nulls, so an\nover-determined set is never checked, only silently\
      \ believed.\n\nTHE DECISION (WinISD does not have this problem \u2014 its group\
      \ solver re-solves):\n  (a) SOLVE BACK: entering Mms recomputes the least-recently-entered\
      \ member of its group\n      (e.g. Fs or Cms) and marks it C. Matches WinISD,\
      \ needs an eviction rule.\n  (b) FLAG: keep the entered value, add an error/DQ\
      \ mark \"Fs, Cms and Mms are inconsistent\"\n      and refuse to simulate until\
      \ the human resolves it.\n  (c) ACCEPT: current behaviour, documented \u2014\
      \ the human owns the contradiction.\nUntil this is ruled, every editable derived\
      \ field is a way to produce a wrong chart silently."
  - at: '2026-08-05'
    text: "The human asked for EBP to be editable on the What-If panel. Bl and Mms\
      \ were done; EBP cannot\nbe, without a ruling.\n\nWHY IT IS DIFFERENT FROM Bl\
      \ AND Mms. Bl and Mms are members of the ADT's derivation set:\nsolveConsistencyGroup\
      \ produces them, Driver.enter() overrides them, cell() reports E or C. EBP\n\
      is not there at all \u2014 it is engine/src/alignments.ts:40, `ebp(d) = d.Fs\
      \ / d.Qes`, computed on\nthe way to the screen. So cell('EBP') is permanently\
      \ N.\n\nTHE TWO WAYS TO MAKE IT EDITABLE, AND WHY NEITHER IS THE AGENT'S TO\
      \ PICK:\n\n(a) Store it. enter('EBP', v) writes #inputs.EBP and cell() reports\
      \ E \u2014 but nothing reads it.\n    The panel would show the number back and\
      \ the charts would ignore it: a field that LOOKS\n    like an override and is\
      \ not one. Rejected on sight.\n\n(b) Solve backwards. EBP = Fs/Qes has two unknowns,\
      \ so an entered EBP can set EITHER\n    Qes = Fs/EBP or Fs = EBP*Qes. They are\
      \ different edits with different consequences \u2014\n    changing Qes moves\
      \ Qts and the whole alignment; changing Fs moves the driver's resonance.\n \
      \   There is no way to infer which the human means, and picking one silently\
      \ rewrites a field\n    they did not touch.\n\nAlso note (b) adds calculation\
      \ logic, which openisd/AGENTS.md gates on explicit human\npermission in the\
      \ conversation. Both reasons point the same way: ask.\n\nWHAT IS NEEDED: which\
      \ field an entered EBP should drive (Qes, or Fs), or a ruling that EBP\nstays\
      \ a read-out. It is currently a read-out on both panels, tooltipped\n\"EBP =\
      \ Fs / Qes \u2014 a read-out of the two fields above, not a field of its own.\""
  - at: '2026-08-05'
    text: "DISREGARD THE NOTE IMMEDIATELY ABOVE THIS ONE \u2014 it is misfiled. It\
      \ belongs to QO20 (\"EBP is\nnot a driver field \u2014 what should typing one\
      \ DO?\") and was appended here by a concurrent agent\nsession that minted QO20\
      \ while assuming the next free id was QO12. The text has been added to\nQO20,\
      \ which is where it should be read. Nothing in it applies to this over-determined-driver\n\
      question. `inbox.py` has no verb to delete a note, so it is retracted in place\
      \ rather than\nremoved."
  - at: '2026-08-05'
    text: "IMPLEMENTED 2026-08-05 (not committed). One mechanism serves this ruling\
      \ and QP18's, as ruled.\n\n  detector   packages/engine/src/consistency.ts ->\
      \ checkConsistency(entered): ConsistencyIssue[]\n             Groups are WDR_SCHEMA.md\
      \ section 4 verbatim (rows 1,2,3,4,5,6,8,9,10,11,13,20).\n             Detection\
      \ only: it reads the solve, it never feeds one. No computed value moved \u2014\
      \n             regenerating packages/engine/test/fixtures/golden/ produced zero\
      \ content changes.\n  exposure   Driver.consistencyIssues() (packages/winisd/src/driver.ts),\
      \ memoised, dropped on\n             every mutation; store.driverConsistencyIssues\
      \ for the effective model.\n  render     .de-dq beside EVERY member of a disagreeing\
      \ group, in DriverEditorModal.vue,\n             shells/original/OgTune.vue\
      \ and components/DriverWhatIfPanel.vue. Blocks nothing.\n\nTOLERANCE \u2014\
      \ not a chosen number. Each field's uncertainty is half the last significant\
      \ decimal of\nthe value AS STORED (Vas = 0.0355 => +-0.00005 m3); a COMPUTED\
      \ field has no literal, so its\nuncertainty is propagated by bumping each entered\
      \ field by its own half-ulp and re-solving. A\ngroup is reported only when the\
      \ residual exceeds the sum of those intervals. This is what stops\nthe 2026-08-05\
      \ failure being repeated in the other direction: a fixed tol: 0.01 was three\
      \ times\nwider than the 0.174% error it existed to catch, whereas a precision-derived\
      \ interval is by\nconstruction narrower than any disagreement the recorded digits\
      \ can express.\n\nTHE OVER-DETERMINED TRIGGER WAS DELIBERATELY NOT BUILT \u2014\
      \ see the note added to QO13 the same day.\nEvery library driver is over-determined\
      \ by construction (E means \"present in the file\", not\n\"asserted by a human\"\
      ), so that trigger would mark all 1912 of them. The inconsistent trigger\ndelivers\
      \ this ruling anyway: over-determination only harms when it contradicts, and\
      \ the\ncontradiction is what fires.\n\nNOT MARKED, and it is a judgement worth\
      \ a human eye: Bl and Rms, which are recomputed FROM the\nimpossible Mms, carry\
      \ no mark. They reconcile perfectly with the group they were computed from.\n\
      Marking them needs taint propagation, which is a second mechanism; both rulings\
      \ say the GROUP is\nthe unit, so the group is what is marked."
  - at: '2026-08-05'
    text: "2026-08-05 \u2014 the strongest evidence yet for this feature, from the\
      \ human driving WinISD:\n\n  \"A field might have two conflicting calculated\
      \ solutions trying to write to it and one of them\n   wins BUT there is no DQ\
      \ indicated on that conflicted field.\"\n\nThis is a DISTINCT failure from the\
      \ entered-vs-entered case. There, neither field can be\nrecomputed, so nothing\
      \ is ever compared and WinISD structurally cannot notice. HERE the\ncomparison\
      \ is free: both routes are computable, they disagree, and the engine writes\
      \ the winner\nand discards the loser without a word.\n\nMeasured in the human's\
      \ own state \u2014 Hc=1, Hg=2, Vd=1413720cm3, Sd=0.1707, Xmax blank:\n    route\
      \ 19 geometry : Xmax = 0.5000 m   WINS, written\n    route 20 volume   : Xmax\
      \ = 8.2819 m   discarded silently, 17x larger\n\nWHY OPENISD'S DETECTOR COVERS\
      \ IT ANYWAY, with no extra mechanism: once the winner writes\nXmax = 0.5, row\
      \ 20 holds all three members and they no longer reconcile \u2014 Sd x Xmax =\
      \ 85350 cm3\nagainst Vd = 1413720 cm3, out by 17x. checkConsistency fires on\
      \ {Vd, Sd, Xmax} and marks all\nthree, per the QP18 ruling that the group is\
      \ the unit.\n\nSo the losing route cannot vanish silently here: writing the\
      \ winner is exactly what makes the\nloser's group inconsistent. No taint tracking\
      \ and no second mechanism needed.\n\n    WinISD                            \
      \              openisd\n    two entered fields contradict     invisible    \
      \ marked\n    two routes disagree               invisible     marked (winner's\
      \ value fails loser's group)\n\nWinISD is not failing to warn. It fills holes\
      \ and never checks \u2014 which is why TfrmParErrors\nsits in winisd.exe having\
      \ never been observed to fire."
  answer:
    at: '2026-08-05'
    text: "\"if this causes dq error then please add dq note at side of affected fields\"\
      \n\nRULED: an over-determined driver is NOT blocked and NOT silently accepted.\
      \ Every field\nimplicated in the over-determination carries a DQ note beside\
      \ it.\n\nThis is the same principle as QP18, ruled the same day: when a consistency\
      \ group loses\nconsistency, the mark goes on EVERY member of the group, not\
      \ on one nominated field. A reader\nlooking at any implicated field must see\
      \ that something disagrees. Here the trigger is\ndifferent \u2014 the group\
      \ is over-determined rather than merely inconsistent \u2014 but the remedy is\n\
      identical, and the two should share one mechanism rather than growing two.\n\
      \nThe defect: solveConsistencyGroup only fills nulls. It never checks whether\
      \ the entered set\nalready over-determines the group, so entering Mms while\
      \ Fs and Cms remain entered is accepted\nand poisons Bl and Rms with no warning\
      \ anywhere.\n\nWhy it is now urgent rather than theoretical: QO11 made derived\
      \ fields editable in the What-If\npanels on 2026-08-05 (Bl and Mms on OgTune.vue\
      \ and DriverWhatIfPanel.vue). That is what the\nhuman asked for, and it is precisely\
      \ what makes this reachable from the UI. Every newly\neditable derived field\
      \ is a route to a wrong chart with no warning until this lands."
- id: QO13
  title: Qts never recalculates from Qms/Qes because a library driver arrives with
    EVERY field marked Entered
  status: decided
  raised: '2026-08-05'
  body: ''
  notes:
  - at: '2026-08-05'
    text: "THE REPORTED SYMPTOM: \"Qts isn't calculating when Qms and Qes set.\"\n\
      \nMEASURED, and the maths is NOT the bug. packages/engine/src/driver.ts:62 does\n\
      Qts = Qes*Qms/(Qes+Qms) correctly, and clearing the Qts field makes it recompute\
      \ at once \u2014\n0.400 & 7.000 -> 0.378, state C, verified live.\n\nTHE CAUSE:\
      \ Driver.fromRaw (packages/winisd/src/driver.ts:223) writes EVERY present field\
      \ into\n#inputs, and presence in #inputs IS state E. So a driver loaded from\
      \ the library / demo /\nproject arrives with Qts, Qes and Qms all Entered. solveConsistencyGroup\
      \ never overwrites an\nE value, so editing Qms or Qes leaves the stale Qts sitting\
      \ there. The panel is behaving\nexactly as designed; the design is what is wrong.\n\
      \nSame class of defect for Cms/Mms/Rms/Bl on any driver whose source file carries\
      \ them.\n\nTHE DECISION:\n  (a) A WDR ParState is real provenance and is honoured\
      \ (fromWdr already replays it). A plain\n      DriverRaw has NO provenance,\
      \ so it should enter only the INDEPENDENT set (Fs, Vas, Sd,\n      Re, two Qs,\
      \ Xmax, Pe, Le) and let everything derivable arrive as C.\n  (b) Keep everything\
      \ E, and make an edit to one member of a consistency group EVICT the\n     \
      \ others (the same eviction rule QO12 needs).\n  (c) Leave it: the user clears\
      \ the field they want recomputed. Cheap, but the panel then\n      shows all-green\
      \ \"entered\" for values nobody entered, which is false provenance."
  - at: '2026-08-05'
    text: "MEASURED 2026-08-05 against the real bundle (packages/ui/src/drivers-bundle.json,\
      \ 1912 drivers),\nwhile implementing the QP18 / QO12 DQ mark. QO13's claim is\
      \ TRUE AS WRITTEN, and it is general:\n\n  Library drivers reach the app as\
      \ `DriverModel.fromJSON(f.record)` (useDriverSelection.ts:87),\n  whose `inputs`\
      \ bag becomes `#inputs` wholesale \u2014 and presence in `#inputs` IS state\
      \ E.\n  Count of the 16 core fields marked E, over the whole bundle:\n     \
      \ 14 fields E : 412 drivers     13 : 588     12 : 423     11 : 120     10 :\
      \ 68\n      <=9         : 301 drivers\n  A T/S set is determined by ~6 independent\
      \ values. So essentially the WHOLE library arrives\n  over-determined, and \"\
      E\" here does NOT mean \"a human asserted this\" \u2014 it means \"this key\
      \ was\n  present in the file\". There is no third mark and no session-scoped\
      \ edit flag: `enter()` is the\n  only mutation path and construction uses it,\
      \ so the model cannot tell the two apart.\n\nCONSEQUENCE FOR QO12, and what\
      \ shipped: an OVER-DETERMINED trigger would fire on every driver in\nthe library,\
      \ which makes the mark wallpaper. It was therefore NOT built. What shipped is\
      \ the\nINCONSISTENT trigger only (packages/engine/src/consistency.ts), and it\
      \ covers the QO12 case in\nfull \u2014 verified against QO12's own repro:\n\n\
      \    demo driver, untouched          -> 0 issues (over-determined, but everything\
      \ reconciles)\n    type Mms = 30 g                 -> 1 issue: Fs, Mms, Cms\
      \ marked, \"disagree by 28.2%\",\n                                       Fs\
      \ = 1/(2pi*sqrt(Mms*Cms)) gives 26.57 Hz vs the 37 entered\n\nOver-determination\
      \ that does not contradict corrupts nothing \u2014 whichever path computes a\
      \ derived\nvalue gives the same answer. The only over-determination worth marking\
      \ is the one that shows up\nas an inconsistency, and that is exactly what fires.\n\
      \nWHAT IS STILL OPEN HERE: this does not answer QO13's own question. The stale-Qts\
      \ symptom\n(\"editing Qms leaves the old Qts sitting there\") is untouched \u2014\
      \ it now merely acquires a DQ mark\nonce the stale value drifts beyond precision.\
      \ QO13's (a)/(b)/(c) still needs a human ruling."
  answer:
    at: '2026-08-12'
    text: "RULING (2026-08-12): option (b) from the 2026-08-05 note (auto-evict the\
      \ stale group member)\nis WRONG and rejected. It contradicts the already-ruled\
      \ DQ-marking policy (DRIVER_RECORD_MODEL.md\n\xA74, QP18): \"which member is\
      \ left to be derived does not matter; what matters is that the\ndisagreement\
      \ is visible.\" An Entered value is never silently cleared or overridden.\n\n\
      Correct answer is closest to option (c): do nothing to entry/eviction. openisd.yml\
      \ carries\nASSERTED values only (DRIVER_RECORD_MODEL.md \xA71) -- a library\
      \ driver arriving with Qts/Qes/Qms\nall Entered is CORRECT, not over-determination-as-bug,\
      \ because presence in openisd.yml means\nsomeone genuinely asserted it (datasheet\
      \ or human), full stop. When a fresh edit leaves an\ninherited Entered value\
      \ no longer reconciling with freshly-typed siblings, checkConsistency()\n(packages/engine/src/consistency.ts)\
      \ already flags the whole group with a DQ mark -- this\nmechanism already exists\
      \ and is already tested (consistency.test.ts: \"marks all three Q fields\nwhen\
      \ Qts contradicts Qes and Qms\"). The remaining question is only whether that\
      \ DQ mark is\nsufficiently VISIBLE in the UI (Tune panel / Driver Editor) for\
      \ this exact scenario -- that's a\nUI-surfacing check, not a data-model change,\
      \ and is separate follow-up work, not this ruling.\n\nA same-session attempt\
      \ at a \"DriverSession\" auto-clear/eviction class was built, then reverted\n\
      in full once this ruling was reached -- see STATE_MODEL.md's note and PLAN_OPENISD_DRIVER_MODEL.md.\n\
      Closing QO13 as answered by this ruling."
