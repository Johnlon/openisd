- id: QO38
  title: 'Layering ruling: ui depends on logic; logic consumes services (driver_db, browser stores, file
    io, diagnostics)'
  status: open
  raised: '2026-08-13'
  body: ''
  notes:
  - at: '2026-08-13'
    text: |-
      RULED by the human 2026-08-13, verbatim:

        "ui shoudl depende on logic and logic uses servcices like the driver_db and internal browser
         stores abdn file io and diagnostics etc."

      THE LAYERING:

          ui  ->  logic  ->  services  ->  engine / serialisation

        ui         presentation only. Depends on `logic` and NOTHING else. It does not reach past it
                   into a service.
        logic      the app's orchestration and its model. Owns the store, the project, the driver
                   model, the workflows. CONSUMES services; is consumed only by ui.
        services   driver_db, the browser-local stores (localStorage: My Drivers, favourites,
                   session), file I/O, diagnostics, logging. Each takes arguments and returns data.
                   A service NEVER reads or writes the app's global `state`.
        engine     pure physics. Serialisation (.wdr/.wpr) is the other leaf, reached from logic.

      VIOLATIONS IN THE TREE TODAY, measured 2026-08-13:

        1. `db -> logic` -- BACKWARDS. `packages/ui/src/db/useDriverLibrary.ts:5,10` imports `state`,
           `driverShort`, and the favourites persistence from `logic/`; `db/useDriverSelection.ts:6`
           imports `state`, `setDriverFromSerialized`, `getDriverModel`, `setDriverBaseline`,
           `cancelDriverWhatIf`, `isDriverWhatIfActive`. No cycle exists (nothing in `logic/` imports
           `db/`), but the arrow points the wrong way.

        2. THE CAUSE: `db/` is not a store. It mixes genuine data access (library index, search, My
           Drivers persistence) with UI WORKFLOW. `useDriverSelection.ts` is "the user chose a driver":
           it sets `state.browseOpen`, `state.editDriverInfo`, `state.editDriver` and cancels the
           what-if overlay. `useDriverLibrary.ts:747` even `watch`es `state.editDriverInfo` to reload.
           Controller code cannot help reaching up into the store -- that is why the dependency
           inverted.

        3. `ui -> db`, `ui -> diagnostics`, `ui -> logging` -- ui reaching past logic directly into
           services.

      THE FIX, and it is structural, not cosmetic:
        - The workflow half of `db/` moves UP into `logic/`. "The user chose a driver" is orchestration.
        - What remains in `db/` becomes a real service: arguments in, data out, no `state` import.
        - ui's imports of db/diagnostics/logging are routed through logic.
        - A mechanical gate should then enforce the layering by import SHAPE, so a new file cannot
          reintroduce the inversion silently.

      INTERLOCK WITH THE MODEL MIGRATION (QO36): the migration rewrites exactly these files -- the
      store, the driver model, the library. Doing the layering fix as part of it is one pass; doing it
      after is two rewrites of the same code.
