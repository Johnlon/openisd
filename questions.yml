- id: QO22
  title: "Xmax is INPUT ONLY \u2014 never derived (ruled 2026-08-05)"
  status: decided
  raised: '2026-08-05'
  body: ''
  answer:
    at: '2026-08-05'
    text: "\"No it's madness\" \u2014 openisd does NOT reproduce WinISD's Xmax derivation.\n\
      \nXmax is a measured physical limit, the one member of {Vd, Sd, Xmax} that is\
      \ not arithmetic.\nIt is INPUT ONLY. Vd = Sd x Xmax runs one direction: Vd is\
      \ computed when absent, never solved\nbackwards.\n\nThree reasons, recorded\
      \ in openisd/DRIVER_RECORD_MODEL.md 5:\n  - CIRCULAR. Manufacturers publish\
      \ Vd computed as Sd x Xmax, so deriving Xmax back returns our\n    own number\
      \ dressed as corroboration. A group that cannot disagree cannot be a check either.\n\
      \  - IT INVENTS A LIMIT. A derived Xmax draws an excursion limit line. A limit\
      \ the manufacturer\n    never stated is not ours to assert, and a wrong line\
      \ is worse than no line.\n  - WINISD'S OWN ANSWER IS NOT STABLE. Two routes,\
      \ undocumented precedence, so the same driver\n    yields a different Xmax depending\
      \ which fields happen to be populated.\n\nWinISD's actual behaviour stays documented\
      \ in WDR_SCHEMA.md 4.1 \u2014 verified, including the\nprecedence order and\
      \ the Hc/Hg C-while-blank marks \u2014 because the parity suite needs it. It\
      \ is a\nrecord of what WinISD does, not a specification to follow.\n\nCONSEQUENCE\
      \ FOR QO8: this is a deliberate divergence. The side-by-side suite must expect\n\
      openisd to report no Xmax where WinISD synthesises one.\n\nCode was already\
      \ in this state: the abs(Hc-Hg)/2 derivation was deleted from\npackages/engine/src/driver.ts\
      \ and the reverse Vd solve was never added. 398 unit tests pass,\ngolden fixtures\
      \ byte-identical."
  notes:
  - at: '2026-08-05'
    text: "2026-08-05 REOPENED \u2014 the ruling as recorded is too broad, and the\
      \ evidence changed under it.\n\nWHAT IS NOW ESTABLISHED, by direct observation\
      \ in WinISD:\n  Xmax = Vd / Sd IS a real WinISD derivation, and {Vd, Sd, Xmax}\
      \ solves in ALL THREE\n  directions. Observed: Vd=140cm3, Sd=0.0095 -> Xmax\
      \ displayed 14.7mm. 140e-6/0.0095 =\n  14.7368mm. Exact to the displayed digit.\
      \ So \"Xmax is never calculated\" is wrong as stated.\n\nWHAT IS NOT ESTABLISHED:\n\
      \  Xmax = |Hc-Hg|/2 has never been observed to fire. The group membership {Xmax,\
      \ Hc, Hg} comes\n  from winisd.exe binary strings (WDR_SCHEMA 4, offset ~8894);\
      \ the FORMULA comes from the help\n  file's definition of the quantity \u2014\
      \ \"usually calculated as abs(Hc-Hg)/2\" \u2014 which describes\n  industry\
      \ practice, not this program's behaviour. And WDR_SCHEMA 4 row 7 notes Hc/Hg\
      \ are\n  \"never populated\" in practice, so the precondition has never been\
      \ met. Untested.\n\nCODE STATE: the |Hc-Hg|/2 derivation was deleted from driver.ts\
      \ and stays deleted \u2014 it is\nunevidenced. Vd = Sd * Xmax remains ONE-DIRECTIONAL:\
      \ openisd solves Vd, never Sd or Xmax.\n\nWHY THIS IS HARDER THAN ONE FIELD:\n\
      \  1. Xmax is both a stated physical measurement and a member of an exact identity.\
      \ A derived\n     Xmax means \"the excursion implied by a published Vd\", not\
      \ \"the linear limit the\n     manufacturer measured\". Same number, different\
      \ claim.\n  2. Manufacturers usually compute Vd AS Sd x Xmax, so deriving Xmax\
      \ back is often circular \u2014\n     it returns our own number. A group that\
      \ cannot conflict cannot be used as a check either.\n  3. THE REAL QUESTION\
      \ IS NOT ABOUT XMAX. GAPS.md A4 already records it: \"E/C/N derivation is\n\
      \     one-directional; WinISD's is a group solver\". openisd derives one way;\
      \ WinISD solves in\n     whichever direction the data allows. {Vd, Sd, Xmax}\
      \ is only where it became visible.\n\nSo the decision is whether openisd becomes\
      \ a group solver, which is far larger than this field,\nand it moves computed\
