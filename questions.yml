- id: QO43
  title: 'Box/vents/PRs have no facade: flat state.P fields + a parallel ''entered''
    provenance system'
  status: decided
  raised: '2026-08-14'
  body: ''
  notes:
  - at: '2026-08-14'
    text: "The driver got ManagedDriver; the rest of the project did not.\n\nWHERE\
      \ THEY LIVE NOW (verified 2026-08-14):\n- Vents and PRs are FLAT FIELDS in state.P\
      \ (store.ts P_DEFAULTS): Vb, Vf, ventShape,\n  ventD, ventW, ventH, ventL, Fb,\
      \ Frc / prSd, prNum, prMmd, prMadd, prCms, prRms,\n  prXmax, prFp, prName, prMode.\
      \ No object, no owner - any component can write them.\n- Their provenance is\
      \ state.P.entered, a Record<string,true> where presence means\n  Entered. That\
      \ is a SECOND, hand-rolled E/C/N system, unrelated to the driver's\n  SpecEntry/origin/readings\
      \ + cell().state.\n- Their solving is in logic/useVentGroup.ts (solveVentGroup)\
      \ and logic/usePrGroup.ts\n  (solvePrGroup), driven by two watch()ers in store.ts,\
      \ with enterVentField/\n  clearVentField/ventFieldState/ventTargetUnreachable/ventMaxReachableFb\
      \ and\n  enterPrField/clearPrField/prFieldState/prTargetUnreachable wrapping\
      \ them.\n\nTHE QUESTION: the store owns the PROJECT - box, vents, PRs, filters,\
      \ environment,\nmetadata - not merely persistent scalars plus a ManagedDriver.\
      \ Should each of those\nget the same treatment the driver got (an owning facade\
      \ with one provenance model),\nor does the project get ONE facade covering all\
      \ of them?\n\nThis is the same structural weakness the driver had before ManagedDriver\
