  - at: '2026-09-06'
    text: "John 2026-09-06: OpenISDBoxJson, OpenISDEnvironmentJson and OpenISDDeviceJson\
      \ are all nested inside OpenISDProjectJson (project.box, project.environment,\
      \ box.passiveRadiator.component). It's one boundary object. The schema to add\
      \ is a single openISDProjectJsonSchema \u2014 nested z.strictObject for box\
