      than WinISD's 3 dp of a metre) and the call site binds :precision="precision('Dd')". The same
      was done for fLe and all eight Dimensions fields, whose registry rows still described WinISD's
      units while the editor drew something else.
      Tests: driver-editor-units.test.ts :: "<field> binds precision('<id>') and renders that field's
      declared unit" (10 fields) and "Dd resolves finer than a millimetre".

      FILES CHANGED
        packages/ui/src/ui/components/DriverEditorModal.vue     fLe scale, Dd precision, Dimensions tab
        packages/ui/src/logic/fields/fieldRegistry.ts           Dd, fLe, dimThick..dimDvol rows
        packages/winisd/src/driver.ts                           numVC default in #derive
        packages/winisd/src/classic/wdr.ts                      VCCon default 2 -> 1
        packages/ui/test/ui/driver-editor-units.test.ts         NEW — 16 tests
        packages/winisd/test/driver-derive.test.ts              +2 tests
        packages/winisd/test/classic/wdr.test.ts                +2 tests

      GATES: lint 0 errors; npm run typecheck clean; vitest 435 passed; the narrow browser spec
      driver-editor-provenance.browser.spec.ts (which walks the Dimensions tab) 6/6 passed with
      --workers=1.

      FOUND BUT NOT FIXED — needs a ruling, listed so they are not lost:
        - AlfaVC on the driver editor's Advanced tab is labelled "1000/K" with NO :scale, while
          fieldRegistry's AlfaVC row documents ":scale=1000" and OriginalShell binds the store's
