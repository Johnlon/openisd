- id: QO30
  title: 'ParState slot 0 (Znom): WinISD writes C where openisd writes N - probe before changing the rule'
  status: open
  raised: '2026-08-13'
  body: ''
  notes:
  - at: '2026-08-13'
    text: |-
      HUMAN RULING: "Probe it first". The E/C/N rule for ParState slot 0 must NOT change until a
      probe establishes what WinISD actually does across cases.

      HOW IT SURFACED: `packages/winisd/test/driver-roundtrip.test.ts` previously ran against a
      third-party `.wdr` (now deleted) whose Znom was ENTERED, so slot 0 read `E` on both sides and
      the divergence was invisible. Pointing the test at a genuine WinISD save
      (`drivers/sample/winisd/John-all-manu-populated.wdr`) exposed it immediately.

      WHAT EACH SIDE EMITS, on that file:
        - WinISD writes `Znom=8` with ParState[0] = `C` — it considers Znom CALCULATED.
        - openisd emits ParState[0] = `N`. `Znom` is MODELED_SLOTS pos 0 → field `Z`
          (`packages/winisd/src/parstate.ts`), the file's ParState says C so `fromWdr` does not
          enter it, and no rule in `solveConsistencyGroup` computes `Z` — so `cell('Z').state`
          falls through to N.
        - The fresh-authored writer disagrees with BOTH: `classic/wdr.ts parstate()` hardcodes
          `s[0] = num(raw.Z) ? 'E' : 'C'`, i.e. C whenever Znom was not entered, and `toWdr` then
          writes `Znom = d.Z || d.Re`.

      WHAT THE PROBE MUST ESTABLISH: whether WinISD marks Znom C unconditionally, or only when it
      derived it from something (Re? a dropdown default?), and what it writes on the Znom line in
      each case. `drivers/sample/winisd/s-znom.wdr` covers only the ENTERED case (slot 0 = E).
      The blank file `john-all-defaults.wdr` has `Znom=0` with slot 0 = `N`, so C is NOT
      unconditional — something about a populated driver turns it on. That is the case to probe.

      CURRENT STATE OF THE TEST: `driver-roundtrip.test.ts` asserts ParState[1..48] round-trip
      identically and EXCLUDES slot 0, naming this question. Nothing has been changed to make it
      pass; the divergence is recorded, not papered over.
  - at: '2026-08-13'
    text: |-
      PROBED 2026-08-13 under wine (winisd.exe, wine 10.0, ~/.wine). Harness ran; 21 successful
      probes in winisd_research/runs/znom_state.jsonl from toys/campaign_znom_state.py.

      VERDICT: slot 0 is CALCULATED, not a pin. `C` there means WinISD derived Znom from Re.

          Znom = 2 * round( 0.75 * Re )        round = half-to-EVEN (Delphi's Round)

      18/18 EXACT (Znom is an integer, so the criterion is exact integer agreement, not a residual):

          Re    0.6  1.5  2  3.2  3.3333333333333335  4  4.666666666666667  5.5  6  7.333333333333333  8  9  10  12  27  123
          Znom  0    2    4  4    6                   6  8                  8    8  10                 12 14 16  18  40  184

      ROUNDING MODE pinned by three EXACT-.5 ties; it takes all three, none alone is decisive:
        Re=6  -> 0.75*Re = 4.5 -> 4 (even).  Half-up would give 5 -> Znom 10.  HALF-UP REFUTED.
        Re=10 -> 7.5 -> 8 (even).            Half-down would give 7 -> Znom 14. HALF-DOWN REFUTED.
        Re=2  -> 1.5 -> 2 (even).            Confirms both directions.

      The two NEAR-ties must be evaluated on the DECIMAL TEXT in the file, not on a Python double.
      Re=7.333333333333333 gives 0.75*Re = 5.49999999999999975 exactly -> 5 -> Znom 10 (a double
      product rounds to exactly 5.5 and would predict 12). Re=3.3333333333333335 gives
      2.500000000000000125 -> 3 -> Znom 6 (double gives exactly 2.5 -> would predict 4). WinISD
      observes the exact-decimal answer in BOTH. Delphi's 80-bit Extended is why.

      IT FOLLOWS Re, NOT THE DAMPING FACTORS. Z_incon_re8_qes27 writes Re=8 while Qes/Qts/Rms all
      describe a driver with Re=27: Znom came out 12 = 2*round(0.75*8), not 40. A CALCULATED Re
      serves equally: Z_re_unset leaves Re unset, WinISD back-derives Re=6 from row 2 and marks it
      C, and Znom still lands on 8.

      THE FOUR CASES THIS QUESTION ASKS FOR:

        case                                     file in         Znom saved   slot 0
        Znom ENTERED, agreeing with the rule     Znom=8, Re=6    8            E
        Znom ENTERED, contradicting the rule     Znom=4, Re=6    4            E  (pinned, never
                                                                                  corrected to 8)
        Znom ABSENT                              Re=6            8            C
        Znom entered then CLEARED in the editor  Znom=8, Re=6    8            C  (reverts to
                                                                                  calculated)

      So slot 0 is an ordinary E/C field on the WDR_SCHEMA 4.1 rule -- NOT a pin like numVC's
      permanent E. Re=0.6 rounds the product to 0 and WinISD saves Znom=0 marked C: a COMPUTED
      zero, distinct from the unset Znom=0/N of a blank driver. Reproduces the file that raised
      this question: John-all-manu-populated.wdr has Re=6 -> 2*round(4.5) = 8, slot 0 = C.

      WHAT THIS MEANS FOR openisd: emitting N at slot 0 is wrong whenever Re is known. The rule is
        - Znom entered            -> E, value as entered (never corrected against Re)
        - Znom not entered, Re known (entered OR calculated) -> C, value 2*round_half_even(0.75*Re)
        - Znom not entered, Re unknown                       -> N
      classic/wdr.ts parstate()'s `s[0] = num(raw.Z) ? 'E' : 'C'` has the right SHAPE but toWdr's
      `Znom = d.Z || d.Re` has the wrong VALUE -- it writes Re where WinISD writes 2*round(0.75*Re).
      For Re=6 that is 6 vs 8; for Re=8, 8 vs 12.

      NOT PROBED, and not inferred: Re entered with NOTHING else -- the shape of
      drivers/sample/winisd/s-re.wdr (Re=123, Znom=0, slot 0 = N), which the Re rule alone does not
      explain. Both attempts (Z_re_only, Z_re_minimal) killed WinISD under wine with c000008e
      (FLT_DIVIDE_BY_ZERO) before any value could be read -- the BUG-003 degenerate-driver crash
      class. Recorded as a crash, NOT as a result. Whether a driver too sparse to solve suppresses
      the Znom computation is UNTESTED.

      CHANNEL (new, and reusable): a `ParState=` line written into a project's [Driver] block IS
      honoured by a CLI load and round-trips byte-for-byte -- verified against
      John-all-manu-populated.wdr, 49/49 characters (toys/bringup_parstate_in_wpr.py). Without it a
      CLI-loaded project marks EVERY field E, absent-and-zero ones included, so "unset" cannot be
      expressed and no mark means anything. Full write-up: winisd_research/SOLVER_GAPS.md 2.5/2.7.
  - at: '2026-08-13'
    text: |-
      IMPLEMENTED 2026-08-13. The probe's rule is in the engine, the classic writer, and the docs; the
      round-trip test no longer excludes slot 0.

      THE FORMULA, exactly as probed:
          Znom = 2 * round_half_to_even(0.75 * Re)
      18/18 exact over runs/znom_state.jsonl (integer agreement, not a residual). Rounding pinned by the
      three exact-.5 ties: Re=6 -> 8 (half-up refuted), Re=10 -> 16 (half-down refuted), Re=2 -> 4.

      HOW THE DECIMAL-TEXT EVALUATION WAS HANDLED -- the point the ledger note warned about.
      The engine receives Re as an IEEE double, not as the file's text, so "evaluate on the decimal
      text" could not be taken literally. It did not need to be. Checked with exact rationals
      (build/znom_check.py, Python Fractions over the exact decimal AND over the exact double):

        route                                     16 swept rows
        exact decimal text * 3/4                  16/16 correct
        EXACT product of the parsed double * 3/4  16/16 correct   <- what is implemented
        double-ROUNDED product (0.75 * Re)        14/16 -- fails BOTH near-ties

      So the two readings never disagree; what breaks the naive version is the ROUNDING of the product,
      not the parse. `0.75*Re` is `3*Re/4`, needing up to 55 mantissa bits against a double's 53, and on
      Re=7.333333333333333 that rounds to exactly 5.5 (predicting 12 where WinISD wrote 10) and on
      Re=3.3333333333333335 to exactly 2.5 (predicting 4 where WinISD wrote 6). Delphi's 80-bit Extended
      never rounds there. `nominalImpedance` therefore carries the product as an unevaluated pair
      hi + lo: Re/2 and Re/4 are each exact under binary scaling, and a two-sum recovers the residual
      their addition discards. frac(hi) is a multiple of ulp(hi) while |lo| <= ulp(hi)/2, so lo can only
      BREAK a genuine tie -- it can neither manufacture nor destroy one. That is Extended reproduced
      exactly, not approximated.

      WHERE IT LANDED
        packages/engine/src/driver.ts   `nominalImpedance(Re)` + block 14 of solveConsistencyGroup's
                                        full pass, placed after every block that can PRODUCE Re (6, 12)
                                        because a CALCULATED Re feeds the rule (probe Z_re_unset). It
                                        does NOT go through setVal: that refuses a non-positive result
                                        and Re<2/3 yields a COMPUTED zero (Z_tie_re0.6 -> Znom=0 marked
                                        C, distinct from a blank driver's unset 0/N).
        packages/winisd/src/classic/wdr.ts  toWdr's `Znom = d.Z || d.Re` wrote Re itself (6 where WinISD
                                        writes 8; 8 where it writes 12). Now `d.Z ?? nominalImpedance(d.Re)`.
                                        parstate slot 0 is `E` entered / `C` calculated / `N` when there
                                        is no Re to calculate from.

      TESTS -- 11 new, expectations taken from the formula and the probe rows, never read back from code
        packages/engine/test/znom.test.ts (9): all 16 swept rows; the three ties named individually;
          both near-ties asserted AGAINST the naive double route so the exactness cannot be lost
          silently; the computed zero; entered-Znom-contradicting-Re stays pinned; follows Re not the
          damping factors (Z_incon_re8_qes27 -> 12, not 40); a calculated Re works as input
          (Z_re_unset -> Re 6 -> Znom 8); no Re -> no Znom.
        packages/winisd/test/classic/wdr.test.ts (2): Znom=8 from Re=5.6, and slot 0 C-vs-E.
        packages/winisd/test/driver-roundtrip.test.ts: the slot-0 EXCLUSION IS GONE. All 49 characters
          of John-all-manu-populated.wdr now round-trip -- the file that raised this question.

      DOCS
        docs/design/WDR_SCHEMA.md -- new relation row 23 (Znom, Re) and a new 4.2 stating the evidence,
          the rounding mode, the exactness requirement, the four E/C/N cases, and the UNPROBED case
          (Re entered with nothing else; both attempts died on the c000008e degenerate-driver crash).
          3.2's "all user-entered" preamble and the Znom row corrected; the 8.4 probe table's slot-0 row
          now states E/C/N.
        docs/spec/SPEC_ENGINE.md 6(b) -- Znom added to the calculated set, with the warning that a .wdr
          written with Znom copied from Re, or slot 0 marked N, disagrees with WinISD.

      STILL STALE, NOT MINE TO EDIT: docs/plans/OPENISD_MODEL_MIGRATION_READINESS.md:69 blocker B1 says
      "nothing has been probed" and cites the slot-0 exclusion that no longer exists. Whoever owns the
      migration plan should clear B1.
  - at: '2026-08-14'
    text: |-
      STEP 4 RE-VERIFIED, no new work needed. Session found QO30 already carried a full PROBED +
      IMPLEMENTED answer from earlier tonight (2026-08-13) and did not re-run the wine probe.

      RULE (already in ledger, re-confirmed by reading the artifacts, not re-derived):
        Znom entered              -> E, value as entered, never corrected against Re
        Znom absent, Re known     -> C, value 2*round_half_to_even(0.75*Re)
        Znom absent, Re unknown   -> N

      VERIFIED PRESENT IN THE TREE (this session read each, did not just trust the ledger note):
