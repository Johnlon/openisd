  answer:
    at: '2026-08-21'
    text: "HUMAN RULING: Proposal B \u2014 one method per format.\n\nDECIDED, the\
      \ FileIO interface (docs/design/FILEIO_API_PROPOSALS.md carries the full comparison):\n\
      \  readWdr(bytes)           -> Result<OpenISDDriver>\n  writeWdr(driver)   \
      \      -> Result<Uint8Array>     // CAN fail: an incomplete driver\n  readOwdr(bytes)\
      \          -> Result<OpenISDDriver>\n  writeOwdr(driver)        -> Uint8Array\
      \             // cannot fail\n  readWpr(bytes)           -> Result<OpenISDProject>\n\
      \  writeWpr(project, now)   -> Result<Uint8Array>     // `now` injected, never\
      \ the clock\n  readOwpr(bytes)          -> Result<OpenISDProject>\n  writeOwpr(project)\
      \       -> Uint8Array\n  formatOf(filename) / sniff(bytes) -> FileFormat | undefined\n\
      \  encodeShareLink(project) / decodeShareLink(url)\n\nWHY B: only this shape\
      \ lets a signature tell the truth about failure \u2014 writeOwdr returns bytes\n\
      because a record is always representable as its own JSON, while writeWdr returns\
      \ Result because a\ndriver can be too incomplete to project. Under A one Result\
      \ covers both and every .owdr caller\nunwraps an error that can never arrive.\
