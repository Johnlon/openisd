- id: QO52
  title: 'P1S4 design decision: state.P box/vent/PR fields become accessor properties
    over OpenISDProject, not a rewrite of call sites'
  status: decided
  raised: '2026-08-17'
  body: ''
  answer:
    at: '2026-08-18'
    text: "It is illegal to have a global symbol other than the ones I have specifically\
      \ agreed to. The only\npermitted globals are:\n  openProjects(): [OpenISDProject]\
      \      \u2014 empty if no projects open\n  focusedProject(): null | OpenISDProject\
      \ \u2014 null if no project is open\n\nEvery other export currently in packages/ui/src/logic/store.ts\
      \ (state, managedProject, _ground,\nisModified, driver, driverRecord, driverName,\
      \ driverErrors, syncedP, curvesData, formatInUnit,\ndriverCell, enterVentField,\
      \ etc \u2014 the full ~40-export surface) is a global-symbol violation and\n\
      must become a method/getter on the focused OpenISDProject instead of a free-standing\
      \ module\nexport. Globals are inherently evil and usually a lazy or broken design\
      \ \u2014 I will generally reject\nrequests to keep one. If an agent believes\
      \ a specific symbol has a strong justification to remain\nglobal, it must ask\
      \ for that symbol by name with a strong justification; otherwise remove it.\n\
      \nThis is a full state-model migration (store.ts rewrite + every consuming call\
      \ site across the ui\npackage, ~15 files) and needs its own planned task, not\
      \ an inline edit."
