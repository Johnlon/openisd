- id: QO4
  title: TODO — Engine hardening
  status: done
  raised: '2026-08-05'
  body: |
    **Priority: HIGH.** The engine can still emit `NaN`/`Infinity` on degenerate input
    mid-sweep, producing a blank/garbage chart with no explanation. This undermines the
    one thing the tool exists to do: produce trustworthy numbers.

    Design + rationale: `CODE_REVIEW/ENGINE_HARDENING.md`. Findings:
    `CODE_REVIEW/CODE_REVIEW.md` §11, §16-18, §20-21.

    **Failure is communicated with the `Result` pattern, never by throwing** — the
    engine's contract is `{ value, errors }` with `error`/`warn`
    levels. Both layers of the fix feed that one channel.
  items:
  - text: 'ACCEPTANCE: a driver with Vas+Qts but no Qms gives a clear message, not a blank graph'
    done: true
  - text: 'ACCEPTANCE: Vb = 0 gives a clear error, not Infinity-poisoned curves'
    done: false
  - text: 'ACCEPTANCE: an isolated mid-sweep singularity still draws the curve with a gap plus a warn
      naming the frequency; never silently blanked'
    done: false
  - text: 'ACCEPTANCE: no code path returns a non-finite value to a chart without a surfaced issue'
    done: true
  - text: 'ACCEPTANCE: all existing physics tests pass unchanged; math for valid inputs stays byte-identical
      to the goldens'
    done: true
  - text: 'ACCEPTANCE: new tests cover each rejection/partial case with a human-readable scenario name'
    done: true
  notes:
  - at: '2026-08-05'
    text: Migrated verbatim from openisd/CODE_REVIEW/ENGINE_HARDENING_TODO.md. May be a TASK rather than
      a decision — needs triage.
  - at: '2026-08-05'
    text: |-
      2026-08-05: background agent dispatched to consolidate CODE_REVIEW.md, ENGINE_HARDENING.md,
      ENGINE_HARDENING_TODO.md and REMEDIATION_PLAN.md into ENGINE_HARDENING_TODO_1.md and
      CODE_REVIEW_1.md, re-verifying every finding against the current code with quoted evidence
      per row. Stays open until that lands and the remaining live findings are known.
  - at: '2026-08-05'
    text: |-
      2026-08-05 engine hardening landed. QO4.1/.4/.5/.6 ticked. QO4.2 (Vb=0 clear error) and QO4.3
      (mid-sweep singularity gap + warn) are MET ENGINE-SIDE ONLY and deliberately left unticked:
      the error is produced, correct and named, but the default skin has nowhere to show it.

      Root cause, now reported independently by three agents: allIssues is consumed only by
      DriverPanel.vue, mounted only via ModernShell, while the default skin is 'original'
      (store.ts:92, skins.ts:27-31). And GraphPanel.vue:34 feeds .gmsg from driverErrors, NOT
      allIssues, and filters to error only — so no box-parameter or sweep issue can ever reach a
      chart. grep -ci "issue|warn" over OriginalShell.vue and ClassicShell.vue returns 0 for both.

      Also fixed in the same pass: the §11 defect was worse than briefed. deriveDriver({Qts:0.5,
      Qes:0.4, Qms:0.5}) returned errors:[] and a non-null driver at HEAD, and Qes:Infinity passed
      the guard because Infinity > 0 is true. Fixed at the divide in solveConsistencyGroup
      (driver.ts:62-64), not at the symptom. formulas.ts duplicate literals replaced with the
      imported C and RHO, verified bit-identical across 273.15-350 K. Goldens unchanged: 6 passed,
      fixtures dir clean. 387 unit tests pass, lint and typecheck clean.
  - at: '2026-08-06'
    text: Engine hardening (preconditions, postconditions, residual input guards, store issue channel,
      and UI warning pill) fully verified and 100% green.
- id: QO5
