- id: QO20
  title: "EBP is not a driver field \u2014 what should typing one DO? (blocks the\
    \ last of QO11.1)"
  status: decided
  raised: '2026-08-05'
  body: ''
  notes:
  - at: '2026-08-05'
    text: "The human asked for EBP to be editable on the What-If panel. Bl and Mms\
      \ were done; EBP cannot\nbe, without a ruling.\n\nWHY IT IS DIFFERENT FROM Bl\
      \ AND Mms. Bl and Mms are members of the ADT's derivation set:\nsolveConsistencyGroup\
      \ produces them, Driver.enter() overrides them, cell() reports E or C. EBP\n\
      is not there at all \u2014 it is engine/src/alignments.ts:40, `ebp(d) = d.Fs\
      \ / d.Qes`, computed on\nthe way to the screen. So cell('EBP') is permanently\
      \ N.\n\nTHE TWO WAYS TO MAKE IT EDITABLE, AND WHY NEITHER IS THE AGENT'S TO\
      \ PICK:\n\n(a) Store it. enter('EBP', v) writes #inputs.EBP and cell() reports\
      \ E \u2014 but nothing reads it.\n    The panel would show the number back and\
      \ the charts would ignore it: a field that LOOKS\n    like an override and is\
      \ not one. Rejected on sight.\n\n(b) Solve backwards. EBP = Fs/Qes has two unknowns,\
      \ so an entered EBP can set EITHER\n    Qes = Fs/EBP or Fs = EBP*Qes. They are\
      \ different edits with different consequences \u2014\n    changing Qes moves\
      \ Qts and the whole alignment; changing Fs moves the driver's resonance.\n \
      \   There is no way to infer which the human means, and picking one silently\
      \ rewrites a field\n    they did not touch.\n\nAlso note (b) adds calculation\
      \ logic, which openisd/AGENTS.md gates on explicit human\npermission in the\
      \ conversation. Both reasons point the same way: ask.\n\nRelated: QO12 asks\
      \ the same class of question for the OVER-DETERMINED case (typing Mms while\n\
      Fs/Cms stay entered). A ruling on QO12(a) \"solve back\" would supply the eviction\
      \ rule that\nthis question also needs.\n\nWHAT IS NEEDED: which field an entered\
      \ EBP should drive (Qes, or Fs), or a ruling that EBP\nstays a read-out. It\
      \ is currently a read-out on both panels, tooltipped\n\"EBP = Fs / Qes \u2014\
      \ a read-out of the two fields above, not a field of its own.\""
  answer:
    at: '2026-08-05'
    text: "\"ebp stays readonly\"\n\nRULED: EBP is a read-out and stays one. Do not\
      \ make it editable, and do not revisit this\nunder the QO11 \"every field must\
      \ be editable\" heading \u2014 that rule is about overriding a\nCALCULATED DRIVER\
      \ FIELD, and EBP is not a driver field at all.\n\nWhy it is not one: EBP = Fs/Qes\
      \ is computed in engine/src/alignments.ts, not produced by\nsolveConsistencyGroup,\
      \ so cell('EBP') is permanently N. An entered EBP would sit in an inert\nbox\
      \ nothing reads. Solving it backwards is ambiguous \u2014 one equation, two\
      \ unknowns, so it\ncould set Qes or Fs, which are different edits with different\
      \ consequences \u2014 and inventing\nthat rule is calculation logic, which openisd/AGENTS.md\
      \ gates on explicit human permission.\n\nBoth panels tooltip it as a read-out\
      \ of the two fields above it. QO11.1 is therefore complete\nas far as it can\
      \ be: Bl and Mms are editable, EBP is out of scope by ruling."
