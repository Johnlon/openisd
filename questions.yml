        Mcost    = Rme * (1 + Xmax / min(Hc, Hg))             10 samples, worst rel resid 1.5e-15

      Two competing forms were REFUTED by purpose-built discriminators, not merely unpreferred:
        - Gloss = g*Mms*Cms/Xmax is exact on every self-consistent driver (Mms*Cms = 1/(2*pi*Fs)^2
          there). Three drivers with Fs written to disagree with Mms*Cms separate them: Gloss
          follows the stored Fs; the Mms*Cms form lands at relative residual 3.0.
        - Mcost = Rme*(Hc+Hg)/(2*min(Hc,Hg)) is exact on all four stage-1 samples because each had
          Xmax = |Hc-Hg|/2. Two drivers with Xmax written away from Hc/Hg separate them: that form
          lands at 0.40. Mcost reads Xmax itself, not the gap geometry's implied excursion.

      MCOST IS DERIVED, NOT USER DATA. It reads 0 in every pre-existing file only because Hc/Hg
      are 0 there and min(Hc,Hg) is the divisor. Populate them and it computes. Its unit is Ns/m,
      the same as Rme, to which it reduces when the coil never leaves the gap.

