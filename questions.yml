      \ which framed the TS record shape as \"hand-transcribed against the real\n\
      pydantic models\" with Python treated as the source of truth being mirrored,\
      \ and cited a\nnow-deleted \"ARCHITECTURE.md AD-8\" anchor (AD-numbering was\
      \ removed in the spec overhaul).\nCorrected in this pass: openisdRecord.ts's\
      \ header now states OpenISD owns this shape\noutright; the current field-for-field\
      \ match to the Python pipeline's shape is because the\ndriver.yml -> openisd.yml\
      \ projection logic has not yet been ported out of Python into\nOpenISD, not\
      \ because Python is authoritative."
