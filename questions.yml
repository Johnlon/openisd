    sign-off-gated change to computed numbers, and maintainability (no behaviour change).
  items:
  - text: 'Additive input guard (no formula change) — §11 `Qms == Qts`: in `deriveDriver`, when both `Qts`
      and `Qms` are given, require `Qms > Qts` (else `error`); otherwise `Qes = Qts·Qms/(Qms−Qts)` → ∞.'
    done: false
  - text: 'Additive input guard (no formula change) — §18 params: add a param precondition: `Vb > 0`,
