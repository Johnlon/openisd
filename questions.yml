      \ concurrent suites)."
  - at: '2026-08-13'
    text: "D7 \u2014 `npm test` ignored its argument and ran BOTH FULL SUITES. FIXED.\
      \ (Raised by the coordinator\nmid-pass; same class as D1 \u2014 an npm script\
      \ that does not do what its invocation says.)\n\nDIAGNOSIS. package.json \"\
      test\" was the literal string `npm run test:unit && bash\nscripts/test-browser.sh`.\
      \ npm appends a script's arguments to the END of that string, so\n`npm test\
      \ <path>` became `npm run test:unit && bash scripts/test-browser.sh <path>`:\n\
      \  - vitest NEVER saw the path and ran the whole 52-file / 591-test unit suite;\n\
      \  - the path was then handed to Playwright, which for a vitest file matches\
      \ nothing.\nSo a request for ONE file ran everything, and then failed on top.\
      \ scripts/test-browser.sh does\naccept a path and always did (it forwards \"\
      $@\" to playwright); the npm script was dropping it\nbefore that point by placing\
      \ it after the wrong runner. Breaches openisd/AGENTS.md:42\n(verified: \"Do\
      \ not run the full suite when an isolated test is sufficient ... run only the\n\
      specific target test file\").\n\nFIX. New scripts/test.sh (with the mandatory\
      \ Git-Bash/WSL guard), and \"test\": \"bash\nscripts/test.sh\". The two suites\
      \ take different runners, so one path cannot be forwarded to\nboth; the suffix\
      \ routes it, using playwright.config.js's own testMatch convention:\n  no arguments\
      \            -> the full gate, vitest then browser (unchanged; `npm run ci`\
      \ intact)\n  any arg *.browser.spec.ts -> exec scripts/test-browser.sh \"$@\"\
      \n  any arg with / or *.test.{ts,js,mjs} -> exec npx vitest run \"$@\"\n  flags\
      \ only, no target   -> ERROR naming both narrow invocations, exit 1\nSilently\
      \ widening a narrow request is gone: the no-target case is refused, never expanded.\n\
      \nSECOND HAZARD FOUND WHILE PROVING IT \u2014 and it is the dangerous one. `npm\
      \ test --workers=1` does\nNOT reach the script at all: npm claims every LEADING\
      \ `--flag` as its own config and re-exports\nit as an environment variable.\
      \ Verified: `npm run env --workers=1 | grep npm_config_workers` ->\n`npm_config_workers=1`.\
      \ The script therefore saw $# = 0 and launched the FULL browser suite \u2014\
      \ I\ntriggered this myself while testing and had to kill the run and free port\
      \ 4100. Since the\nswallowed flag survives in the environment, scripts/test.sh\
      \ now scans npm_config_{workers,\nheaded,ui,debug,grep,grep_invert,update_snapshots,last_failed,retries,trace,project,reporter,\n\
      coverage,watch,shard,max_failures,timeout} and, if any is set while $# = 0,\
      \ refuses with\n\"npm swallowed your flags\" and the `npm test -- <target> <flags>`\
      \ form. Those names are\nPlaywright/vitest flags with no npm config of the same\
      \ name, so a real npm option cannot trip it.\n\nCORRECT INVOCATION FOR A SINGLE\
      \ FILE, now (this is what every agent prompt asks for):\n  npm test packages/engine/test/sealed-fc.test.ts\
      \                          # vitest, one file\n  npm test -- packages/ui/test/ui/visual.browser.spec.ts\
      \ --workers=1       # playwright, one spec\nThe bare `--` is REQUIRED whenever\
      \ flags are passed, or npm eats them.\n\nPROOF \u2014 test COUNTS for a single\
      \ file through the new invocation:\n  npm test packages/engine/test/sealed-fc.test.ts\n\
      \      -> \"Test Files 1 passed (1) / Tests 6 passed (6)\". Six is that file's\
      \ own count; the unit\n         suite is 52 files / 591 tests, and no browser\
      \ suite ran at all.\n  npm test -- packages/ui/test/ui/visual.browser.spec.ts\
      \ --workers=1\n      -> \"Running 4 tests using 1 worker ... 4 passed (59.0s)\"\
      . Four is that spec's own count;\n         no unit suite ran.\n  npm test --workers=1\
      \        -> ERROR \"npm swallowed your flags\", exit 1, nothing executed.\n\
      \  npm test -- --workers=1     -> ERROR \"no test target in the arguments\"\
      , exit 1, nothing executed.\nComment references to the npm scripts still hold:\
      \ `npm run test:visual -- --update-snapshots`\nstill collects 4 tests through\
      \ the new D1 zero-test guard (verified with --list).\nRe-ran after the change:\
      \ lint 0 errors (25 pre-existing warnings)."
