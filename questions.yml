- id: QO86
  title: 'Export discipline: nothing public by default; export * banned outright'
  status: decided
  raised: '2026-08-23'
  body: ''
  answer:
    at: '2026-08-23'
    text: "RULED (John, 2026-08-23, verbatim): \"generally nothing should be public\
      \ or exported and that export * is a serious violation of control and arch,\
      \ and we need an arch test to detect it and block it in favour of named selective\
      \ intentional exports of own code and never a re-exported symbol.\"\n\nThe principle:\
      \ private by default. A symbol is exported only when a named consumer needs\
      \ it, as a NAMED, SELECTIVE, INTENTIONAL export of the module's OWN code. `export\
      \ *` is banned everywhere including package barrels \u2014 a barrel lists its\
      \ exports by name. A re-exported symbol (any spelling) remains banned per QO80's\
      \ re-export gate; this ruling extends it: the wildcard form is a serious violation\
      \ in its own right, and an arch test must detect and BLOCK it."
  notes:
  - at: '2026-08-23'
    text: 'EXECUTION REFINED (John, 2026-08-23, verbatim): "make the exports check
      take a baseline from current state so it isn''t blocking our release, but a
      fail if new wildcards are added. needs to record exactly what is exported where
      to make this possible. the job for the AI and human will be to trim back that
      baseline by replacing them all with explicit exports then remove the baseline
      data so any new instances are fails, then finally we remove unjustified exports
      and/or move code to its proper home if that''s the root cause. for now let''s
      take a baseline and add the tests, then as a non-blocking unit of work convert
      all wildcard to specific and remove the wildcard from the baseline, but not
      as a release blocker."


      So: a RATCHET gate. (1) NOW: baseline every existing `export *` site WITH the
      exact symbol list it currently re-exports, recorded in the gate; test passes
      on the baseline, fails on any NEW wildcard or any growth of an existing one.
      (2) Non-blocking work unit: convert wildcards to named exports one by one, deleting
      each from the baseline as it converts, until the baseline is empty and the ban
      is absolute. (3) Later, separate: trim unjustified exports / relocate code where
      misplacement is the root cause. None of it blocks the release.'
