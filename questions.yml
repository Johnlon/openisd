- id: QO32
  title: 'Advanced-panel formula recovery: Gloss, SPLmaxLF, Mcost'
  status: decided
  raised: '2026-08-13'
  body: ''
  notes:
  - at: '2026-08-13'
    text: "RAN. The wine harness works from this machine as-is: wine 10.0, ~/.wine\
      \ prefix already\nbootstrapped (openal32 + Windows Python present), winisd.exe\
      \ launches, Driver editor drives\nend to end. 34 live probes in runs/advanced_formulas.jsonl\
      \ (~20 s each, one relaunch per\nsample), plus the 7 pre-existing runs/env_sample*.wpr\
      \ = 41 samples.\n\nALL THREE RECOVERED (refit any time: toys/fit_advanced_formulas.py):\n\
      \n  Gloss    = g / ((2*pi*Fs)^2 * Xmax),  g = 9.80665     41 samples, worst\
      \ rel resid 3.6e-15\n  SPLmaxLF = 20*log10( rho0*(2*pi*20)^2*Vd / (2*pi*sqrt2)\
      \ / 20uPa )\n                                                        41 samples,\
      \ worst rel resid 6.8e-16\n  Mcost    = Rme * (1 + Xmax / min(Hc, Hg))     \
      \        10 samples, worst rel resid 1.5e-15\n\nTwo competing forms were REFUTED\
      \ by purpose-built discriminators, not merely unpreferred:\n  - Gloss = g*Mms*Cms/Xmax\
      \ is exact on every self-consistent driver (Mms*Cms = 1/(2*pi*Fs)^2\n    there).\
      \ Three drivers with Fs written to disagree with Mms*Cms separate them: Gloss\n\
      \    follows the stored Fs; the Mms*Cms form lands at relative residual 3.0.\n\
      \  - Mcost = Rme*(Hc+Hg)/(2*min(Hc,Hg)) is exact on all four stage-1 samples\
      \ because each had\n    Xmax = |Hc-Hg|/2. Two drivers with Xmax written away\
      \ from Hc/Hg separate them: that form\n    lands at 0.40. Mcost reads Xmax itself,\
      \ not the gap geometry's implied excursion.\n\nMCOST IS DERIVED, NOT USER DATA.\
      \ It reads 0 in every pre-existing file only because Hc/Hg\nare 0 there and\
      \ min(Hc,Hg) is the divisor. Populate them and it computes. Its unit is Ns/m,\n\
      the same as Rme, to which it reduces when the coil never leaves the gap.\n\n\
      GLOSS IS A FRACTION IN THE FILE AND A PERCENT IN THE UI (x100). That reconciles\
      \ GAPS.md's\nBeyma figure Gloss=4.5441 with the 0.0037-scale values stored in\
      \ .wpr files.\n\nONE CORPUS FILE IS NOT SELF-CONSISTENT: runs/env_sample5.wpr\
      \ stores Fs=200 while its own\nMms*Cms give 201.0, and its Gloss matches 201.0\
      \ to 1.4e-16 - its Fs key is stale.\n\nSTILL UNKNOWN / NOT ATTEMPTED HERE: rows\
      \ 1-5, 8-11, 14-18 remain unprobed for route\nattribution (SOLVER_GAPS section\
      \ 2.3); row 18 (SPL from eta0) is still an inferred relation,\nnot binary-confirmed.\
      \ Nothing about the Box/Vents solver was touched.\n\nDOCS UPDATED: SOLVER_GAPS.md\
      \ (rows 7/21/22 + new section 2.4 with the residual table and the\ntwo refutations),\
      \ KNOWLEDGE_REPORT.md (formula block + the inferred-formulas bullets),\nREADME.md\
      \ item 4, GAPS.md lines 227/374, WINE_HARNESS.md (new section: the two-edit\
      \ sequence\nneeded to get computed driver fields into a saved .wpr, plus the\
      \ editor Save/dirty/rect facts\nthis cost time to find)."
  - at: '2026-08-13'
    text: "2026-08-13 IMPLEMENTED AND VERIFIED. Full evidence, recorded at the human's\
      \ request.\n\nWHERE: solveConsistencyGroup's full pass, packages/engine/src/driver.ts:237-268,\
      \ same fill-if-absent\nsetVal semantics as the rest of the group.\n    loss\
      \     = G_STANDARD / ((2*pi*Fs)^2 * Xmax)        G_STANDARD = 9.80665, added\
      \ to constants.ts\n    SPLmaxLF = 20*log10( rho * (2*pi*20)^2 * Vd / (2*pi*sqrt(2))\
      \ / P0 )\n    Mcost    = Rme * (1 + Xmax / min(Hc, Hg))           consumes the\
      \ existing Rme route precedence\nP0 is REUSED -- no second SPL constant was\
      \ introduced.\n\nACCURACY: all three reproduce WinISD's stored values to <=\
      \ 2.7e-15 relative across 13 oracle rows.\n\nSPLmaxLF TRACKS THE AIR MODEL,\
      \ NOT A LITERAL -- this was tested, not assumed. rho comes from\nairOf(r): the\
      \ record's own roo, else the engine RHO. The same driver at three different\
      \ roo values\nreproduces WinISD to < 5.3e-16 relative:\n    roo 0.9        \
      \         -> 81.4286971830493\n    roo 1.20095217714682    -> 83.9343612703015\n\
      \    roo 1.5                 -> 85.8656721753764\nSo it demonstrably follows\
      \ the air properties rather than a hardcoded 1.20095.\n\nBOTH RIVAL FORMS STAY\
      \ REFUTED against the implementation: the Gloss rival is 4x out, the Mcost rival\n\
      40% out.\n\nGLOSS UNIT BOUNDARY -- the .wdr carries the FRACTION, the panel\
      \ shows PERCENT, and the x100 lives in\nexactly ONE place: :scale=\"100\" on\
      \ the Gloss NumInput in DriverEditorModal.vue, the same mechanism\neta0 uses.\
      \ Solver, parser and model all hold the fraction. Four tests pin it at\ndriver-editor-units.test.ts:169\
      \ -- the file carries the fraction and the parser does not scale it;\nWinISD's\
      \ own pair (file 0.0231721405215982 -> pane \"2.3172\") at the registry's 4\
      \ dp; typing the\npercent back stores the fraction; an in-app driver gets a\
      \ Gloss from the solver. Independently\ncorroborated by docs/design/WDR_SCHEMA.md:185\
      \ (WinISD's help file).\n\nGLOSS LABEL WAS ALSO WRONG: it read \"Cone material\
      \ loss factor\". Corrected to what the quantity\nactually is.\n\nMCOST ZERO-DIVISOR\
      \ GUARDED: Hc or Hg missing or zero leaves Mcost ABSENT -- not 0, not Infinity.\n\
      Tested over {0,0}, {0.012,0}, {0,0.006}, {}. Reduces to Rme exactly at Xmax=0.\n\
      \nFILL-IF-ABSENT IS LOAD-BEARING: WinISD marks Gloss `E` in 4 corpus files,\
      \ so these cannot be\nunconditional overwrites.\n\nGOLDENS: none moved. golden.test.ts\
      \ 12/12 exact, no regeneration. The three fields live in the FULL\npass only;\
      \ charts and sweeps go through deriveDriver's classic path.\n\nGATES: lint 0\
      \ errors (25 pre-existing Playwright-plugin warnings in untouched files); typecheck\
      \ clean\nacross engine/winisd/ui; vitest 131/131 on the affected set (advanced-figures\
      \ 25, driver 28,\nconsistency 11, golden 12, wdr-carried-keys 34, driver-editor-units\
      \ 21).\n\nTWO ITEMS LEFT FOR A RULING, carried into the OpenISD-model migration:\n\
      \  1. 245 of 1622 library .wdr files still show Gloss = 0 despite Fs > 0 and\
      \ Xmax > 0. The ADT imports\n     the carried `Gloss=` line as ENTERED and backfills\
      \ `Gloss=0` when the key is missing, so a stale\n     zero blocks the derivation.\
      \ It cannot simply be dropped from the carried set (Gloss is\n     legitimately\
      \ E in 4 files), and the principled fix -- honour ParState slot 37 -- breaks\
      \ an\n     oracle-backed round-trip test. SPLmaxLF and Mcost are unaffected:\
      \ neither is a carried key.\n  2. packages/ui/src/logic/fields/fieldRegistry.ts\
      \ still describes all three as \"formula has NOT been\n     recovered\"."
