- id: QO7
  title: "Humidity and pressure inputs are inert \u2014 extend the model, or mark\
    \ them visibly dead?"
  status: decided
  raised: '2026-08-05'
  body: ''
  notes:
  - at: '2026-08-05'
    text: "Bug file: openisd/bugs/BUG_20260805_humidity-and-pressure-inputs-are-collected-persisted-and-then-ignored.md\n\
      \nThe Advanced pane collects temperature, humidity and pressure; the Options\
      \ dialog persists all\nthree; only tempK reaches the engine. advHumidity and\
      \ advPressure land in local refs nothing\nreads (OriginalShell.vue:560-561).\
      \ Params carries tempK alone (types.ts:183). The user gets no\nsignal the value\
      \ was discarded.\n\nThis matters more than a dangling input because humidity\
      \ is exactly what makes WinISD's\nconstants what they are: c=343.684120962152\
      \ and roo=1.20095217714682 reproduce from\nT=293.15K, RH=30%, p=101325Pa to\
      \ within 3-5 ppm on both. openisd hardcodes the RESULT of a 30%\nRH assumption\
      \ while offering a humidity box that cannot change it.\n\nTwo options, and the\
      \ choice is yours:\n  1. Extend the model \u2014 add humidityPct and pressurePa\
      \ to Params, derive c and roo from all\n     three via the moist-air formulation,\
      \ surface air density beside sound velocity. This moves\n     EVERY golden fixture,\
      \ so it cannot be done silently.\n  2. Mark both inputs visibly inert \u2014\
      \ the shell already has that pattern. No number changes.\n\nwinisd_research/GAPS.md\
      \ A6 recommends either, and warns explicitly: do NOT re-open the\nconstants\
      \ themselves, they already match WinISD exactly."
  - at: '2026-08-05'
    text: "2026-08-05 SETTLED BY EXPERIMENT \u2014 WinISD persists T, p and phi and\
      \ does NOT apply them.\nopenisd's inert humidity/pressure inputs mirror WinISD's\
      \ behaviour exactly.\n\nCORRECTION FIRST: the earlier research claim that \"\
      .wpr does not persist T, RH or p at all\"\nis WRONG, and I repeated it. That\
      \ agent inspected [SimulatorOptions] (VCInd, FlatResponse,\nTLPorts) and concluded\
      \ absence. The environment is in the [Box] section:\n\n    T=293.15      temperature,\
      \ kelvin\n    p=101325      air pressure, Pa\n    phi=0.3       relative humidity\
      \ as a FRACTION (0.3 = 30%), not a percentage\n\nAlso in [Box]: d, Med, Nd,\
      \ Angle, Isobarik. Human-produced probes sample1-sample4 confirm all\nthree\
      \ round-trip independently.\n\nTHE EXPERIMENT (human-produced, C:\\tmp\\sample1..6.wpr,\
      \ 2026-08-05):\n\nsample5 \u2014 T=303.15 AND Fs changed 100->200. The Fs edit\
      \ forced a full recompute: Mms, Rms, Re,\nno, EBP, SPL, SPLmax, USPL, gamma,\
      \ Rme, Mpow, Gloss all moved. c and roo did NOT. Stored SPL\nreproduces to 5e-13\
      \ from K(c=343.684120962153, roo=1.20095217714682); had c/roo followed\nT=303.15\
      \ (349.51 / 1.16133) the SPL would have been 113.7387 instead of the stored\
      \ 113.8114.\n\nsample6 \u2014 Fs restored to 100, Le touched to trigger recompute,\
      \ T=303.15. Diff against the\nsample1 baseline is EXACTLY ONE LINE: T=293.15\
      \ -> T=303.15. Every other byte identical.\n\nSo a 10 C change with a demonstrated\
      \ recompute produces no change in any stored value.\n\nCONSEQUENCE FOR THE RULING.\
      \ The human ruled \"extend the model\" on 2026-08-05, before this was\nknown.\
      \ That ruling now means something different: extending is a deliberate IMPROVEMENT\
      \ OVER\nWinISD, not parity with it. It runs against the workspace rule \"Where\
      \ WinISD deviates from\ntextbook acoustics, the .wdr must match WINISD \u2014\
      \ it is the consumer\", and QO8's side-by-side\nsuite would report the difference\
      \ as a permanent divergence (~0.07 dB at 30 C).\n\nThree options put to the\
      \ human: extend anyway and exempt it in the parity suite; match WinISD\nby marking\
      \ the inputs visibly inert; or extend behind an opt-in that defaults to WinISD-faithful.\n\
      \nREMAINING UNCERTAINTY, stated honestly: one WinISD version, one driver. The\
      \ Advanced tab's own\nSound velocity / Air density readouts were not observed\
      \ after a T change \u2014 it is conceivable\nthey refresh on the tab while the\
      \ saved values do not. That would not change the conclusion for\nstored data,\
      \ which is what openisd must match."
  - at: '2026-08-05'
    text: "2026-08-05 CONCLUSIVE \u2014 sample7.wpr closes the last loophole.\n\n\
      The human DELETED c and roo and let WinISD recompute them, with T=303.15 in\
      \ the file. Result:\nc=343.684120962153, roo=1.20095217714682 \u2014 the 20\
      \ C values, to all 15 digits.\n\nThe recompute demonstrably ran: the only other\
      \ difference from sample6 is last-digit float\nnoise, SPLmaxLF ...3015 -> ...3016\
      \ and Mpow ...408 -> ...407, which is recomputation round-off.\nValues that\
      \ were merely left untouched would be byte-identical.\n\nSo the lazy-recompute\
      \ explanation (BUG-005) is eliminated. WinISD's c and roo are CONSTANTS.\nT,\
      \ p and phi are stored, round-trip faithfully, and are never read. Whether the\
      \ Advanced tab\nbriefly displays something else is now irrelevant \u2014 the\
      \ stored value is what openisd must match,\nand it is fixed.\n\nEvidence chain,\
      \ all human-produced, C:\\tmp\\sample1..7.wpr:\n  sample1-4  T, p, phi each\
      \ round-trip independently in [Box]\n  sample5    full recompute via Fs at T=303.15;\
      \ c/roo unmoved; SPL follows the unchanged K\n  sample6    single-line diff\
      \ from baseline, T only; every other byte identical\n  sample7    c/roo deleted\
      \ and recomputed at T=303.15; they come back as the 20 C values"
  answer:
    at: '2026-08-05'
    text: "UI should have an option something like \"Ignore X as per WinISD\", default\
      \ OFF.\n\nSo openisd USES humidity and pressure by default \u2014 the physically\
      \ correct behaviour \u2014 and the\ntoggle opts INTO WinISD's behaviour of ignoring\
      \ them. openisd is correct out of the box; the\ncompatibility mode is the deliberate\
      \ choice, not the other way round.\n\nConsequences to build to:\n  - Params\
      \ gains humidityPct and pressurePa, wired through to c and roo, and thence to\
      \ K in\n    SPL = K + 10log10(eta0) where K = 10log10(roo*c/(2*pi*p_ref^2)).\n\
      \  - Every golden fixture moves unless the toggle is ON, so the fixtures must\
      \ state which mode\n    produced them.\n  - QO8's parity suite runs with the\
      \ toggle ON, so a green parity run still means what it says.\n    Comparing\
