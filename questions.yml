      ENGINE_HARDENING_TODO.md and REMEDIATION_PLAN.md into ENGINE_HARDENING_TODO_1.md and
      CODE_REVIEW_1.md, re-verifying every finding against the current code with quoted evidence
      per row. Stays open until that lands and the remaining live findings are known.
  - at: '2026-08-05'
    text: |-
      2026-08-05 engine hardening landed. QO4.1/.4/.5/.6 ticked. QO4.2 (Vb=0 clear error) and QO4.3
      (mid-sweep singularity gap + warn) are MET ENGINE-SIDE ONLY and deliberately left unticked:
      the error is produced, correct and named, but the default skin has nowhere to show it.

      Root cause, now reported independently by three agents: allIssues is consumed only by
      DriverPanel.vue, mounted only via ModernShell, while the default skin is 'original'
      (store.ts:92, skins.ts:27-31). And GraphPanel.vue:34 feeds .gmsg from driverErrors, NOT
      allIssues, and filters to error only — so no box-parameter or sweep issue can ever reach a
      chart. grep -ci "issue|warn" over OriginalShell.vue and ClassicShell.vue returns 0 for both.

      Also fixed in the same pass: the §11 defect was worse than briefed. deriveDriver({Qts:0.5,
      Qes:0.4, Qms:0.5}) returned errors:[] and a non-null driver at HEAD, and Qes:Infinity passed
      the guard because Infinity > 0 is true. Fixed at the divide in solveConsistencyGroup
      (driver.ts:62-64), not at the symptom. formulas.ts duplicate literals replaced with the
      imported C and RHO, verified bit-identical across 273.15-350 K. Goldens unchanged: 6 passed,
      fixtures dir clean. 387 unit tests pass, lint and typecheck clean.
  - at: '2026-08-06'
    text: Engine hardening (preconditions, postconditions, residual input guards, store issue channel,
