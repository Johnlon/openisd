- id: QO97
  title: 'wdr reader rule for dual-coil Re: trust the file''s VCCon, because simulation
    is unaffected either way'
  status: decided
  raised: '2026-08-28'
  body: ''
  notes:
  - at: '2026-08-28'
    text: "DECIDED, not blocked. John 2026-08-28: \"winisd is broken too so dont block\
      \ on this - do something\nsensible and record it as a QOxx.\"\n\nTHE PROBLEM.\
      \ A .wdr/.wpr carries ONE Re, which is always the TERMINAL value (what the amplifier\n\
      sees). OpenISD stores Re PER COIL and derives the terminal value (QO96). To\
      \ import, the reader\nmust divide by the wiring factor -- and the file's VCCon\
      \ cannot be trusted, because WinISD's own\ndropdown always writes VCCon=1 whatever\
      \ is selected (WINISD_PARITY.md section 12).\n\nTHE RULE: TRUST THE FILE'S STATED\
      \ VCCon.\n\n    import:    Re_per_coil = Re_file / factor(VCCon_file, numVC_file)\n\
      \    simulate:  Re_terminal = Re_per_coil * factor(VCCon, numVC)   ==  Re_file\n\
      \    export:    Re_file'    = Re_per_coil * factor(VCCon, numVC)   ==  Re_file\n\
      \n    factor(parallel, N) = 1/N      factor(series, N) = N      factor(anything,\
      \ 1) = 1\n\nWHY THIS IS SAFE EVEN WHEN VCCon IS A LIE. The SAME factor is applied\
      \ on the way in and on the way\nback out, so it cancels:\n\n  * every SIMULATED\
      \ number is exact regardless -- the terminal Re reaching the engine is the\n\
      \    file's own Re, byte for byte, whatever VCCon claims;\n  * the .wdr round-trip\
      \ is exact -- a file read and rewritten is unchanged;\n  * the ONLY thing a\
      \ mis-saved VCCon corrupts is the DISPLAYED per-coil figure, and only for a\n\
      \    multi-coil driver. Wrong label on a number nobody simulates from.\n\nAnd\
      \ for numVC = 1 -- which is every driver in the bundled corpus -- the factor\
      \ is 1 and there is\nno ambiguity to have.\n\nWHY NOT THE ALTERNATIVES:\n  -\
      \ \"Assume parallel when numVC > 1\": invents information the file does not\
      \ carry, and breaks the\n    round-trip for a correctly-saved series file, which\
      \ is worse than the case it fixes.\n  - \"Refuse to import multi-coil drivers\"\
      : punishes the user for WinISD's bug.\n  - \"Store terminal, not per-coil\"\
      : that is WinISD's design and QO96 rejected it -- it is what\n    makes the\
      \ value get silently rewritten.\n\nCONSEQUENCE TO SURFACE IN THE UI, not to\
      \ hide: when numVC > 1 the per-coil figure is only as good\nas the file's VCCon.\
      \ Worth a note in the field help, since the user may know the truth when the\n\
      file does not.\n\nIMPLEMENTATION NOTE / ownership: the adapter lives in packages/winisd\
      \ + packages/model, which the\ncoordination split with agent loose-end assigns\
      \ to it, while \".wdr/.wpr adapter\" was assigned to\nme. That overlap needs\
      \ settling before either of us edits there -- flagged, not resolved tonight,\n\
      and NOT a reason to delay the rule above."
  answer:
    at: '2026-09-04'
    text: 'Ruling fully recorded, no remaining decision. Already captured in docs/plans/PLAN_OPENISD_DRIVER_MODEL.md
      Phase 2''s dual-voice-coil bullet (tagged QO96/QO97): import trusts the file''s
      stated VCCon/numVC even though WinISD''s own dropdown always writes VCCon=1,
      because the same factor cancels on export -- every simulated value stays exact
      and the round-trip is byte-identical regardless.'
