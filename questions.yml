- id: QO4
  title: TODO — Engine hardening
  status: done
  raised: '2026-08-05'
  body: |
    **Priority: HIGH.** The engine can still emit `NaN`/`Infinity` on degenerate input
    mid-sweep, producing a blank/garbage chart with no explanation. This undermines the
    one thing the tool exists to do: produce trustworthy numbers.

    Design + rationale: `CODE_REVIEW/ENGINE_HARDENING.md`. Findings:
    `CODE_REVIEW/CODE_REVIEW.md` §11, §16-18, §20-21.

    **Failure is communicated with the `Result` pattern, never by throwing** — the
    engine's contract is `{ value, errors }` with `error`/`warn`
    levels. Both layers of the fix feed that one channel.
  items:
  - text: 'ACCEPTANCE: a driver with Vas+Qts but no Qms gives a clear message, not a blank graph'
    done: true
  - text: 'ACCEPTANCE: Vb = 0 gives a clear error, not Infinity-poisoned curves'
    done: false
  - text: 'ACCEPTANCE: an isolated mid-sweep singularity still draws the curve with a gap plus a warn
      naming the frequency; never silently blanked'
    done: false
  - text: 'ACCEPTANCE: no code path returns a non-finite value to a chart without a surfaced issue'
    done: true
  - text: 'ACCEPTANCE: all existing physics tests pass unchanged; math for valid inputs stays byte-identical
      to the goldens'
    done: true
  - text: 'ACCEPTANCE: new tests cover each rejection/partial case with a human-readable scenario name'
    done: true
  notes:
  - at: '2026-08-05'
    text: Migrated verbatim from openisd/CODE_REVIEW/ENGINE_HARDENING_TODO.md. May be a TASK rather than
      a decision — needs triage.
