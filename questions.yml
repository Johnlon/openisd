      Test: driver-editor-units.test.ts :: "the Dimensions tab shows lengths in millimetres, not raw
      metres under a wrong label".

      D7 Dd PRECISION — the stated cause was wrong; the remaining half is FIXED. Dd DOES have a
      registry entry (fieldRegistry.ts) and the call site already passed :scale="1000" with an "mm"
      label, so it rendered 109.98 mm, not 0.13 m — the "no registry entry, dp defaults to 2" reading
