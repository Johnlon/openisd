    \ them through \u2014 accidental correctness that\n  breaks for any solver-only\
    \ bag.\n- `sweep.ts:188-190` says a terminal \"cannot be STATED \u2014 it is derived\
    \ from the per-coil value\n  and the wiring\", so the engine knows the derivation\
    \ and merely lacks the wiring to do it.\n- `numVC` and `wiring` are NOT declared\
    \ fields on `SolverQuantities` \u2014 only comments claim they\n  are. `solver.ts:110-112`\
    \ (\"numVC and wiring ride along untouched \u2026 dropping them would make\n \
    \ re-solving a result lossy\") is FALSE: the type has no such members."
  answer:
    at: '2026-08-31'
    text: "John, 2026-08-31, after seeing api-design's 92->23 report: fix the DESIGN,\
      \ not the callers.\n\n    interface SolverValues { q: SolverQuantities; coils:\
      \ CoilFacts }\n    solveConsistencyGroup(v: SolverValues): SolverValues\n\n\
      `SolverQuantities` stays all-numeric so `setVal`'s `keyof` union still compiles\
      \ \u2014 that\nconstraint is what forced the split. With the coil facts inside,\
      \ the solver computes the\nterminals itself in a final pass AFTER the fixpoint\
      \ (must be after: `Re_ohm` is itself\nderivable), so its output is sweep-ready\
      \ by construction.\n\nReturn `SolverValues`, not bare `SolverQuantities`, or\
      \ re-solving drops the coil facts \u2014 the\nexact lossy re-solve `solver.ts:110`\
      \ claims to prevent.\n\nRepairing the 25 tests by making each take the second\
      \ step (done by api-design) confirmed the\ndiagnosis but spread the workaround\
      \ to every caller. The restructure removes the cause: no\ncaller needs a second\
      \ step again. Any test that still does means it is incomplete.\n\nAssigned to\
      \ session api-design. Sequence AFTER boxDesign/znom so the fixtures are not\n\
      rewritten twice."
- id: QO107
  title: "No written rule governs which DIRECTION a solver relation runs \u2014 WinISD\
    \ parity and mathematical necessity are being conflated"
  status: decided
  raised: '2026-08-31'
  body: "Some relations are bidirectional, some are one-way, and nothing states the\
    \ rule. Each relation\ndocuments its own direction, and the REASONS turn out to\
    \ be of different kinds:\n\n  1. MATHEMATICALLY FORCED. `Znom = 2\xB7round_half_even(0.75\xB7\
    Re)` (WINISD_SCHEMA.md \xA74.2) \u2014\n     rounding destroys information, so\
    \ `Re` genuinely cannot be recovered. Not a choice.\n  2. WINISD PARITY ONLY.\
    \ rel-24, `KLe = Le\xB7\u221A(2\u03C0\xB7fLe)` (\xA73.2, and now implemented in\n\
    \     solver.ts) \u2014 perfectly invertible as `Le = KLe/\u221A(2\u03C0\xB7fLe)`.\
    \ We do not derive `Le` because\n     WinISD does not. A copied choice, not a\
    \ fact about the maths.\n  3. BIDIRECTIONAL. `Sd`<->`Dd`, the Qts/Qes/Qms trio\
    \ all three ways, `Hc`<->`Hg`.\n\nSo the operative rule is \"implement the routes\
    \ WinISD implements\", and only category 1 is\nactually forced. That distinction\
    \ is written down nowhere, so every one-way relation gets\nre-litigated on contact\
    \ \u2014 this session included: the agent asserted rel-24's one-directionality\n\
    as necessary when it is a parity choice, and justified it on provenance grounds\
    \ (\"a derived Le\nwould claim knowledge no datasheet stated\") that prove far\
    \ too much, since the same argument\nwould forbid deriving `Fs` or `Cms`.\n\n\
    WHAT A RULING WOULD SETTLE: whether a mathematically-invertible relation that\
    \ WinISD runs one\nway may ever be run both ways by us; and whether each relation\
    \ should record WHICH of the three\ncategories its direction falls into, so the\
    \ reason is checkable rather than re-argued.\n\nCorpus note, measured 2026-08-31,\
    \ which bounds the practical stakes for rel-24 specifically:\n`Le` is stated in\
    \ 1745 records, `fLe` in 0, `KLe` in 0. rel-24 can only fire on an `fLe` typed\n\
    by hand in the editor; it never fires on corpus data as it stands."
  answer:
    at: '2026-09-12'
    text: "DECIDED (John, 2026-09-12): OpenISD will be better than WinISD \u2014 no\
      \ question. Bidirectional and multi-way inversions are authorized wherever mathematically\
      \ sound."
