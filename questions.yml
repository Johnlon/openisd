    \ undermines the\none thing the tool exists to do: produce trustworthy numbers.\n\
    \nDesign + rationale: `CODE_REVIEW/ENGINE_HARDENING.md`. Findings:\n`CODE_REVIEW/CODE_REVIEW.md`\
    \ \xA711, \xA716-18, \xA720-21.\n\n**Failure is communicated with the `Result`\
    \ pattern, never by throwing** \u2014 the\nengine's contract is `{ value, errors\
    \ }` with `error`/`warn`\nlevels. Both layers of the fix feed that one channel.\n"
