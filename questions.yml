      \ fail on divergence. Today parity is\nasserted by hand-checked spot values;\
      \ nothing mechanically proves openisd still matches.\n\nSPECIFIC SCENARIOS THAT\
      \ MUST BE IN THE SET.\n  - Humidity wiring. Vary RH with T and p fixed, read\
      \ WinISD's derived sound velocity and air\n    density off the Advanced pane,\
      \ and prove RH moves them. This is the scenario that settles\n    QO7 empirically\
      \ rather than by back-solve. Then run the same inputs through openisd and\n\
      \    confirm identical output.\n  - Temperature wiring. T = 293.15 -> 303.15\
      \ K, RH 30%, p 101325. Derived c should read\n    ~349.51 m/s and rho ~1.16133\
      \ if c is derived rather than fixed.\n  - Pressure wiring. Vary p alone; confirm\
      \ rho moves and c does not.\n  - Plus a spread of ordinary alignments across\
      \ box types (sealed, vented, bandpass, PR) so\n    the chart comparison is not\
      \ only environmental edge cases.\n\nFIXTURES ARE PARAMETERISED BY VALUES, NOT\
      \ BY A DRIVER. Encode each scenario as its Thiele-\nSmall figures, electrical\
      \ parameters and environment settings directly. Do NOT name a driver\nfrom the\
      \ database: driver records are regenerated by the scraper pipeline and their\
      \ values\nchange over time, so a fixture that says \"Dayton RS180-8\" silently\
      \ re-baselines itself. A\nfixture that says Fs=37.2, Qts=0.38, Vas=23.1, Re=6.4,\
      \ ... does not.\n\nEXTRACTION IS AUTOMATED, NOT MANUAL. Use the win32 harness\
      \ already built in winisd_research:\n  winisd_research/lib/control.py    UI\
      \ automation\n  winisd_research/lib/probes.py     reading values back out\n\
      \  winisd_research/lib/wdr.py        .wdr handling\n  winisd_research/overnight_runner.py,\
      \ runs/, screenshots/   the existing run scaffolding\n  winisd_research/vm/,\
      \ vm_guest_assets/winisd_bin           the Windows VM WinISD runs in\nThe open\
      \ technical problem: getting CURVES out as text rather than pixels. Reading\
      \ a chart\nfrom a screenshot is not acceptable as a golden. Establish whether\
      \ WinISD can export curve\ndata, or whether the harness must read the plotted\
      \ series out of the control, and write down\nwhat was found either way.\n\n\
      DELIVERABLES.\n  1. A scenario definition file a script can consume mechanically\
      \ \u2014 one entry per scenario,\n     all TS/electrical/environment values\
      \ explicit.\n  2. A generator that drives WinISD from that file and writes the\
      \ goldens as text.\n  3. The goldens themselves, committed as test fixtures.\n\
      \  4. A comparison test that runs openisd over the same scenario file and diffs\
      \ against the\n     goldens, with a stated numeric tolerance and the reason\
      \ for that tolerance.\n  5. A README beside the fixtures stating: exactly how\
      \ they were created, which WinISD build\n     and which harness commit produced\
      \ them, what every parameter means, and the exact command\n     to refresh them.\
      \ A golden nobody can regenerate becomes unfalsifiable the first time it\n \
      \    disagrees with reality.\n\nTHE EXTRACT IS ONE-OFF; THE REGENERATION MUST\
      \ NOT BE. The point of encoding the scenarios\nmechanically is that a refresh\
      \ is a command, not a repeat of the manual investigation."
