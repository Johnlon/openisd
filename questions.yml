        Gloss    = g / ((2*pi*Fs)^2 * Xmax),  g = 9.80665     41 samples, worst rel resid 3.6e-15
        SPLmaxLF = 20*log10( rho0*(2*pi*20)^2*Vd / (2*pi*sqrt2) / 20uPa )
