    text: "2026-08-05 REOPENED \u2014 the ruling as recorded is too broad, and the\
      \ evidence changed under it.\n\nWHAT IS NOW ESTABLISHED, by direct observation\
      \ in WinISD:\n  Xmax = Vd / Sd IS a real WinISD derivation, and {Vd, Sd, Xmax}\
      \ solves in ALL THREE\n  directions. Observed: Vd=140cm3, Sd=0.0095 -> Xmax\
