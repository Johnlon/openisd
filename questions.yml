      Fs/Vas/Qes", which resolves the bound cell against a real Driver rather than pinning a string —
      it passed on first run, which is the evidence.

      D3 fLe SCALE INVERTED — FIXED. NumInput renders display = SI x scale (NumInput.vue toDisp), and
      .wdr stores fLe in HERTZ (docs/design/WDR_SCHEMA.md, fLe row) while WinISD shows kHz
      (docs/winisd/edit_driver_pg2_parameters.png). :scale="1000" was therefore out by 1e6. Now
      :scale="1e-3" with :precision="precision('fLe')".
      Test: driver-editor-units.test.ts :: "fLe renders hertz as kilohertz" (1234 Hz -> 1.234 kHz)
      and the general rule "every dimensional field converts SI to the unit it is labelled with",
      which checks every field's scale against units.ts's own factors.

      D4 VCCon MAPPING — the SELECT was already right; the real defect was in the WRITER. The editor
      already offered 1=Parallel / 2=Series with a `?? 1` default, matching the file format on every
      count: Driver.fromWdr backfills VCCon='1' when a .wdr omits it
      (packages/winisd/src/driver.ts:301-302); openisdToWdr declares default 1
      (packages/winisd/src/native/openisdToWdr.ts:58); DriverDefineModal documents "1 = parallel,
      2 = series"; the sample file carries VCCon=1
      (docs/winisd/sample_drive_Dayton_Audio_Epique_E150HE-44.wdr:46); and WinISD's own Connection
      dropdown reads "Parallel" on a blank driver (docs/winisd/edit_driver_pg2_parameters.png).
      The 0=Parallel/1=Series mapping QO15 describes is not in the file or in its git history.
      BUT the fresh-authored .wdr exporter wrote `VCCon=' + (raw.VCCon || 2)` — SERIES — so a driver
      the editor showed as Parallel exported as Series. packages/winisd/src/classic/wdr.ts:32, live
      for the Original skin via Driver.toWdr's no-carried-WDR branch. Fixed to `|| 1`.
      Test: packages/winisd/test/classic/wdr.test.ts :: "defaults an unspecified voice-coil wiring to
      parallel (VCCon=1), matching WinISD", plus "carries an explicitly wired series connection
      through unchanged".

      D5 Voicecoils BLANK — FIXED in the derivation, which is where the missing default was.
