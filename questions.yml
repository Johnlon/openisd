- id: QO39
  title: 'Xmax route precedence settled by probe: row 19 abs(Hc-Hg)/2 WINS, Vd/Sd is the fallback - WDR_SCHEMA
    L268 is wrong, L310 is right'
  status: open
  raised: '2026-08-13'
  body: ''
  notes:
  - at: '2026-08-13'
    text: |-
      PROBED 2026-08-13 under wine (winisd.exe, wine 10.0, ~/.wine). Harness ran; 7 successful
      probes in winisd_research/runs/xmax_route.jsonl from toys/campaign_xmax_route.py.

      VERDICT: row 19 `abs(Hc-Hg)/2` WINS. Row 20 `Vd/Sd` is the fallback, used only when row 19
      cannot supply the value. WDR_SCHEMA.md line 310's tie-break table is RIGHT; line 268's
      "Row 20 takes precedence" is WRONG.

      THE DECIDING CASE, stated before it was run: enter Hc, Hg, Vd and Sd, leave Xmax blank.
        entered:    Hc=0.015  Hg=0.0034  Sd=0.022  Vd=0.000407     (Xmax marked N = unset)
        prediction if line 268 is right (Vd/Sd)        -> Xmax = 0.0185
        prediction if line 310 is right (|Hc-Hg|/2)    -> Xmax = 0.0058
        OBSERVED                                       -> Xmax = 0.0058, mark C
      The two routes are 3.19x apart, so the case cannot be settled by coincidence.

      FULL EVIDENCE TABLE (Xmax marked N on input in every row but the last):

        case               Hc      Hg      Sd     Vd        row19    row20    Xmax obs  mark  fired
        A_hchg_only        0.015   0.0034  0.022  -         0.0058   -        0.0058    C     row 19
        B_vdsd_only        -       -       0.022  0.000407  -        0.0185   0.0185    C     row 20
        C_all_four         0.015   0.0034  0.022  0.000407  0.0058   0.0185   0.0058    C     ROW 19
        E_all_four_b       0.011   0.001   0.035  0.00098   0.005    0.028    0.005     C     ROW 19
        F_all_four_swap    0.0034  0.015   0.022  0.000407  0.0058   0.0185   0.0058    C     ROW 19
        G_hchg_equal       0.012   0.012   0.022  0.000407  0        0.0185   0.0185    C     ROW 20
        D_all_four_xmax    0.015   0.0034  0.022  0.000407  0.0058   0.0185   0.0093    E     neither
                                                                        (entered Xmax=0.0093 pinned)

      C, E and F are three independent all-four samples at different magnitudes and with Hc/Hg
      swapped. All three give the geometry answer. A and B are the single-route controls.

      SECOND, INDEPENDENT WITNESS, agreeing in every row. Gloss = g/((2*pi*Fs)^2 * Xmax) was
      recovered to 3.6e-15 (SOLVER_GAPS.md 2.4), so inverting the saved Gloss recovers the Xmax the
      solver used INTERNALLY, not merely the number it wrote to the field. It returns the observed
      Xmax in all seven rows: 0.0058, 0.0185, 0.0058, 0.005, 0.0058, 0.0185, 0.0093.

      IS IT FIXED OR CONDITIONAL? Fixed in precedence, conditional in APPLICABILITY. There is
      exactly one exception, and it is not about which route ranks higher: when Hc == Hg, row 19's
      answer is 0 and row 20 supplies Xmax instead (G_hchg_equal: Hc=Hg=0.012, Xmax came out
      0.0185 = Vd/Sd, not 0). Row 19 is skipped when it would yield zero.

      Vd IS NOT CORRECTED TO MATCH. In C/E/F/G the entered Vd keeps its typed value and its E mark
      while Xmax is filled from geometry. E_all_four_b saves Vd=0.00098 beside Sd*Xmax=0.000175, a
      5.6x contradiction, with no warning and no mark change. That is WDR_SCHEMA 4.1's
      "contradiction is invisible", observed directly rather than inferred.

      WHAT openisd MUST DO -- packages/engine/src/driver.ts:

      1. THE BRANCH ORDER IS ALREADY CORRECT. `abs(Hc-Hg)/2` is at :151 and `Vd/Sd` at :160, both
         guarded by `r.Xmax == null`, so the first match wins and row 19 already takes precedence.
         NO REORDER IS NEEDED. (The task that raised this expected a reorder; the evidence says the
         existing order is the right one.)

      2. ONE REAL DIVERGENCE, at :151. When Hc == Hg the branch fires and sets Xmax = 0; :160 then
         sees Xmax non-null and never runs, so openisd yields 0 where WinISD yields Vd/Sd. Guard it:
             if (r.Xmax == null && r.Hc != null && r.Hg != null && r.Hc !== r.Hg)
         The same guard is correct whichever mechanism WinISD uses internally (row 19 declining to
         fire vs. row 19 producing a zero that is treated as unset), so it does not wait on that.

      DOC FIX -- docs/design/WDR_SCHEMA.md, verified line numbers today:

        L268 is WRONG. Currently:
