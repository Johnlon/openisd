- id: QO112
  title: "z.ZodType<T> catches a LOOSER schema but not a STRICTER one \u2014 the annotation\
    \ is a one-way check"
  status: decided
  raised: '2026-09-01'
  body: "VERIFIED 2026-09-01 by breaking the schema in packages/design/domain/project.ts\
    \ five ways and\nrunning `npx tsc -p packages/design --noEmit` after each:\n\n\
    \  change to the schema only                              tsc\n  brand: z.number()\
    \            (wrong value type)        CAUGHT  (TS2322)\n  model: textField.optional()\
    \  (required -> optional)    CAUGHT\n  invented_key: z.string()     (key not in\
    \ the type)     NOT caught\n  series: textField            (optional -> required)\
    \    NOT caught\n  z.literal('x') for z.string()(narrowed value)          NOT\
    \ caught\n\nMECHANISM: `const schema: z.ZodType<OpenISDDeviceJson>` asserts the\
    \ schema's OUTPUT TYPE is\nASSIGNABLE TO the interface. A stricter output is still\
    \ assignable, so it type-checks while\nrejecting data the interface says is valid.\
    \ Case \"optional -> required\" is the damaging one: a\nschema requiring `series`\
    \ would refuse 1804 of the 2064 driver.yml on disk, silently, with the\ncompiler\
    \ content.\n\nTHIS CONTRADICTS WHAT THIS AGENT TOLD JOHN EARLIER and what the\
    \ comment above the schema still\nsays \u2014 \"a schema that stops matching the\
    \ interface fails to compile, so neither can drift from\nthe other unnoticed\"\
    . True only of a LOOSER schema.\n\nTWO FIXES, neither taken (packages/design \u2014\
    \ approval required):\n  1. A compile-time EXACTNESS assertion beside the schema,\
    \ replacing the one-way annotation:\n       type Exact<A, B> = [A] extends [B]\
    \ ? ([B] extends [A] ? true : false) : false;\n       const _schemaMatchesType:\
    \ Exact<z.infer<typeof openISDDeviceSchema>, OpenISDDeviceJson> = true;\n    \
    \ Mutual assignability, so both directions bite. NOTE: the interface's `readonly`\
    \ modifiers\n     and z.infer's mutable output may make this fail as written \u2014\
    \ it needs a readonly-stripping\n     helper, which is real work, not a one-liner.\n\
    \  2. An arch test in the repo's own style: read the SCHEMA's keys and optionality\
    \ (the way\n     architecture-record-matches-openisd-yml.test.ts already reads\
    \ the INTERFACE's) and hold\n     both against the same pydantic-derived ALWAYS/SOMETIMES\
    \ lists. Catches drift on either\n     side without fighting TS variance, and\
    \ keeps the pydantic model as the single authority.\n\nThe comment above the schema\
    \ overstates the guarantee and should be corrected whichever fix is\ntaken."
  answer:
    at: '2026-09-04'
    text: "RECONFIRMED 2026-09-04 \u2014 DISSOLVED by a structural change, not by\
      \ a ruling.\n\nThe one-way annotation this question is about no longer exists.\
      \ The schema moved out of\npackages/design/domain/project.ts into packages/design/domain/openisdRecordSchema.ts,\
      \ and the\nDIRECTION INVERTED:\n\n  was:  const schema: z.ZodType<OpenISDDeviceJson>\
      \ = ...   (schema asserted assignable TO the type)\n  now:  export const openISDDeviceJsonSchema\
      \ = z.strictObject({...});   (line 147)\n        export type OpenISDDeviceJson\
      \ = z.infer<typeof openISDDeviceJsonSchema>;   (line 218)\n\nThe type is now\
      \ DERIVED FROM the schema. There is no second declaration for the schema to\
      \ drift\nfrom, so the failure mode described here \u2014 a STRICTER schema type-checking\
      \ while refusing valid\ndata \u2014 has no way to occur: the type simply is\
      \ whatever the schema accepts.\n\n`z.ZodType` survives in the file only as `z.ZodTypeAny`\
      \ generic bounds on three field-builder\nhelpers (lines 83, 93, 103), which\
      \ is unrelated.\n\nNeither proposed fix is needed. The misleading comment this\
