- id: QO116
  title: "OpenISDBoxJson and OpenISDProjectJson have no zod schema \u2014 only OpenISDDeviceJson\
    \ is runtime-validated"
  status: decided
  raised: '2026-09-05'
  body: ''
  notes:
  - at: '2026-09-05'
    text: "Every JSON-shaped object crossing a boundary in this app is meant to have\
      \ a zod schema \u2014\nconfirmed only `openISDDeviceJsonSchema` exists (packages/design/domain/openisdRecordSchema.ts:145),\n\
      covering `OpenISDDeviceJson`. `OpenISDBoxJson` (packages/design/domain/project.ts:~369)\
      \ and\n`OpenISDProjectJson` (~:411) have NO zod schema anywhere in the repo\
      \ \u2014 both are validated only\nby TypeScript's structural typing at compile\
      \ time, never checked at runtime. Confirmed by\ngrepping the whole packages/design\
      \ tree for `z.object`/`z.strictObject`/`Schema =` referencing\neither type:\
      \ no hits outside openisdRecordSchema.ts's device schema.\n\nFound while scoping\
      \ a split of domain/project.ts (2750+ lines) into driver/passiveRadiator/box/\n\
      project/projectRepo files \u2014 the split was blocked by OpenISDDeviceJson's\
      \ deliberate\nnon-export (project.ts's own header, lines ~56-77: \"nothing outside\
      \ this module can name them\nat all... that is what forces colocation\"), which\
      \ raised the question of whether the OTHER two\nprivate record types (Box/Project)\
      \ have the same runtime-validation story as the Device type\ndoes. They don't\
      \ \u2014 only Device is schema-backed; Box and Project are not.\n\nRuling needed:\
      \ should OpenISDBoxJson and OpenISDProjectJson get zod schemas (parity with\n\
      OpenISDDeviceJson), and if so where do those schemas live given the same colocation/privacy\n\
      constraint that blocks the file split?"
  - at: '2026-09-06'
    text: "Re-confirmed 2026-09-06: still true. OpenISDBoxJson (openisdRecordSchema.ts:304),\
      \ OpenISDEnvironmentJson (:342), OpenISDProjectJson (:410) are plain `export\
      \ interface` \u2014 no zod schema. Only openISDDeviceJsonSchema (:531) exists;\
      \ grep for BoxJson/ProjectJson/EnvironmentJson schema across domain/ and src/\
      \ returns nothing. NOTE: the question's colocation/privacy premise is stale\
      \ \u2014 all four record types now live in openisdRecordSchema.ts and are exported,\
      \ so a Box/Project schema has no privacy obstacle; it would sit next to openISDDeviceJsonSchema\
