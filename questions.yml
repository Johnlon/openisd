  body: |
    The engine-hardening changes themselves; QO4 carries the acceptance criteria and the
    `Result`-pattern contract. Each item states its own group: additive input guards (no
    formula change), the finiteness postcondition (the main remaining piece), the one
    sign-off-gated change to computed numbers, and maintainability (no behaviour change).
  items:
  - text: 'Additive input guard (no formula change) — §11 `Qms == Qts`: in `deriveDriver`, when both `Qts`
      and `Qms` are given, require `Qms > Qts` (else `error`); otherwise `Qes = Qts·Qms/(Qms−Qts)` → ∞.'
    done: false
  - text: 'Additive input guard (no formula change) — §18 params: add a param precondition: `Vb > 0`,
      plus `Vf > 0` (bandpass), `Sp > 0` (vented), PR params present (`pr`). Return an `error` when unmet.'
    done: false
  - text: 'Finiteness postcondition (the main remaining piece) — after `sweep`/`maxCurves`, classify the
      output at the **store boundary** (the single enforced engine→UI seam; keeps `sweep` plain): **Some**
      points non-finite → keep the arrays (canvas already gaps them) + a `warn` naming the affected frequency.
      **No** finite points → treat as unusable: `error`, no chart. Rule: null/error only when the primary
      series has zero finite points.'
    done: false
  - text: Finiteness postcondition (the main remaining piece) — feed both into the existing `.gmsg`/`.drv-issues`
      channel — no new UI plumbing, no `throw`, no interpolation across gaps.
    done: false
