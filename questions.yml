- id: QO7
  title: Humidity and pressure inputs are inert — extend the model, or mark them visibly dead?
  status: decided
  raised: '2026-08-05'
  body: ''
  notes:
  - at: '2026-08-05'
    text: |-
      Bug file: openisd/bugs/BUG_20260805_humidity-and-pressure-inputs-are-collected-persisted-and-then-ignored.md

      The Advanced pane collects temperature, humidity and pressure; the Options dialog persists all
      three; only tempK reaches the engine. advHumidity and advPressure land in local refs nothing
      reads (OriginalShell.vue:560-561). Params carries tempK alone (types.ts:183). The user gets no
      signal the value was discarded.

      This matters more than a dangling input because humidity is exactly what makes WinISD's
      constants what they are: c=343.684120962152 and roo=1.20095217714682 reproduce from
      T=293.15K, RH=30%, p=101325Pa to within 3-5 ppm on both. openisd hardcodes the RESULT of a 30%
      RH assumption while offering a humidity box that cannot change it.

      Two options, and the choice is yours:
        1. Extend the model — add humidityPct and pressurePa to Params, derive c and roo from all
           three via the moist-air formulation, surface air density beside sound velocity. This moves
           EVERY golden fixture, so it cannot be done silently.
        2. Mark both inputs visibly inert — the shell already has that pattern. No number changes.

      winisd_research/GAPS.md A6 recommends either, and warns explicitly: do NOT re-open the
      constants themselves, they already match WinISD exactly.
  - at: '2026-08-05'
    text: |-
      2026-08-05 SETTLED BY EXPERIMENT — WinISD persists T, p and phi and does NOT apply them.
      openisd's inert humidity/pressure inputs mirror WinISD's behaviour exactly.

      CORRECTION FIRST: the earlier research claim that ".wpr does not persist T, RH or p at all"
      is WRONG, and I repeated it. That agent inspected [SimulatorOptions] (VCInd, FlatResponse,
      TLPorts) and concluded absence. The environment is in the [Box] section:

          T=293.15      temperature, kelvin
          p=101325      air pressure, Pa
          phi=0.3       relative humidity as a FRACTION (0.3 = 30%), not a percentage

      Also in [Box]: d, Med, Nd, Angle, Isobarik. Human-produced probes sample1-sample4 confirm all
      three round-trip independently.

      THE EXPERIMENT (human-produced, C:\tmp\sample1..6.wpr, 2026-08-05):

      sample5 — T=303.15 AND Fs changed 100->200. The Fs edit forced a full recompute: Mms, Rms, Re,
      no, EBP, SPL, SPLmax, USPL, gamma, Rme, Mpow, Gloss all moved. c and roo did NOT. Stored SPL
      reproduces to 5e-13 from K(c=343.684120962153, roo=1.20095217714682); had c/roo followed
      T=303.15 (349.51 / 1.16133) the SPL would have been 113.7387 instead of the stored 113.8114.

      sample6 — Fs restored to 100, Le touched to trigger recompute, T=303.15. Diff against the
      sample1 baseline is EXACTLY ONE LINE: T=293.15 -> T=303.15. Every other byte identical.

      So a 10 C change with a demonstrated recompute produces no change in any stored value.

      CONSEQUENCE FOR THE RULING. The human ruled "extend the model" on 2026-08-05, before this was
      known. That ruling now means something different: extending is a deliberate IMPROVEMENT OVER
      WinISD, not parity with it. It runs against the workspace rule "Where WinISD deviates from
      textbook acoustics, the .wdr must match WINISD — it is the consumer", and QO8's side-by-side
      suite would report the difference as a permanent divergence (~0.07 dB at 30 C).

      Three options put to the human: extend anyway and exempt it in the parity suite; match WinISD
      by marking the inputs visibly inert; or extend behind an opt-in that defaults to WinISD-faithful.

      REMAINING UNCERTAINTY, stated honestly: one WinISD version, one driver. The Advanced tab's own
      Sound velocity / Air density readouts were not observed after a T change — it is conceivable
      they refresh on the tab while the saved values do not. That would not change the conclusion for
      stored data, which is what openisd must match.
  - at: '2026-08-05'
    text: |-
      2026-08-05 CONCLUSIVE — sample7.wpr closes the last loophole.

      The human DELETED c and roo and let WinISD recompute them, with T=303.15 in the file. Result:
      c=343.684120962153, roo=1.20095217714682 — the 20 C values, to all 15 digits.

      The recompute demonstrably ran: the only other difference from sample6 is last-digit float
      noise, SPLmaxLF ...3015 -> ...3016 and Mpow ...408 -> ...407, which is recomputation round-off.
      Values that were merely left untouched would be byte-identical.

      So the lazy-recompute explanation (BUG-005) is eliminated. WinISD's c and roo are CONSTANTS.
      T, p and phi are stored, round-trip faithfully, and are never read. Whether the Advanced tab
      briefly displays something else is now irrelevant — the stored value is what openisd must match,
      and it is fixed.

      Evidence chain, all human-produced, C:\tmp\sample1..7.wpr:
        sample1-4  T, p, phi each round-trip independently in [Box]
        sample5    full recompute via Fs at T=303.15; c/roo unmoved; SPL follows the unchanged K
        sample6    single-line diff from baseline, T only; every other byte identical
        sample7    c/roo deleted and recomputed at T=303.15; they come back as the 20 C values
  answer:
    at: '2026-08-05'
    text: |-
      UI should have an option something like "Ignore X as per WinISD", default OFF.

      So openisd USES humidity and pressure by default — the physically correct behaviour — and the
      toggle opts INTO WinISD's behaviour of ignoring them. openisd is correct out of the box; the
      compatibility mode is the deliberate choice, not the other way round.

      Consequences to build to:
        - Params gains humidityPct and pressurePa, wired through to c and roo, and thence to K in
          SPL = K + 10log10(eta0) where K = 10log10(roo*c/(2*pi*p_ref^2)).
        - Every golden fixture moves unless the toggle is ON, so the fixtures must state which mode
          produced them.
        - QO8's parity suite runs with the toggle ON, so a green parity run still means what it says.
          Comparing WinISD against openisd-with-real-air-properties would report a permanent ~0.07 dB
          divergence at 30 C and teach everyone to ignore the suite.
        - The option is per project, since T/p/phi are per project in the .wpr [Box] section.
        - Note the unit mismatch: WinISD stores phi as a FRACTION (0.3), openisd's humidityPct is a
          percentage. One conversion boundary, at the .wpr reader/writer.
        - Wording: "X" should name what is ignored, e.g. "Ignore humidity and air pressure (as WinISD
          does)". The tooltip should say what it costs: SPL differs by about 0.07 dB at 30 C.
- id: QO8
  title: Side-by-side WinISD vs openisd validation suite, with mechanically regenerable golden fixtures
  status: decided
  raised: '2026-08-05'
  body: ''
  notes:
  - at: '2026-08-05'
    text: |-
      GOAL. A repeatable side-by-side validation of openisd against WinISD itself: same inputs into
      both, compare the CHARTS and the FIELD CALCULATIONS, and fail on divergence. Today parity is
      asserted by hand-checked spot values; nothing mechanically proves openisd still matches.

      SPECIFIC SCENARIOS THAT MUST BE IN THE SET.
        - Humidity wiring. Vary RH with T and p fixed, read WinISD's derived sound velocity and air
          density off the Advanced pane, and prove RH moves them. This is the scenario that settles
          QO7 empirically rather than by back-solve. Then run the same inputs through openisd and
          confirm identical output.
        - Temperature wiring. T = 293.15 -> 303.15 K, RH 30%, p 101325. Derived c should read
          ~349.51 m/s and rho ~1.16133 if c is derived rather than fixed.
        - Pressure wiring. Vary p alone; confirm rho moves and c does not.
        - Plus a spread of ordinary alignments across box types (sealed, vented, bandpass, PR) so
          the chart comparison is not only environmental edge cases.

      FIXTURES ARE PARAMETERISED BY VALUES, NOT BY A DRIVER. Encode each scenario as its Thiele-
      Small figures, electrical parameters and environment settings directly. Do NOT name a driver
      from the database: driver records are regenerated by the scraper pipeline and their values
      change over time, so a fixture that says "Dayton RS180-8" silently re-baselines itself. A
      fixture that says Fs=37.2, Qts=0.38, Vas=23.1, Re=6.4, ... does not.

      EXTRACTION IS AUTOMATED, NOT MANUAL. Use the win32 harness already built in winisd_research:
        winisd_research/lib/control.py    UI automation
        winisd_research/lib/probes.py     reading values back out
        winisd_research/lib/wdr.py        .wdr handling
        winisd_research/overnight_runner.py, runs/, screenshots/   the existing run scaffolding
        winisd_research/vm/, vm_guest_assets/winisd_bin           the Windows VM WinISD runs in
      The open technical problem: getting CURVES out as text rather than pixels. Reading a chart
      from a screenshot is not acceptable as a golden. Establish whether WinISD can export curve
      data, or whether the harness must read the plotted series out of the control, and write down
      what was found either way.

      DELIVERABLES.
        1. A scenario definition file a script can consume mechanically — one entry per scenario,
           all TS/electrical/environment values explicit.
        2. A generator that drives WinISD from that file and writes the goldens as text.
        3. The goldens themselves, committed as test fixtures.
        4. A comparison test that runs openisd over the same scenario file and diffs against the
           goldens, with a stated numeric tolerance and the reason for that tolerance.
        5. A README beside the fixtures stating: exactly how they were created, which WinISD build
           and which harness commit produced them, what every parameter means, and the exact command
           to refresh them. A golden nobody can regenerate becomes unfalsifiable the first time it
           disagrees with reality.

