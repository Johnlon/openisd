  status: decided
  raised: '2026-08-05'
  body: ''
  notes:
  - at: '2026-08-05'
    text: |-
      MEASURED live on the 4000 build (index-BkA9hrBU.js), 2026-08-05: opened Edit Project's Driver
      -> Parameters, cleared Qes, Qms AND Qts, blurred.

        OK disabled? FALSE — the button stayed live, the click was accepted, the dialog closed,
        and the app then reported: "At least two Q parameters (Qts, Qes, Qms) are required — enter
        any two to derive the third".

      So the editor commits a driver the engine refuses to simulate, and the human finds out only
      after the dialog has gone.

      CAUSE, one line: DriverEditorModal.vue isIdentityIncomplete (:102-108) checks brand, model,
      Fs, Vas, Re, Sd — and nothing else. The Q requirement is a COUNT ("at least two of three"),
      not a per-field presence test, so it fell out of a gate written as a list of single fields.
      The same omission is why no Q field carries the `required` hint or the mandatory red border:
      both are driven by isFieldEmpty(<one field>), which cannot express "two of these three".

      THE FIX (no decision needed — the engine already owns the rule at
      packages/engine/src/driver.ts:134-145):
        1. isIdentityIncomplete gains the count: fewer than two finite positive Q values blocks OK.
        2. The Q trio gets a GROUP-level marker rather than three per-field ones — the trio is
           required, no individual member is. Driver.cell() already surfaces the group error on all
           three (ERROR_ALIASES Qts -> Qms/Qes, packages/winisd/src/driver.ts:57-60), so the
           editor can read cell(k).error instead of inventing a second rule.
        3. Same for the consistency constraints the engine enforces and the editor ignores:
           Qms > Qts and Qes > Qts.
  answer:
    at: '2026-08-05'
    text: |-
      RULED by the human 2026-08-05, verbatim, in two steps:

        "ok button on driver editor not working / I need the save button to work even when the
         driver is incomplete"

        "all the buttons on driver editor need to work regardless of driver - only brand and model
         are 100% required as they are the index key. so gate the save or copy to my drivers or ok
