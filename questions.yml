- id: QO49
  title: 'Gloss import provenance: a ParState-less .wdr imports a carried Gloss=0
    as ENTERED, blocking derivation'
  status: decided
  raised: '2026-08-16'
  body: ''
  notes:
  - at: '2026-08-16'
    text: "MEASURED 2026-08-16 against the tree as it stands, NOT quoted from the\
      \ QO24 note (which\npredates the WinISDDriver rewrite and does not reproduce).\n\
      \nTHE MECHANISM, current code:\n  packages/winisd/src/winisdDriver.ts:428-435\
      \  fromWdr() takes each key's E/C/N mark from the\n    file's own ParState.\
      \ A file with NO ParState line gets `presence => E` (line 431-433).\n  packages/winisd/src/winisdDriver.ts:472-478\
      \  toOpenISDRecord() keeps ONLY `E` cells; a `C`\n    cell is dropped and re-derived\
      \ by OpenISDDriver.\n  So for any file that HAS a ParState, a WinISD-calculated\
      \ Gloss is already dropped and\n  re-derived. The exposure is ParState-less\
      \ files only.\n  The QO24 note's second half -- \"fromWdr additionally backfills\
      \ Gloss=0 for any file lacking\n  the key\" -- is NOT true of this code: line\
      \ 428-429 skips an absent key.\n\nTHE CORPUS, all 1626 .wdr under drivers/:\n\
      \  no ParState line ........................ 1102\n  carries a Gloss= key ....................\
      \ 1378\n  Gloss == 0 .............................. 224\n  Gloss == 0 AND Fs\
      \ > 0 AND Xmax > 0 ...... 5      <- the only files where a 0 blocks a\n    \
      \                                                 derivable value\n  ParState\
      \ slot 37 == 'E' ................. 4      (WinISD really does mark Gloss entered)\n\
      \  Of the 224 zeros, 216 have Xmax <= 0 and 70 have Fs <= 0, so Gloss = g/((2*pi*Fs)^2*Xmax)\n\
      \  is not evaluable for them at all -- a 0 there blocks nothing.\n\nTHE 5, and\
      \ what each already does:\n  drivers/sample/winisd/inconsistency-test.wdr  \
      \         slot 37 = C  -> already dropped\n  drivers/sample/winisd/inconsistency-test-saved.wdr\
      \     slot 37 = C  -> already dropped\n  drivers/sample/winisd/inconsistency-test-qts-C.wdr\
      \     slot 37 = C  -> already dropped\n  drivers/sample/winisd/inconsistency-test-qts-N.wdr\
      \     slot 37 = C  -> already dropped\n  drivers/winisd/TangBand W4-639SA.wdr\
      \                   NO ParState -> imported as ENTERED 0\n\nSo the live defect\
      \ is ONE library file, not 245. The 245-of-1622 figure in QO24's note does\n\
      not reproduce against this tree.\n\nTHE DECISION (unchanged in kind, much smaller\
      \ in blast radius):\n  For a ParState-less .wdr, is a carried `Gloss=0` an ENTERED\
      \ fact or an absent value?\n  (a) Leave presence => E as it is. One library\
      \ driver shows Gloss 0. Nothing else moves.\n  (b) Treat a carried 0 as absent\
      \ for Gloss specifically when there is no ParState, so the\n      solver fills\
      \ it. Changes provenance on that one file today, and on any future\n      ParState-less\
      \ file that carries Gloss=0 with a usable Fs/Xmax.\n  (c) Generalise (b) to\
      \ every solvable field, not just Gloss -- a much wider rule about what\n   \
      \   \"presence => E\" should mean for scraper-authored files with no ParState."
  answer:
    at: '2026-08-21'
    text: "HUMAN RULING, verbatim: \"drivers/winisd/TangBand W4-639SA.wdr -> drivers/winisd\
      \ is someone elses\nrealsl data - if it doesn contain ParStat then we have to\
      \ live with that and do something sensible\nlike assume everything is 'E'\"\n\
      \nDECIDED: leave the behaviour as it is. A .wdr with no ParState is read as\
      \ presence => ENTERED,\nuniformly, including a carried Gloss=0. No Gloss special\
      \ case, and no generalised\n\"a zero means absent\" rule.\n\nTHE REASONING,\
      \ which is stronger than the defect count: drivers/winisd/ is a THIRD-PARTY\
      \ export \u2014\nsomeone else's real data, not something OpenISD produced or\
      \ controls. A file that carries no\nParState has told us nothing about which\
      \ of its values were entered and which were computed, so\nthere is no evidence\
      \ to act on. Treating its 0 as \"probably not meant\" would be OpenISD inventing\n\
      provenance the source never stated, which is the same class of fabrication as\
      \ inventing a value.\nUniform \"presence => E\" is the sensible reading of a\
      \ file that omits the marks.\n\nCONSEQUENCE, accepted: drivers/winisd/TangBand\
      \ W4-639SA.wdr displays Gloss = 0 where the engine\nwould otherwise derive 0.0196\
      \ from Fs=65 and Xmax=0.003 (Gloss = g / ((2\u03C0 x Fs)^2 x Xmax)). One\nlibrary\
      \ driver, one field.\n\nSCOPE MEASURED 2026-08-21, so the decision is on real\
      \ numbers: 1626 .wdr files, 1102 with no\nParState, 1378 carrying Gloss, 224\
      \ with Gloss==0, and only 5 where Gloss==0 with Fs>0 and Xmax>0.\nFour of those\
      \ five are drivers/sample/winisd/inconsistency-test*.wdr, which DO carry a ParState\n\
      marking slot 37 as C and are therefore already dropped on import. The live case\
      \ is one file.\n\nThe mechanism is unchanged and correct as it stands: WinISDDriver.fromWdrIni\
      \ defaults a cell's\nstate to 'E' when there is no usable ParState, and OpenISDDriver.fromWinISDDriver\
      \ keeps only\nE-marked cells."
