- id: QO132
  title: How should the notify gate follow a write through a lens? (architecture-notify.test.ts,
    4 false positives) -
  status: decided
  raised: '2026-09-09'
  body: ''
  answer:
    at: '2026-09-09'
    text: "Resolved in code without needing a ruling \u2014 option (a), the lens edge,\
      \ plus a narrower\ndefinition of \"mutator\".\n\n`lensGetters` is read off the\
      \ AST (every getter whose body calls `this.#slot(...)`), so\n`this.driver.update(...)`\
      \ counts as reaching #notify() via #slot's setter. And a void method\nwith an\
      \ EMPTY body is no longer classified as a mutator: it writes nothing, so there\
      \ is no\nstate change for a notification to accompany.\n\nGate green, both new\
      \ arms broken on purpose and watched go red."
