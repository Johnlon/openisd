- id: QO41
  title: No documented schema for openisd.yml exists anywhere - only two hand-mirrored code copies
  status: decided
  raised: '2026-08-14'
  body: ''
  answer:
    at: '2026-08-14'
    text: |-
      OpenISD OWNS openisd.yml, not winisd_tools. The Python model for openisd.yml in winisd_tools
      (model_driver.py / model_openisd.py) is being DELETED, not schema-exported-from. Anything
      useful in it gets ported into OpenISD's own model docs/types. winisd_tools' only remaining
      interest in openisd.yml is that its pipeline can produce one, by calling a JS method OpenISD
      provides — passing it a driver.yml (which winisd_tools owns) and getting an openisd.yml back.
      winisd_tools does not care what the file looks like internally. This matches
      ARCHITECTURE.md's already-correct "openisd.yml is read and written exclusively by JS/TS owned
      by OpenISD" section (in-process embedded-V8 call, string in/string out, never throws) — that
      part of the doc was already right. What was WRONG was packages/model/src/openisdRecord.ts's
      header comment, which framed the TS record shape as "hand-transcribed against the real
      pydantic models" with Python treated as the source of truth being mirrored, and cited a
      now-deleted "ARCHITECTURE.md AD-8" anchor (AD-numbering was removed in the spec overhaul).
      Corrected in this pass: openisdRecord.ts's header now states OpenISD owns this shape
      outright; the current field-for-field match to the Python pipeline's shape is because the
      driver.yml -> openisd.yml projection logic has not yet been ported out of Python into
      OpenISD, not because Python is authoritative.
