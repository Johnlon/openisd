      \ kHz \u2014 out by 1e6. To show Hz as kHz the scale is 1e-3.\n\n4. VCCon MAPPING\
      \ CONTRADICTS THE FILE FORMAT. The select offers 0=Parallel / 1=Series\n   (template\
      \ line 424), but the WDR/WinISD convention this repo documents elsewhere is\n\
