- id: QO18
  title: Editor's OK gate omits the Q-pair check, so a driver the engine cannot simulate
    can be committed
  status: decided
  raised: '2026-08-05'
  body: ''
  notes:
  - at: '2026-08-05'
    text: "MEASURED live on the 4000 build (index-BkA9hrBU.js), 2026-08-05: opened\
      \ Edit Project's Driver\n-> Parameters, cleared Qes, Qms AND Qts, blurred.\n\
      \n  OK disabled? FALSE \u2014 the button stayed live, the click was accepted,\
      \ the dialog closed,\n  and the app then reported: \"At least two Q parameters\
      \ (Qts, Qes, Qms) are required \u2014 enter\n  any two to derive the third\"\
      .\n\nSo the editor commits a driver the engine refuses to simulate, and the\
      \ human finds out only\nafter the dialog has gone.\n\nCAUSE, one line: DriverEditorModal.vue\
      \ isIdentityIncomplete (:102-108) checks brand, model,\nFs, Vas, Re, Sd \u2014\
      \ and nothing else. The Q requirement is a COUNT (\"at least two of three\"\
      ),\nnot a per-field presence test, so it fell out of a gate written as a list\
      \ of single fields.\nThe same omission is why no Q field carries the `required`\
      \ hint or the mandatory red border:\nboth are driven by isFieldEmpty(<one field>),\
      \ which cannot express \"two of these three\".\n\nTHE FIX (no decision needed\
      \ \u2014 the engine already owns the rule at\npackages/engine/src/driver.ts:134-145):\n\
      \  1. isIdentityIncomplete gains the count: fewer than two finite positive Q\
      \ values blocks OK.\n  2. The Q trio gets a GROUP-level marker rather than three\
      \ per-field ones \u2014 the trio is\n     required, no individual member is.\
