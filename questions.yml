      \ A\n   driver carrying VCCon=2 matches no option and renders blank.\n\n5. Voicecoils\
      \ shows blank where fromWdr defaults it to 1 \u2014 the editor reads cellVal('numVC')\n\
      \   and nothing derives it, so an unspecified DVC count reads as \"no answer\"\
      \ not \"1\".\n\n6. DIMENSIONS TAB UNITS. Depth/MagnetDepth/Magnet/Basket/Outer/VCd\
      \ are labelled `m` with\n   scale 1 (a 6.5\" driver's basket reads 0.165), while\
      \ the Parameters tab shows Xmax/Hc/Hg in\n   mm \u2014 and `Thick` is labelled\
