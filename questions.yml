    real WinISD output -
  status: decided
  raised: '2026-09-05'
  body: ''
  answer:
    at: '2026-09-05'
    text: "John's final ruling: the value's magnitude is ground truth, not the mark.\
      \ N means ONLY \"the\nnumeric default 0, because nothing is stated.\" A nonzero\
      \ value present in the file is real data\n\u2014 either E or C \u2014 regardless\
      \ of what ParState says; it is illogical to distrust or drop a\nnonzero value\
      \ just because its mark says N. N vs non-N exists solely to distinguish a numeric\n\
      default from a defined E or C zero.\n\nThis means openisdRecordSchema.ts:654-660's\
      \ existing \"N + nonzero -> entered\" promotion was\ncorrect all along for ordinary\
      \ numeric fields (Qts included) \u2014 my bug record\n(BUG_20260905_n_marked_wdr_field_with_leftover_value_imports_as_entered.md)\
      \ misdiagnosed this as\na defect; it is the documented, correct behavior (WDR_LOGIC.md:36-38\
      \ already states it). Closing\nas NOT A BUG.\n\nwdr-openisd-round-trip.test.ts's\
      \ remaining \"N -> E\" failures on inconsistency-test-qts-N.wdr and\ns-dia-roundtrip-123.wdr\
      \ are not production defects \u2014 both source files are confirmed non-golden\n\
      (hand-fabricated experiment / hand-inserted value, now marked as such in their\
      \ own Comment=\nfields). The test's blanket \"N -> E is never legitimate\" rule\
      \ needs its own exception for this\nclass of field (any nonzero N reads as data),\
      \ matching the Sd exception already added, or these\ntwo fixtures need excluding\
      \ from that specific check since they were never real oracle evidence."
