- id: QO100
  title: "DOM element casts in .vue files \u2014 'as HTMLInputElement' and friends\
    \ still bypass the type system"
  status: decided
  raised: '2026-08-30'
  body: ''
  notes:
  - at: '2026-08-30'
    text: "John, 2026-08-30: \"Vue files must be scanned if they contain js or ts\"\
      \ and\n\"as HTMLInputElement gets a pass for now - add a qo** to followup\"\
      .\n\nWHAT IS PASSED, AND WHY IT IS STILL A CAST\n\n`architecture-no-casts.test.ts`\
      \ now scans `<script>` blocks in `.vue` files, and fails on every\ncast there\
      \ EXCEPT assertions to a DOM element type \u2014 `e.target as HTMLInputElement`,\n\
      `e.currentTarget as HTMLElement`, and the same shapes. Those are exempt for\
      \ now.\n\nThey are exempt because there are many of them and removing them needs\
      \ a DECISION about event\ntyping, not because they are safe. `e.target` is genuinely\
      \ `EventTarget | null`, so every one\nof these asserts something the compiler\
      \ cannot see: that the element firing the event is the\none the handler expects.\
      \ A handler bound to the wrong element, or a listener that bubbles from\na child,\
      \ reads `.value` off something that has none \u2014 `undefined` into a field,\
      \ silently.\n\nTHE FIX WHEN IT COMES\n\nThe shape is the same as every other\
      \ cast removal: narrow with a guard instead of asserting.\n`if (!(e.target instanceof\
      \ HTMLInputElement)) return;` is a real narrowing the compiler\nverifies, and\
      \ it makes the \"wrong element\" case explicit instead of undefined. Vue's own\
      \ typed\nevent helpers cover part of it; the rest is per-handler.\n\nAlternatively\
      \ a single typed helper \u2014 `inputValue(e): string | null` \u2014 declared\
      \ once and used\neverywhere, so the narrowing exists in ONE place rather than\
      \ at ~30 call sites.\n\nSCOPE, measured 2026-08-30: the exemption is only for\
      \ DOM element target types. Any other cast\nin a `.vue` script block fails the\
      \ gate today."
  - at: '2026-08-30'
    text: "John's reason, 2026-08-30: \"the special case of Dom events gets a pass\
      \ because the events are\ninternationally [inherently] untypable generic events\"\
      \ and \"no other passes for now\".\n\nSo this is not a debt item of the same\
      \ kind as the other 102 casts. A DOM event's `target` is\n`EventTarget | null`\
      \ BY THE DOM SPECIFICATION \u2014 the event type carries no knowledge of which\n\
      element it came from, and no amount of local typing changes that. The assertion\
      \ is standing in\nfor information the platform does not provide, rather than\
      \ for a check the author skipped.\n\nThat makes it the ONE exemption, and it\
      \ stays narrow: only assertions to a DOM element type\n(`HTML*Element`, `Element`,\
      \ `EventTarget`). Every other cast in a `.vue` script block fails the\ngate\
      \ today, exactly as in a `.ts` file.\n\nWHAT WOULD CLOSE IT: narrowing with\
      \ `instanceof` rather than asserting \u2014\n`if (!(e.target instanceof HTMLInputElement))\
      \ return;` \u2014 which the compiler verifies and which\nmakes the wrong-element\
      \ case explicit instead of `undefined`. Best done once as a typed helper\n(`inputValue(e):\
      \ string | null`) rather than at ~13 call sites."
  answer:
    at: '2026-09-06'
    text: "Out of date \u2014 close. DOM-event target casts in .vue script blocks\
      \ are the standing single exemption to the no-casts gate; no follow-up removal\
      \ tracked."
