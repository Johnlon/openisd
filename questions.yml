- id: QO27
  title: "Two live formulas and two conventions for reference efficiency `no` \u2014\
    \ fraction vs percent, 112.1 vs 112.2"
  status: decided
  raised: '2026-08-13'
  body: ''
  notes:
  - at: '2026-08-13'
    text: "Split out of QO15 defect 2 on the human's ruling: \"treat #2 as its own\
      \ question resolved by\nWinISD evidence rather than preference\".\n\nLINE NUMBERS\
      \ BELOW WERE RE-VERIFIED 2026-08-13 against the working tree (QO15's originals,\n\
      recorded 2026-08-05, had all moved).\n\nTHREE IMPLEMENTATIONS ARE LIVE AND THEY\
      \ DISAGREE ON BOTH THE UNIT AND THE CONSTANT:\n\n  1. The Driver ADT \u2014\
      \ `no` as a FRACTION, constant 112.1\n     packages/winisd/src/driver.ts:421\
      \  r.no = 4*pi^2/c^3 * Fs^3*Vas/Qes\n     packages/winisd/src/driver.ts:422\
      \  r.SPL = 112.1 + 10*log10(no)\n     The driver editor multiplies by 100 to\
      \ show a percentage\n     (DriverEditorModal.vue, the `no` field's :scale=\"\
      100\" under a \"%\" label).\n\n  2. The engine's solveConsistencyGroup \u2014\
      \ `no` as a FRACTION, constant 112.2\n     packages/engine/src/driver.ts:161\
      \  setVal('no', CONST_NO * Fs^3 * Vas / Qes)   (CONST_NO = 4*pi^2/c^3, line\
      \ 54)\n     packages/engine/src/driver.ts:174  setVal('SPLref', 112.2 + 10*log10(no))\n\
      \     Same formula as the ADT, different constant.\n\n  3. The engine's deriveDriver\
      \ \u2014 `no` as a PERCENT, constant 112.2\n     packages/engine/src/driver.ts:256\
      \  r.no = 9.64e-10 * Fs^3 * (Vas*1000) / Qes     (Vas in litres)\n     packages/engine/src/driver.ts:258\
      \  r.SPLref = 112.2 + 10*log10(no/100)\n     The /100 makes this the only one\
      \ of the three that reads its own `no` as a percentage.\n\nA FOURTH constant\
      \ is named in the code but unused: the comment at\npackages/engine/src/driver.ts:252-254\
      \ records \"three disagreeing constants exist across the\ncodebase (109 inferred\
      \ / 112.1 / 112.2, PLAN_JS_CALC_CONSOLIDATION.md section 2 row 18)\" and\nsays\
      \ resolving it was out of scope for that pass. It is now user-visible: the driver\
      \ editor's\nSPL field renders from (1) while the charts run on the engine.\n\
      \nEVIDENCE ALREADY IN THE REPO \u2014 resolves the UNIT axis, not the CONSTANT:\n\
      \  - docs/design/WDR_SCHEMA.md:169 states the .wdr stores `no` as a FRACTION\
      \ and WinISD\n    DISPLAYS it as a percent (\"0.000754 = 0.0754%\"). That makes\
      \ (3)'s percent reading the\n    odd one out.\n  - docs/winisd_screenshots/edit_driver_pg2_parameters.png\
      \ (real WinISD Driver editor) shows `no` at\n    4 dp under a \"%\" label and\
      \ SPL at 2 dp under \"dB\", confirming the display side only.\n  - docs/winisd_screenshots/sample_drive_Dayton_Audio_Epique_E150HE-44.wdr\
      \ carries no=0 and SPL=0, so no\n    sample in the tree pins the constant.\n\
      \nWHAT STILL NEEDS MEASURING, AND HOW:\n  Resolve against WinISD, not by preference\
