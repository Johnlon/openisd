  raised: '2026-09-08'
  body: ''
  answer:
    at: '2026-09-12'
    text: 'DECIDED (John, 2026-09-12): Implement the cyclic/bidirectional solve. Stating
      tuning solves paired quantity (vent length / PR added mass) as calculated; stating
      paired quantity solves tuning as calculated. Unreachable targets mark the entered
      input.'
  notes:
  - at: '2026-09-08'
    text: "Blame placement refined (John, 2026-09-08): \"B is better - in cases where\
      \ two CmX lead to an\nimpossible third Cmx then both inputs need labelling\"\
      .\n\nSo the mark goes on EVERY input that contributed to the impossible result,\
      \ not on one nominated\nfield. Where two stated values together make a third\
      \ unreachable, both carry the mark; the\nderived field stays blank and unmarked.\n\
      \nThis is closer to the existing ConsistencyIssue than \"one field at fault\"\
      \ \u2014 that already marks\nevery member of a group (\"no member is more at\
      \ fault than another\", consistency.ts:52). The\ndifference stays that the DERIVED\
      \ field is excluded from the marking, because it holds no value\nto be wrong:\
      \ the contributing inputs are marked, the empty output is not."
  - at: '2026-09-08'
    text: "Further refinement (John, 2026-09-08): \"but also some inputs to a multi\
      \ input may be obviously\ncrap - so dont ignore that\".\n\nSo marking is not\
      \ a flat \"blame every contributing input\". Where one input is independently\n\
      wrong \u2014 outside its own legal range, or otherwise bad on its own terms,\
      \ without reference to the\nrelation \u2014 that input is named as the culprit\
      \ rather than the whole group being marked equally.\n\nTwo distinct cases, and\
      \ the mark must say which:\n  1. one input is bad ON ITS OWN (negative Sd, a\
      \ zero volume, a Q of 0) \u2014 mark THAT input, and\n     say what is wrong\
      \ with it. Blaming its innocent peers would send the user to the wrong field.\n\
      \  2. every input is individually plausible, but TOGETHER they make the target\
      \ unreachable \u2014 mark\n     every contributing input, since none is at fault\
      \ alone.\n\nOnly case 2 gets the group treatment. Case 1 outranks it: check\
      \ each input's own validity first,\nand only fall through to the group mark\
      \ when they all pass."
