# Config for scripts/land.sh and scripts/land/post-land/run.sh (docs/DEV_PROCESS.md).
# Lock paths come from scripts/paths.sh (sourced by land.sh before this file).
LINT_REQUIRES="node_modules"
LINT_CMD="bash scripts/land/lint-changed.sh"
TYPECHECK_CMD="bash scripts/quiet-test.sh npm run typecheck"
# Every unit test the change reaches (vitest --changed origin/main), before the push; its own deadline.
UNIT_CMD="bash scripts/land/unit-changed.sh"
ARCHITECTURE_CMD="bash scripts/land/unit-architecture.sh"
# The full suite on GitHub Actions on the candidate branch land/<task>, before main moves (T301).
CANDIDATE_CMD="bash scripts/land/post-land/actions.sh"
# Re-takes the visual baselines when a rebase conflicted only on them (generated files; T313).
VISUAL_RETAKE_CMD="bash scripts/visual/update.sh"
CANDIDATE_DEADLINE_S=1800
UNIT_DEADLINE_S=900
ATTRIBUTION_CMD="bash scripts/hooks-local/no-ai-attribution.sh"
# 900, not 300: the lint gate over a 343-file diff (local main unpushed since 10 Oct) took 450 s on 12 Oct.
GATE_DEADLINE_S=900
# Lint and typecheck finish on their own; under load they only run slow (T203 lint hit 900 s three
# times at load 15, 16 Oct). 0 = no deadline (John, 16 Oct 2026: no timeout on tools like that).
LINT_DEADLINE_S=0
TYPECHECK_DEADLINE_S=0
# The full suite runs on GitHub Actions (.github/workflows/suite.yml, on each landing's candidate land/<task>,
# whose commit is the one main gets); post-land reads that run (John, 17 Oct 2026; T322). Back to the laptop: FULL_SUITE_CMD="bash scripts/land/post-land/suite.sh".
FULL_SUITE_CMD="bash scripts/land/post-land/actions.sh"
ACTIONS_REPO=Johnlon/openisd
# On the same filesystem as the clones: the copy hardlinks their node_modules.
POST_LAND_DIR=/home/john/work/winisd/.postland
# Kill a post-land run (its whole process group) after this many seconds and record it red.
POST_LAND_DEADLINE_S=5400
# land.sh refuses a landing not labelled fixes when main has been red (last green older than) this many minutes.
HEALTH_RED_MAX_MIN=120

# After each landing, land.sh moves the main folder and the preview copy to the landed commit
# (scripts/land/sync-main-folder.sh, T328); exit 4 when one cannot, and the landing agent fixes it.
SYNC_MAIN_FOLDER=1

# Every landing is a GitHub pull request from land/<task> (T331, scripts/land/pr.sh).
PULL_REQUESTS=1

# Gate files (30 Oct 2026, T624): land.sh refuses a diff touching one unless the task carries
# gates_approved: QO<n> and that item in QUESTIONS_FILE has a thread entry by John. Globs, fnmatch
# semantics (* crosses directories). packages/ui/coverage-baseline.json is deliberately NOT here: the
# ratchet rewrites it upward on green and the ratchet itself refuses it going down.
GATE_FILES="scripts/coverage-*.sh scripts/coverage-*.mjs vitest*.config.ts packages/*/vitest*.config.ts eslint.config.js eslint-suppressions.json tsconfig*.json packages/*/tsconfig*.json .github/workflows/suite.yml"
QUESTIONS_FILE=/home/john/work/winisd/questions.yml
