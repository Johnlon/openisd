name: pr

# The one required check of a pull request to main, `pr-gate` (T749, QO481 A; T758, QO501 A): the fast gates only
# (task contract, lint, typecheck, unit, architecture, done-test: 6 jobs, ~5 min). The full suite does not run
# here: GitHub's free plan runs 20 jobs at once for the whole account, so a 22-job pull request queued the next
# one. suite.yml runs it on main after each merge and a red there opens an issue (docs/DEV_PROCESS.md).
# Runs on the pull request and again on the merge queue's merged result (merge_group).
on:
  pull_request:
    branches: [main]
    # labeled and unlabeled: adding or lifting the `hold` label re-runs the gate (the `hold` job below); any label change restarts it
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions:
  contents: read

# A new push to a pull request replaces its older run; a merge group's run is never cancelled.
concurrency:
  group: pr-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EVENT: ${{ github.event_name }}
  GROUP_BASE: ${{ github.event.merge_group.base_sha }}

jobs:
  # The gate-approval check (locked hashes, files allowlist, task id and owner, status, gate files approved), in a job of its
  # own (T934 reviews 3 and 4, Codex 19 Nov 2026): nothing of the change runs before or in it. It checks out the change as data,
  # takes the runner from the BASE commit (git show), and the runner runs the base commit's scripts/land/ (pr-task.sh,
  # check-task-contract.sh), which read the change's land.conf, task files and file list with git show, sed and the YAML
  # parser. The change's own pr-setup.sh, pr-task.sh and checker are never run here. Commits: the event's own ids (the pull
  # request's base sha and merge commit; the merge group's base and head sha).
  # Known limit, an open owner decision (tasks/T934.yml): a pull_request run takes this workflow file from the change itself, so
  # a change that edits pr.yml could drop this job; pr.yml is a gate file, and closing the gap needs pull_request_target or a
  # repository rule requiring review of .github/workflows changes (John's call).
  gate-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # -I (isolated): no module from the checkout is imported (T934 review 6)
      - run: python3 -I -m pip install pyyaml==6.0.2
      - name: gate files approved, checked by the base commit's own scripts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          # The one reviewed bootstrap: the pull request that adds the runner (T934) has none on its base, and only on this pinned
          # base does it run its own reviewed copy (and its own scripts/land/). Any other base without the runner fails closed.
          # Update the pin if main moves before T934 lands. The exception is bound to content too (T934 review 5): on the pinned base,
          # the change's runner and the checker scripts it runs must have exactly these sha256 sums, or the job fails closed.
          BOOTSTRAP_BASE: 6082d07aa96afb23155ee81bdc16d7b90de37257
          BOOTSTRAP_SHA256: |
            09f2ec4155654d3dd4ed20905c9122b0f0c58fbd8e0daf42be938791dfc6edab  scripts/ci/contract-from-base.sh
            bd74afc8a1e0462c139f7b0a1a76fb301ea7b644b54bb4e5d08aba6b5deed0a1  scripts/land/pr-task.sh
            feb0ec11624163e253c91cbf0080a0c0fab7fa7d9df0e404faf23c2369c6f573  scripts/land/check-task-contract.sh
            c88c1e927597717479befd32ad56832818cf2374f317df0ca853552df1dc1c24  scripts/land/core/task.sh
            2cfb2f891b0b779fa07f83d9166cab0315374b254f91075fb2d0e83b616e714c  scripts/land/task-gates/check-commit.sh
        run: |
          set -uo pipefail
          git cat-file -e "$BASE_SHA^{commit}" 2> /dev/null || git fetch -q origin "$BASE_SHA" || { echo "::error title=gate approval::no base commit $BASE_SHA"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || { echo "::error title=gate approval::the checkout is not $HEAD_SHA"; exit 1; }
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" || { echo "::error title=gate approval::$BASE_SHA is not an ancestor of $HEAD_SHA"; exit 1; }
          runner="$RUNNER_TEMP/contract-from-base.sh"
          if git cat-file -e "$BASE_SHA:scripts/ci/contract-from-base.sh" 2> /dev/null; then
            git show "$BASE_SHA:scripts/ci/contract-from-base.sh" > "$runner"; scripts="$BASE_SHA"
          elif [ "$BASE_SHA" = "$BOOTSTRAP_BASE" ]; then
            while read -r sum path; do
              [ -n "$path" ] || continue
              [ "$(git show "$HEAD_SHA:$path" 2> /dev/null | sha256sum | cut -d' ' -f1)" = "$sum" ] \
                || { echo "::error title=gate approval::bootstrap: $path is not the reviewed content (sha256 $sum)"; exit 1; }
            done <<< "$BOOTSTRAP_SHA256"
            git show "$HEAD_SHA:scripts/ci/contract-from-base.sh" > "$runner"; scripts="$HEAD_SHA"
          else
            echo "::error title=gate approval::the base $BASE_SHA has no scripts/ci/contract-from-base.sh and is not the reviewed bootstrap base $BOOTSTRAP_BASE"; exit 1
          fi
          bash "$runner" "$BASE_SHA" "$scripts"

  # The duplicate-logic scan in a job of its own (T934 review 5, Codex 19 Nov 2026: in the architecture job it ran after npm ci,
  # the change's pr-setup.sh and its tests, which could alter the scanner's inputs or the origin/main ref it compared with).
  # Nothing of the change runs before it: jscpd and typescript are installed from the BASE commit's package.json and
  # package-lock.json into RUNNER_TEMP with install scripts off, and the ratchet compares with the event's base sha. The scanner,
  # its allow-list, homes and re-key mapping are gate files, so a change to them needs John's approval (gate-approval job).
  dupscan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: no new copy of a formula (duplicate-logic scan against the allow-list; QO946.c256)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          git cat-file -e "$BASE_SHA^{commit}" 2> /dev/null || git fetch -q origin "$BASE_SHA" || { echo "::error title=dupscan::no base commit $BASE_SHA"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || { echo "::error title=dupscan::the checkout is not $HEAD_SHA"; exit 1; }
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" || { echo "::error title=dupscan::$BASE_SHA is not an ancestor of $HEAD_SHA"; exit 1; }
          tools="$RUNNER_TEMP/dupscan-tools"; mkdir -p "$tools"
          git show "$BASE_SHA:package.json" > "$tools/package.json" && git show "$BASE_SHA:package-lock.json" > "$tools/package-lock.json" || exit 1
          (cd "$tools" && npm ci --ignore-scripts --no-audit --no-fund) || { echo "::error title=dupscan::cannot install the base's jscpd and typescript"; exit 1; }
          # The scanner is staged from the head commit beside the trusted node_modules and run there (T934 review 6): Node resolves
          # its "typescript" import from the script's own folder, so a node_modules in the checkout is never loaded.
          git show "$HEAD_SHA:scripts/dupscan.mjs" > "$tools/dupscan.mjs" || exit 1
          co="$(pwd -P)"
          node "$tools/dupscan.mjs" "$co" --jscpd "$tools/node_modules/.bin/jscpd" --allow "$co/scripts/dupscan-allow.json" --homes "$co/scripts/dupscan-homes.json" \
            --rekey "$co/scripts/dupscan-rekey-T934.json" --base "$BASE_SHA"

  # The task contract, attribution, driver-model ruling and visual baselines: no node needed.
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read lets the baseline check ask which visual-retake run drew each changed picture (T799).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pyyaml==6.0.2
      - run: bash scripts/ci/pr-setup.sh "$EVENT" "$GROUP_BASE"
      - name: task files say the truth (status, landed sha, release_note a sentence) on every pull request
        # T891: the shell job below runs task-status.test.sh only when scripts/ or workflows change, so a pull request that
        # changed only its task file was never checked (main went red on T886's release_note with no full stop, 18 Nov 2026).
        # Always run here; ~15 s.
        run: bash scripts/land/test/task-status.test.sh
      - name: attribution on every commit message
        run: bash scripts/land/attribution-range.sh origin/main HEAD
      - name: driver model ruling (from main's copy of the gate)
        run: |
          git show origin/main:scripts/land/check-model-ruling.sh > "$RUNNER_TEMP/check-model-ruling.sh"
          # a driver model change needs the ruling on one of the carried tasks
          for t in $PR_TASK; do bash "$RUNNER_TEMP/check-model-ruling.sh" "$t" origin/main HEAD > "$RUNNER_TEMP/ruling.out" && exit 0; done
          cat "$RUNNER_TEMP/ruling.out"; exit 1
      - name: visual baselines match the task's visual list and were drawn by CI's test machine
        # VISUAL_VERIFY_RUN: each changed picture's stamp must name a successful visual-retake run whose manifest holds its hash.
        env:
          VISUAL_VERIFY_RUN: '1'
          GH_TOKEN: ${{ github.token }}
          VISUAL_REPO: ${{ github.repository }}
        run: bash scripts/visual/check-task.sh $(for t in $PR_TASK; do echo "tasks/$t.yml"; done) origin/main HEAD

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: bash scripts/ci/pr-setup.sh "$EVENT" "$GROUP_BASE"
      - name: lint on the changed files
        run: bash scripts/land/lint-changed.sh $(git diff --name-only --diff-filter=ACMR origin/main HEAD)

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: bash scripts/ci/pr-setup.sh "$EVENT" "$GROUP_BASE"
      - run: bash scripts/quiet-test.sh npm run typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: bash scripts/ci/pr-setup.sh "$EVENT" "$GROUP_BASE"
      - name: every unit test the change reaches
        run: bash scripts/land/unit-changed.sh $(git diff --name-only --diff-filter=ACMR origin/main HEAD)

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: bash scripts/ci/pr-setup.sh "$EVENT" "$GROUP_BASE"
      - name: every architecture unit test
        run: bash scripts/land/unit-architecture.sh

  done-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: bash scripts/ci/pr-setup.sh "$EVENT" "$GROUP_BASE"
      - name: the done_test of every carried task
        run: |
          rc=0
          for t in $PR_TASK; do echo "== done_test of $t"; bash scripts/land/run-done-test.sh "tasks/$t.yml" || rc=1; done
          exit "$rc"

  # The visual spec on the merged result (T810), only for a change that can alter a picture (scripts/visual/pr-needs-visual.sh):
  # a picture committed with the sources it was drawn for passes, a stale one fails, and nothing is committed to record it
  # (a committed hash of the sources conflicted between every two UI pull requests). Same test machine as suite.yml's browser job.
  visual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/portingle/openisd-ci-runner@sha256:51e24d3e3c17259a560ce8ee15a89d635011c9a3eba0abf920cc0690f79799f7
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ipc=host
    timeout-minutes: 30
    env:
      OPENISD_TEST_PORT: '4300'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: does this change reach a picture
        id: needs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # assigned first: a failure of the script fails this step (inside echo "run=$(...)" it would be lost, and an empty
          # answer reads as "not run"); a gate that cannot decide must refuse (T833)
          run="$(bash scripts/visual/pr-needs-visual.sh "$EVENT" "$GROUP_BASE")"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.needs.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - if: steps.needs.outputs.run == 'true'
        run: npm ci
      - name: build the suite's app
        if: steps.needs.outputs.run == 'true'
        run: bash -c "$(node --input-type=module -e "import('./playwright.config.js').then(m => process.stdout.write(m.BUILD_TEST_APP))")"
      - name: the visual spec, no tolerance
        if: steps.needs.outputs.run == 'true'
        run: npx playwright test packages/ui/test/visual/visual.browser.spec.ts --retries=0
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: visual-failures
          path: test-results/
      - name: nothing here reaches a picture
        if: steps.needs.outputs.run != 'true'
        run: echo "no UI source, picture, visual spec or test-machine change; the visual spec is not run"

  # A change to the scripts runs every shell test (T810): a gate script change broke two tests nobody ran (T799, 15 Nov 2026).
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No pr-setup.sh here: its OPENISD_CI_RUNNER and runtime-dir variables change what some shell tests see (yield-and-slice
      # failed under them); this job runs the tests as the suite's `shell` job does.
      - id: scripts
        name: does this change reach the scripts
        run: |
          if [ "$EVENT" = merge_group ]; then base="$GROUP_BASE"; else base="$(git rev-parse HEAD^1)"; fi
          git cat-file -e "$base^{commit}" 2> /dev/null || git fetch -q origin "$base"
          # the list is read before it is searched: a git failure must fail the step, never answer "false" (T833)
          names="$(git diff --name-only "$base" HEAD)"
          if grep -q -e '^scripts/' -e '^land.conf$' -e '^\.github/workflows/' <<< "$names"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.scripts.outputs.run == 'true'
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global init.defaultBranch main
          python3 -m pip install pillow==10.4.0 numpy==2.1.3 pyyaml==6.0.2
      - if: steps.scripts.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - if: steps.scripts.outputs.run == 'true'
        run: npm ci
      - name: every shell test under scripts/
        if: steps.scripts.outputs.run == 'true'
        run: bash scripts/test-shell.sh

  # A held pull request cannot merge (T815): red while the label `hold` is on, so a lead's hold survives any push or `gh pr merge --auto`.
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: not held by the label hold
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: bash scripts/ci/check-hold.sh

  # The one name the main ruleset requires. Red when any job above is not green.
  pr-gate:
    if: ${{ always() }}
    needs: [gate-approval, dupscan, task, lint, typecheck, unit, architecture, done-test, visual, shell, hold]
    runs-on: ubuntu-latest
    steps:
      - name: every gate green
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gate results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error title=pr-gate::a gate did not pass ($RESULTS)"; exit 1; }; done
