# Builds the saved test-machine image for the browser job (T752). Manual only: run it when
# .github/ci-image/Dockerfile or expected-fonts.txt changes, then put the printed digest in suite.yml.
name: ci-image
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "hash=$(sha256sum .github/ci-image/Dockerfile .github/ci-image/expected-fonts.txt | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A font-list mismatch fails this build step and prints the full actual list in its log.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .github/ci-image
          push: true
          tags: ghcr.io/johnlon/openisd-ci:${{ steps.tag.outputs.hash }}
      - run: echo "ghcr.io/johnlon/openisd-ci@${{ steps.build.outputs.digest }}"
