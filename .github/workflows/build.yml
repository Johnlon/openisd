name: build

# A snapshot build of main on every push, or on demand: everything goes to /test/ as soon as it
# lands (John, 17 Oct 2026).
# scripts/snap.sh does the work and says whether it built; only then does the site deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.snap.outputs.built }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - id: snap
        run: bash scripts/snap.sh
        env:
          GH_TOKEN: ${{ github.token }}
          # Public OAuth Web client id; the cloud sync UI renders only when the build has one.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

  deploy:
    needs: snapshot
    if: needs.snapshot.outputs.built == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
