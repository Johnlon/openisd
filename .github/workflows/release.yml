name: release

# A release was tagged, published, edited or marked Latest: rebuild and deploy the site, so the root
# follows the Latest release. scripts/release.sh makes the change; this only redeploys.
on:
  push:
    tags: ['v*']
  release:
    types: [published, edited]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
