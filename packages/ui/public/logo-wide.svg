  <path fill="#4fb0ff" d="M617.98 101.58H635.04V180H617.98Z M647.6 174.64 653.34 159.38Q659.91 162.61 664.23 163.81Q668.55 165.02 673.36 165.02Q679.92 165.02 682.93 162.75Q685.94 160.48 685.94 156.7Q685.94 154.68 684.32 153.2Q682.71 151.73 680.25 150.66Q677.79 149.59 673.2 147.9Q665.87 145.27 661.14 142.84Q656.41 140.41 652.99 135.98Q649.57 131.55 649.57 124.77Q649.57 116.51 653.67 111.01Q657.77 105.52 664.39 102.92Q671.01 100.32 678.72 100.32Q684.46 100.32 689.49 101.41Q694.52 102.51 699.45 104.53L694.25 119.13L692.88 118.64Q689.49 117.33 686.54 116.62Q683.59 115.91 679.43 115.91Q674.89 115.91 671.53 117.79Q668.16 119.68 668.16 123.73Q668.16 125.59 669.59 126.95Q671.01 128.32 673.2 129.33Q675.38 130.34 679.48 131.88Q686.38 134.39 690.97 136.91Q695.56 139.42 698.93 144.12Q702.29 148.83 702.29 156.16Q702.29 163.81 698.9 169.45Q695.51 175.08 689.05 178.11Q682.6 181.15 673.52 181.15Q666.96 181.15 661.08 179.64Q655.2 178.14 647.6 174.64Z M713.98 101.58H744.11Q763.63 101.58 773.56 111.01Q783.48 120.45 783.48 139.86Q783.48 152.11 778.48 161.16Q773.48 170.21 764.37 175.08Q755.27 179.95 743.29 180L713.98 180.11ZM743.4 165.62Q750.51 165.62 755.59 162.64Q760.68 159.66 763.33 153.94Q765.98 148.23 765.98 140.19Q765.98 127.88 760.38 121.81Q754.77 115.74 743.89 115.85L731.15 115.96V165.62Z"/>

  <!-- response curves rippling out to the right of the name -->
  <line x1="880" y1="167" x2="1150" y2="167" stroke="#2b3a49" stroke-width="1.5"/>
  <!-- orange: vented-box impedance, the classic twin peaks straddling Fb -->
  <path d="M880 149 C 898 149 910 135 922 103 C 930 81 944 81 956 101
           C 968 123 982 137 994 137 C 1008 137 1020 105 1032 85
           C 1042 71 1058 71 1070 91 C 1086 113 1110 139 1150 145"
        fill="none" stroke="url(#imp)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- blue: SPL response — low-end rolloff rising into a flat passband -->
  <path d="M880 157 C 906 157 918 137 936 109 C 952 93 970 91 988 97
           C 1028 105 1080 100 1150 100"
        fill="none" stroke="url(#spl)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
