<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11151c">
  <title>Update OpenISD</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #11151c; color: #e6edf3; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(32rem, 100%); text-align: center; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
    p { color: #aab7c4; }
    a { display: inline-block; margin-top: 1rem; padding: .75rem 1.25rem; border-radius: .5rem; background: #1976d2; color: white; text-decoration: none; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Updating OpenISD</h1>
    <p id="status" role="status" aria-live="polite">Clearing old app files. Your projects and settings stay.</p>
    <a id="open" href="/" hidden>Open the latest OpenISD</a>
  </main>
  <script>
    async function updateOpenISD() {
      const registrations = 'serviceWorker' in navigator
        ? await navigator.serviceWorker.getRegistrations()
        : [];
      const sameOrigin = registrations.filter(registration => new URL(registration.scope).origin === location.origin);
      await Promise.all(sameOrigin.map(registration => registration.unregister()));
      if ('caches' in window) {
        // CacheStorage is origin-scoped, so every entry here belongs to this
        // OpenISD origin. Cache names do not have to encode the SW scope.
        await Promise.all((await caches.keys()).map(name => caches.delete(name)));
      }

      // An old active worker can still control this page until its next client
      // navigation, even after unregister(). Fetch the new shell as a normal
      // same-origin request (legacy workers only intercepted navigations), then
      // replace this document in place so that worker cannot serve its old shell.
      const response = await fetch('/?_openisd_refresh=' + Date.now(), {cache: 'reload'});
      if (!response.ok) throw new Error('Latest app shell unavailable');
      let html = await response.text();
      if (!/<base\b/i.test(html)) html = html.replace(/<head\b[^>]*>/i, '$&<base href="/">');
      document.open();
      document.write(html);
      document.close();
      history.replaceState(null, '', '/?_openisd_refresh=' + Date.now());
    }

    updateOpenISD().catch(() => {
      document.querySelector('#status').textContent = 'The automatic update could not finish. Tap below to open OpenISD.';
      document.querySelector('#open').hidden = false;
    });
  </script>
</body>
</html>
