description:
  value: 13 cm (5") High-End low midrange driver with stiff, anodized aluminium cone,
    solid aluminium die-cast basket and elastic rubber surround. Extremely low electrical
    and mechanical losses due to vented pole plate and vented damper. Capton voice-coil
    and impedance control ring. Extremely long cone displacement due to long stroke
    voice coil. Suitable as low-midrange driver for 3-way High-End applications up
    to 5000 Hz.
  origin: manufacturer_product_page
  definition: the manufacturer's own product blurb, page chrome stripped
