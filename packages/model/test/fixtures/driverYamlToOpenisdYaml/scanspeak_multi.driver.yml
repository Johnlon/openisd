uuid:
  value: d61fefd5-def9-4236-b7d3-4ddec6a0f955
  definition: stable record identity, minted by the pipeline at first emit and never
    re-derived
quality:
  disposition:
    value: incomplete
    definition: 'the record''s standing — one of: ok, no-ts-published, incomplete'
    detail: required parameters for box design simulation are missing
  no_ts_published:
    value: false
    definition: whether the source publishes no T/S parameters at all for this driver
      — a claim about the SOURCE, so it cannot be derived from the record's own fields
      and is the one part of `disposition` that is still stated directly, by the vendor
      emit that read it
  rating: L
  confirmed_fields: [BL, Fs, Qts, Re, SPL, Sd, Vas]
  fields_with_issues: []
  missing: [Mms]
  invalid: []
  parse_errors: []
  cross_source_only: []
manufacturer:
  value: Scan-Speak
  origin: manufacturer_product_page
  definition: the company that makes the driver; a second-order descriptive field,
    shown only when it differs from the brand
brand:
  value: Scan-Speak
  origin: manufacturer_product_page
  definition: the selling brand; equals the manufacturer except for house brands
model:
  value: 15M/4531K00
  origin: manufacturer_datasheet
  definition: the vendor's exact designation including the impedance variant — unique
    within a brand, and the name shown in the driver browser
sku:
  value: 15m-4531k00
  definition: the canonical identity code — the vendor designation slugified, impedance
    variant included; names the record directory (guard-enforced equal) and is unique
    within the manufacturer
  grounds:
  - origin: manufacturer_datasheet
    reading: 15M/4531K00
    definition: the printed designation the code was derived from
  - origin: manufacturer_product_page
    reading: https://www.scan-speak.dk/product/15m-4531k00/
    definition: the source URL that corroborated the derivation
driver_type:
  value: midrange
  origin: manufacturer_product_page
  definition: what kind of driver this is (closed vocabulary); decides which specs
    section applies
data_sources:
  value:
    manufacturer_datasheet: https://www.scan-speak.dk/datasheet/pdf/15m-4531k00.pdf
    manufacturer_listing_page: https://www.scan-speak.dk/product-tag/midrange/
    manufacturer_product_page: https://www.scan-speak.dk/product/15m-4531k00/
  definition: the record-wide provenance index — every source role used anywhere in
    this file resolves to a URL here
authoritative:
  value: manufacturer_datasheet
  definition: which indexed source wins the datasheet waterfall for this record —
    the document the specs are extracted from; other sources only corroborate
product_image:
  value: https://www.scan-speak.dk/wp-content/uploads/2019/01/15m-4531k00-1200x800.jpg
  origin: manufacturer_product_page
  definition: the manufacturer's product photo for this driver
