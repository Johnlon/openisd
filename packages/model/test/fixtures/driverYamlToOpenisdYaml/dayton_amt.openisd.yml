description:
  value: Introducing the AMT Mini-8 Air Motion Transformer tweeter from Dayton Audio—your
    key to unlocking incredible clarity, lightning-fast transient response, and exceptional
    musicality in any loudspeaker design. With its impressive frequency range extending
    up to 40,000 Hz, this tweeter is the ideal solution for high-resolution audio
    systems that demand precision and detail. Its compact housing allows for effortless
    integration into various setups, while cutting-edge AMT technology ensures robust
    output from this remarkably small driver. Integrate the AMT Mini-8 into your speaker
    designs and experience the difference.Product HighlightsAdvanced Air Motion Transformer
    design delivers smooth response up to 40,000 HzFolded Kapton ribbon diaphragm
    delivers clean, detailed, and highly dynamic outputCompact design and Hi-Res capability,
    ideal for use as a super tweeterPowerful, lightweight neodymium magnet structure
    for low distortion and high efficiencySonically similar to the best metal ribbon
    and planar tweetersProduct Manuals / Spec Sheets / DownloadsDayton Audio AMT Mini-8
    Specifications SheetDayton Audio AMT Mini-8 Data FilesDayton Audio AMT Mini-8
    3D FileBuying OptionsBuy NowBuy on AmazonBuy Internationally
  origin: manufacturer_product_page
  definition: the manufacturer's own product blurb, page chrome stripped
