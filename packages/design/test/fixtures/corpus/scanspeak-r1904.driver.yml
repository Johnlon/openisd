uuid:
  value: b6429c26-a599-4160-9142-db9135815fa4
  definition: stable record identity, minted by the pipeline at first emit and never re-derived
quality:
  confirmed_fields:
  - BL
  - Fs
  - Qts
  - SPL
  - Sd
  fields_with_issues:
  - Re
  missing: []
  invalid: []
  parse_errors: []
  cross_source_only: []
manufacturer:
  value: Scan-Speak
  origin: manufacturer_product_page
  definition: the company that makes the driver; a second-order descriptive field, shown only when it
    differs from the brand
brand:
  value: Scan-Speak
  origin: manufacturer_product_page
  definition: the selling brand; equals the manufacturer except for house brands
model:
  value: R1904/613001
  origin: manufacturer_datasheet
  definition: the vendor's exact designation including the impedance variant — unique within a brand,
    and the name shown in the driver browser
sku:
  value: r1904-613001
  definition: the canonical identity code — the vendor designation slugified, impedance variant included;
    names the record directory (guard-enforced equal) and is unique within the manufacturer
  grounds:
  - origin: manufacturer_datasheet
    reading: R1904/613001
    definition: the printed designation the code was derived from
  - origin: manufacturer_product_page
    reading: https://www.scan-speak.dk/product/r1904-613001/
    definition: the source URL that corroborated the derivation
driver_type:
  value: tweeter
  origin: manufacturer_product_page
  definition: what kind of driver this is (closed vocabulary); decides which specs section applies
data_sources:
  value:
    manufacturer_datasheet: https://www.scan-speak.dk/datasheet/pdf/r1904-613001.pdf
    manufacturer_listing_page: https://www.scan-speak.dk/product-tag/tweeter/?fwp_paged=4
    manufacturer_product_page: https://www.scan-speak.dk/product/r1904-613001/
  definition: the record-wide provenance index — every source role used anywhere in this file resolves
    to a URL here
authoritative:
  value: manufacturer_datasheet
  definition: which indexed source wins the datasheet waterfall for this record — the document the specs
    are extracted from; other sources only corroborate
product_image:
  value: https://www.scan-speak.dk/wp-content/uploads/2019/01/R1904-613001-1200x800.jpg
  origin: manufacturer_product_page
  definition: the manufacturer's product photo for this driver
