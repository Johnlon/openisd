description:
  value: Dayton Audio’s ground breaking Epique E150HE-44 5-1/2” with a carbon
    fiber cone and dual voice coils, introduces the world to a new class of
    speaker driver . . . anExtendedRangeSubwoofer (ERS). It was engineered to
    produce premium controlled subwoofer performance, while simultaneously
    achieving a smooth extended high frequency response. Thanks to its
    revolutionary MMAG dual gap motor, the motor force is nearly constant even
    when driven to the limits of its 14 mm Xmax. Capable of unheard-of excursion
    for its size while delivering smooth midrange response with low distortion,
    the E150HE-44 woofer gives you the opportunity to create systems that
    provide extraordinary accuracy and fidelity.Product HighlightsPatented dual
    gap MMAG motor design allows exceptional linearity for minimal
    distortionLightweight damped carbon fiber cone delivers remarkably smooth
    response up to 45 degrees off axisIncredibly linear 14 mm excursion to
    produce class leading low frequency extension and controlExtensive
    inductance control extends frequency response, lowers distortion, reduces
    compression, and increases power handlingSubstantial venting keeps the voice
    coil cool to minimize power compressionDual 4 ohm voice coils enable a
    variety wiring configurations and flexibilityIncredible versatility, premium
    performance as a subwoofer or woofer in 2-way designsProduct Manuals / Spec
    Sheets / DownloadsEpique E150HE-44 Specification SheetEpique E150HE-44
    Mechanical DrawingEpique E150HE-44 Data FilesBuying OptionsBuy on Parts
    ExpressBuy Internationally
  origin: manufacturer_product_page
