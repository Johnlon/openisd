visual_note: "The Advanced tab (desktop) and the WinISD differences list (desktop cue dialog and phone menu) gain the yellow switch 'Coil coefficient from project'."
release_note: A driver that states its own voice-coil temperature coefficient (AlfaVC) now heats its coil with it, as its wire's metal does, instead of the project's copper default; a new yellow switch "Coil coefficient from project" under "Enable WinISD bugs" gives WinISD's project-only sum back. Every catalogue driver states 0 and is unchanged.
repo: openisd
owner: t917
status: done
label: fixes
goal: The voice-coil temperature coefficient the sums use comes from the driver when the driver's value is not 0, else from the project's AlfaVC (default 0.0039), chosen by one engine function that every reader uses; a new WinISD bug switch, ticked, gives WinISD's behaviour (project value only).
why: 'John, QO953.c16 (18 Nov 2026, "a"): option A, the sums use the driver''s AlfaVC when it is not 0, else the project''s; a WinISD-bug tick-box gives WinISD''s project-only sum. AlfaVC belongs to the coil wire''s metal (copper 0.00393/K, aluminium about 0.0041-0.0043/K), the temperature rise dTVC stays the project''s (QO953.c15). WinISD 0.7.0 and 0.50a7 both use only the project value and Save copies it over the driver''s (winisd_research 9ac0941, 0.50a7/runs/050a7/coil-alfavc-20261118/, runs/s04-dtvc-20261118/). QO953.c17: .wdr import and export of alfaVC stay exactly as they are.'
