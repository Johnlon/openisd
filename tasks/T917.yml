note: 'The only data-model change is the switch: advanced.winisdProjectAlfaVC, z.boolean().optional(), absent parses to OFF (OpenISD''s sum), as every other bug switch. The driver record shape and .wdr/.wpr import and export are unchanged (QO953.c17). A negative driver AlfaVC (no coil metal''s; the field floor is non-negative) counts as not stated, so the input-limits sweep stays finite. The existing WinISD reading "dTVC 100, only the driver''s alfaVC set: Qtc 0.719" (sealed-readout-heats-coil.test.ts) is WinISD''s sum and now runs with the switch ticked; unticked the same project reads 0.920.'
