id: T840
release_note: 'The passive radiator now has Select, Info and Edit, as the driver: Info shows its figures and says it is a passive radiator; Edit opens one editor on both skins (name and figures, Auto calculate unknowns, Inspect Provenance, OK, Cancel, Reset, Export, Import, Copy to My PRs), and Define new passive radiator opens the same editor. The phone Box tab shows the radiator by name with its Key figures (Fpr, Mms, Sd, Xmax, Vd) and a 2× rule line; the desktop page keeps its figures. The phone Driver tab section is headed User options.'
