note: >-
  Ruled QO953.c21-c31. Test changed with John's approval (QO953.c26, "a repair is ok but it has to be automatic", which
  covers rewriting the throw to a refusal): project-signal.test.ts "type V 0.005 or a P driving below 10 mV | post: refused,
  unchanged" expected toThrow(/10 mV/); it now expects no throw, the value unchanged and a note naming 10 mV, for 0.005 V,
  0 V, -6 V, 0 W, 1e-5 W and -6 W. The 32 System input power / Driver input voltage cases of the input-limits sweep run as
  plain tests (removed from BREAKING_TODAY). project-sweep-source.test.ts drops the driveLevelIssues key of its source
  fixture: T916's sweep block on a loaded drive level is replaced by the repair. The load repair is one pass
  (domain/project/loadRepair.ts) driven by the field definitions (NumberField.loadRepair: which rule a loaded value breaks
  and what it is set to), run at every door a record enters by (OpenISDProject.wrapWithIdentity, openSession/wrapSession,
  the .wpr power); only the signal fields state one in T918, the air and Frc follow in a later task. The repairs are
  returned by the load (OpenedProject.loadRepairs, ImportedWinIsdProject.loadRepairs, ProjectRepo.openProjectText) and
  shown once in the "Project imported from X" message, one line each, never as a mark on the box (QO953.c30, c31). The
  desktop toast and the phone message strip keep line breaks and fit the screen width. The browser journey
  packages/ui/test/ui/drive-level-limits.browser.spec.ts (desktop and phone) runs in the full suite.
  Restoring a stored project (the open projects at start-up, a saved project, the autosave, a backup or archive entry, a
  share link) reports its repairs through createProjectRepo's onLoadRepaired to one toast, "Project opened: <name>" and a
  line per repair; a listing reports nothing. Duplicate, What-if and snapshots copy a project the opening already repaired,
  so nothing is left to repair (tested). A toast stays 2 s plus 4 s per line after the first, so a plain one-line toast
  is unchanged. The power that drives 10 mV (about 0.00002857 W) ran past the phone's Power box: a phone box shows a value
  below 1 whose fixed form is longer than the box in exponent form, four figures ("2.857e-5"); the desktop keeps the fixed
  form. The other createProjectRepo callers in tests pass a no-op for the new callback; no expectation changed.
