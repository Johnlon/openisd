goal: The Signal tab's drive level follows John's rulings. A typed Driver input voltage below 10 mV (0.005, 0, -6), or a System input power of 0 W, negative or driving below 10 mV, is refused with a note and the previous value stays; nothing throws. A drive level loaded from a file (OpenISD project, WinISD .wpr, stored project) below that is repaired automatically on opening to 10 mV (power, the power that drives 10 mV), shown with no data-quality mark, and the opening message names the repair one line each. The charts draw.
why: "John, 18 Nov 2026, card signal-low-drive-test: 'ok 10mv min, what if someone tpyoes 0 or -6' (QO953.c21); 'no dq must match value shown' (QO953.c25); 'a repair is ok but it has to be automatic' (QO953.c26); general chat: 'there won't be a dqnflag on a repair as the dq always relate to the value the user can see - this is a hard rule surely' (QO953.c30); 'all you can do is show a toast' (QO953.c31)."
ruling: QO953
