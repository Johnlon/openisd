id: T161
release_note: Deleting a project now moves it to a Bin that syncs to your other devices. Open project shows the Bin, where you can restore a project or delete it forever, or empty the Bin. An edit made on another device brings a binned project back. Sync now leaves alone any Drive item a newer version wrote.
