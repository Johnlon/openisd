closed_note: |
  A laptop-only red, the same fault as F49: the laptop's test server died mid-run and the specs then
  failed in about 150 ms each; heavy.slice went over MemoryHigh during the run. GitHub Actions ran the
  full suite green on 96acf25250 (run on push) and on every later main commit; the Actions-backed
  post-land run is green at 2947ff6a12. This was the last laptop full run: since T266, post-land and the
  watchdog's runs wait for the Actions run instead (land.conf FULL_SUITE_CMD). The server death stays
  open in BUG_20261017_laptop-suite-server-dies-mid-run (owner maryu), now being reproduced.
