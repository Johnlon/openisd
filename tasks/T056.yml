id: T056
release_note: "Every snapshot build and release is hosted at openisd.app, and About lists them."
repo: openisd
owner: fable
status: done
landed: 009cb130a2 (first T056 commit, green on main, 12 Oct 2026)
goal: snapshot builds pile up on GitHub, one per push to main, each hosted and tryable. A release promotes one tested snapshot build, bytes unchanged. openisd.app root serves the latest release; every release stays hosted.
spec: |
  Version
  - A build's name is its stamp from scripts/version-info.mjs at minute resolution, v20260101T0102Z. version-info.mjs takes the stamp from GITHUB_REF when it is a snap- or v tag, else now. Sent in the telemetry launch event.
  Snapshot trail
  - .github/workflows/build.yml on push to main, only when the post-land gate reports green for that commit (until S7 exposes it: on push) and at least two hours since the last snapshot build; scripts/snap.sh builds one now from main HEAD regardless (workflow_dispatch): stamp = now, build with base ./, zip dist as openisd-<stamp>.zip, tag the commit snap-<stamp>, GitHub pre-release "Snapshot <stamp>" with the zip and generated notes since the last release.
  - Hosted at openisd.app/snap/<stamp>/. Last 10 snapshot builds kept, older pre-releases, tags and folders deleted by the same workflow.
  Release trail
  - scripts/release.sh <stamp>: refuses unless snap-<stamp> exists and no F is open (green-main check proper waits for S7). Adds tag v<stamp> on the same commit (snap- tag stays), flips the pre-release to a release and marks it Latest, downloads nothing, builds nothing. Same bytes.
  - scripts/release.sh also fast-forwards a read-only branch `release` to the promoted commit. Nothing lands on it.
  - scripts/release.sh --latest <stamp>: marks an existing release Latest, the deploy moves root to it. That is the rollback.
  - .github/workflows/release.yml on v tag push or release published: redeploys Pages.
  Hosting
  - Pages is workflow mode: every deploy replaces the whole site. Each deploy rebuilds the tree from GitHub: every release zip to v/<stamp>/, the release GitHub marks Latest also at root, every kept snapshot zip to snap/<stamp>/, v/index.json listing both trails (stamp, kind release|snap, tag, release URL, dates ISO 8601 basic). Releases on GitHub are the only source of truth, no gh-pages branch.
  - The deploy writes two plain HTML index pages from the same data as v/index.json: openisd.app/snap/ (one row per snapshot build: date, commit subject, Launch link, GitHub link; the whole row is a clickable link to Launch, phone friendly) and openisd.app/v/ (same for releases, newest first). No app code, works on the phone.
  - The snap/ index page says: snapshot builds may upgrade your saved data; a backup is taken first.
  - about/ pages work at root and under each copy. Installing as an app is offered at root only; each copy's manifest has a relative start URL and scope, or the copy's install page links to root. Worker picks the simpler and says why.
  - Index pages carry ISO stamps; a small script formats them in the browser using the design package's date formatter, built as a tiny bundle by the same workflow. No second formatter.
  - If a service worker exists, each copy registers its own scope or none.
  Versions list in app
  - App fetches /v/index.json at start, no store, no schema. About shows Versions: releases first, then snapshot builds marked Snapshot, current highlighted, date as "1 Jan 2026, 01:02", links to the hosted copy and its GitHub page. Fetch failure shows current only. Old build shows "latest release is <date>".
  Branch t056-hosting, runs in parallel with t055-releases.
done_test: bash scripts/land/test/release.test.sh && bash scripts/test.sh packages/ui/test/logic/versionIndex.test.ts
files:
  - tasks/T056.yml
  - RELEASES.md
  - RELEASING.md
  - README.md
  - DOCUMENTATION.md
  - scripts/version-info.mjs
  - scripts/release.sh
  - scripts/hosting/releaseNotes.mjs
  - tasks/*.yml
  - scripts/land/test/release.test.sh
  - .github/workflows/build.yml
  - .github/workflows/release.yml
  - .github/workflows/deploy.yml
  - vite.config.js
  - packages/ui/src/logic/versionIndex.ts
