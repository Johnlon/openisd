id: T056
repo: openisd
owner: fable
status: held
goal: WIP builds pile up on GitHub, one per push to main, each hosted and tryable. A release promotes one tested WIP build, bytes unchanged. openisd.app root serves the latest release; every release stays hosted.
spec: |
  Version
  - A build's name is its stamp from scripts/version-info.mjs at minute resolution, v20260101T0102Z. version-info.mjs takes the stamp from GITHUB_REF when it is a wip- or v tag, else now. Sent in the telemetry launch event.
  WIP trail
  - .github/workflows/build.yml on push to main: stamp = now, build with base ./, zip dist as openisd-<stamp>.zip, tag the commit wip-<stamp>, GitHub pre-release "WIP <stamp>" with the zip and generated notes since the last release.
  - Hosted at openisd.app/wip/<stamp>/. Last 20 WIP builds kept, older pre-releases, tags and folders deleted by the same workflow.
  Release trail
  - scripts/release.sh <stamp>: refuses unless wip-<stamp> exists and no F is open (green-main check proper waits for S7). Moves the tag to v<stamp>, flips the pre-release to a release, downloads nothing, builds nothing. Same bytes.
  - .github/workflows/release.yml on v tag push or release published: redeploys Pages.
  Hosting
  - Pages is workflow mode: every deploy replaces the whole site. Each deploy rebuilds the tree from GitHub: every release zip to v/<stamp>/, newest release also at root, every kept WIP zip to wip/<stamp>/, v/index.json listing both trails (stamp, kind release|wip, tag, release URL, dates ISO 8601 basic). Releases on GitHub are the only source of truth, no gh-pages branch.
  - The deploy writes two plain HTML index pages from the same data as v/index.json: openisd.app/wip/ (one row per WIP build: date, commit subject, Launch link, GitHub link) and openisd.app/v/ (same for releases, newest first). No app code, works on the phone.
  - about/ and install/ pages work at root and under each copy.
  - If a service worker exists, each copy registers its own scope or none.
  Versions list in app
  - App fetches /v/index.json at start, no store, no schema. About shows Versions: releases first, then WIP builds marked WIP, current highlighted, date as "1 Jan 2026, 01:02", links to the hosted copy and its GitHub page. Fetch failure shows current only. Old build shows "latest release is <date>".
  Branch t056-hosting, runs in parallel with t055-releases.
done_test: |
  bash scripts/land/test/release.test.sh
  bash scripts/test.sh packages/ui/test/logic/versionIndex.test.ts
files:
  - tasks/T056.yml
  - scripts/version-info.mjs
  - scripts/release.sh
  - scripts/land/test/release.test.sh
  - .github/workflows/build.yml
  - .github/workflows/release.yml
  - .github/workflows/deploy.yml
  - vite.config.js
  - packages/ui/src/logic/versionIndex.ts
