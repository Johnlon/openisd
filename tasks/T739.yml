id: T739
release_note: internal
repo: openisd
owner: leader
status: open
goal: One reliable list of every view and popup; the live review visits it and reports each visited or not
why: John, 8 Nov 2026 - "a summary to confirm that all screens or views or popup were checked is ok as long as we have a reliable list of all views and popup (no matter how small) and can state which were or were not visited, without that list of visual components to check then none of our testing is reliable".
found: There are three lists, the declared phone list (157 views, mobileSurfaceManifest.ts), the declared desktop list (130, desktopSurfaceManifest.ts) and a source scan of 608 conditional popups and branches (mobileSurfaceSourceIndex.json). The scan only proves its own list has not changed; nothing ties each scanned popup to a declared view. The live review (ui-gallery/bin/steps/live) visits a hand-written set and reads none of them.
plan:
  - The declared phone and desktop lists are the one inventory of views and popups.
  - A unit test fails when a popup or branch found by the source scan has no declared view (or is not named as part of one). A new popup cannot ship unlisted.
  - The live review drives its sweep from the inventory and writes a coverage table (table data-coverage) with one row per view and skin, marked visited or not visited, with the reason if not.
  - A view the review cannot reach is a red row, never left out.
done_test: bash scripts/quiet-test.sh npm run typecheck
files:
  - tasks/T739.yml
