id: T058
repo: openisd
owner: fable
status: held
with: T055
goal: A lost storage key is seen and said. John lost all saved drivers at localhost:4000 on 12 Oct 2026 with no app path that removes the key; nothing recorded it.
spec: |
  - On every start, before any load, the app writes openisd_storage_log: the ISO 8601 basic time and, per openisd_* key, present or absent and its length. Keep the last 30 entries.
  - A key present in the previous entry and absent now shows a notice on screen: "Saved drivers were in this browser at <date>, they are gone now." with Export log. Never dismissed silently, needs a click.
  - The launch telemetry event carries keysLost: [names] when that happens.
  - Ruling (John, 12 Oct 2026): a backup MUST ALWAYS take place. Every write that removes or replaces a stored key, in any path (restore, delete, migrate, repair write-back, reset), first snapshots the whole store as openisd_snapshot_<build stamp>. There is no path without it. One function in persistence does the snapshot, every destructive write goes through it, and a test proves each destructive path produces a snapshot.
  - Restore keeps keys the file lacks unless the user ticks "replace everything". The replace test in backupRepo.test.ts changes to match.
done_test: |
  bash scripts/test.sh packages/persistence/test/storageLog.test.ts
  bash scripts/test.sh packages/persistence/test/backupRepo.test.ts
files:
  - tasks/T058.yml
  - packages/persistence/src/repos/storageLog.ts
  - packages/persistence/src/repos/backupRepo.ts
  - packages/persistence/test/storageLog.test.ts
  - packages/persistence/test/backupRepo.test.ts
