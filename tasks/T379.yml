goal: >-
  The app tells the user how many projects are stored and how much storage they use, in every
  storage notice (John 17 Oct 2026, rulings 21, 23; additions via opi). (1) Save all flashes
  "Saved 2 projects. 12 projects, 1.4 MB of 5 MB used." ("Nothing to save" unchanged); at or above
  STORAGE_FULL_FROM the storage-full warning replaces the usage line. (2) At startup, once per
  browser tab and only when at least one project is stored, the flash says "12 projects, 1.4 MB of
  5 MB used." One new sessionStorage key, openisd_usage_notice_shown (John-approved via opi),
  read through createSessionStorage and createUsageNoticeTab in packages/persistence. (3) The
  persist warning (banner and Your data) and the storage-full warning (Your data, Save flash) carry
  the same line: "Nothing is wrong now (12 projects, 1.4 MB of 5 MB used): ...", "Storage is 86%
  full (40 projects, 4.3 MB of 5 MB used). Export or delete old projects." All text in
  packages/design/fields/browserStorage.ts (storageUseLine, startupNotice, savedNotice,
  persistenceWarning, storageFullWarning over a StoredUse); the UI reads StoredUse with
  storedUseOf and flashes. Both skins use the existing flash (desktop popup, phone flash-strip).
