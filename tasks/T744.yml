id: T744
release_note: A Cms you type always moves the charts, on drivers and radiators alike. A new WinISD-style option "Cms from Vas" decides which wins when a datasheet states both and they disagree; a warning shows when they do.
repo: openisd
owner: leader
status: open
ruling: 'QO463 - John, 8 Nov 2026 chat: "ok kick off the CMS plan" (taken as A, the plan as written; also the data-model ruling for the new saved field)'
goal: Cms, Vas, Mms and Rms follow one rule on drivers and radiators; the charts use what the boxes show
goal_detail:
  # Written 9 Nov 2026 from John's rulings so the goal survives handovers. Each point needs a test, driver and radiator.
  - "1 Typed last wins: type Cms and Vas is worked out from it; type Vas and Cms is worked out; Mms and Rms the same (QO470)."
  - "2 The charts use what the box shows: the sweep reads the same Cms, Mms, Rms and Vas the boxes display and never works its own out (QO472.c22)."
  - "3 A typed Cms beats the stated efficiency (QO477 A: Vas follows the typed Cms; the stated efficiency becomes a calculated value; nothing disagrees, so no warning)."
  - "4 Datasheet values stay as saved: the record keeps the datasheet Cms and Vas; save, reload and export write them back unchanged; the box value is an on-demand engine read, never stored (QO472.c19)."
  - "5 Datasheet states both and they disagree: the WinISD Compatibility option 'Cms from Vas' decides. Ticked (WinISD's way, the default; a file that does not say = ticked): charts use Cms from Vas. Unticked: charts use the stated Cms."
  - "6 The user is told by a signal, not a new field: when stated Cms and Vas disagree, the existing warning mark on the box; its popup says in one plain sentence that they disagree and which the charts use. No new boxes, no new icons (QO472.c38, c43)."
  - "Done when: a test proves each of 1-6 for driver and radiator; box value equals sweep input in every case; before/after pictures of the option and the warning, both skins, on the board; WinISD parity row, help entry written; the two bug files closed."

# Orchestration: leader (Opus) only plans, briefs, reviews and lands. Each step is one cheap worker
# (Sonnet subagent, or agy Flash through the tools session for pictures), run one after another in this
# worktree, each committing to branch t744. A step starts only when the one before is committed and its
# test is green. Every worker reads CLAUDE.md, .claude/rules/{testing,verify,general,ui}.md first.

design:
  - "One decision point: CompatSwitch.CMS_FROM_VAS (kind 'option') in packages/design/domain/project/compatSwitch.ts. Read once where the project becomes engine inputs."
  - "One typed choice: a sum type CmsSource = VasWins | StatedCmsWins in packages/design/domain, built from the switch at that one point. Passed to the driver engine and the radiator spec. No booleans threaded through, no string keys, no new constants."
  - "One Cms resolver shared by both parts: the field solve (what the box shows) and the sweep (what the charts use) call the same function, so they cannot differ. Formulas stay in the existing routes (CMS_FROM_VAS_SD_ROUTE, MMS_FROM_FS_CMS_ROUTE, RMS_FROM_FS_MMS_QMS_ROUTE)."
  - "Warning: reuse the existing Cms/Vas conflict check (driver checkConsistency, radiator pr-spec-conflict); text says which value the charts use. No new warning type."
  - "Typed last wins: typing Cms works out Vas (and the other way round), driver as radiator."

steps:
  - n: 1
    worker: sonnet
    do: "Red tests only (TDD). packages/design/test/domain/cms-from-vas.test.ts: (a) driver, typed Cms moves the SPL sweep; (b) driver, typed Cms works out Vas; (c) datasheet states both, switch ticked: charts and box use Cms from Vas, warning shown; (d) switch unticked: charts and box use the stated Cms, warning shown; (e) radiator same four; (f) box value equals sweep input value in every case. Each test fails today for the right reason."
    done: "bash scripts/test.sh packages/design/test/domain/cms-from-vas.test.ts runs, every case red, committed."
  - n: 2
    worker: sonnet
    do: "Data model (ruling QO463): ToggleField ADV_WINISDCMSFROMVAS (title 'Cms from Vas', tooltip in plain words what ticked and unticked do) in packages/design fields; project field winisdCmsFromVas in openisdSchema.ts and the project; CompatSwitch.CMS_FROM_VAS. Missing in a file = ticked (CompatSwitch.winisdValue). Save/load round trip test."
    done: "round-trip test green; typecheck green."
  - n: 3
    worker: sonnet
    do: "CmsSource sum type and its one constructor from the project; exhaustive match where it is read. Unit test for the mapping."
    done: "unit test green; no other file reads the switch (grep in the test)."
  - n: 4
    worker: sonnet
    do: "One Cms resolver for both parts; DriverEngine.circuitValues and the radiator spec resolve take CmsSource and call it; remove the duplicate derivations. Steps 1 (a, c, d, f) go green."
    done: "cms-from-vas.test.ts cases a,c,d,f green; existing driver and PR engine tests green."
    # QO472.c19 / c22 / c23 (John, 8 Nov): (c19) the box's Cms is an on-demand engine read, never stored or cached in the domain object;
    # the record keeps the datasheet Cms and Vas; every save/export writes the stored value (test: save, reload, Cms still there).
    # (c22) the sweep must not work Cms/Mms/Rms/BL out of Vas itself: it reads the same field values the box shows.
    # (c23) audit of Cms/Mms/Rms/BL derivations outside the field solve:
    #   engine/driver/DriverEngine.ts:circuitValues - Cms (route), Mms, Rms, BL derived for the sweep. TO REMOVE (c22); step 4 so far only routes Cms through resolveCms(CmsSource).
    #   engine/pr/PrEngine.ts:cmsFromVas / mmdFromFs / rmsFromQms - public helpers with no caller outside PrEngine and tests. Dead; remove with their tests.
    #   domain/box/openISDBox.ts:635,694 - PrEngine.vas(starting Cms, Sd): seeds a NEW radiator's Vas from a starting Cms. Kept: a default for an empty box, goes through a field set.
    #   projectResolve / PR spec resolve / What-if / exports: no own derivation (they call the field solve).
    # State: step 4 and 5 for the driver done (typed last wins in OpenIsdDriverSpec slot, Vas-from-typed-Cms first in DriverEngine.solveValues, CmsSource on SweepDriver).
    # c19/c22 built (commit after bdc51ac2a): DriverEngine.shownMechanics (WinISD chain), OpenIsdDriverSpec shows it on demand (stored entries untouched, resolve uses stored), circuitValues = Qts fallback only,
    #   CmsSource provider plumbed (project: switch; standalone: StoredShown). driver-edit-parity-e150he-44 'stated fields' is green now (968 passed, 17 expected fail); driver case b vs golden Vas route precedence was open when this note was written.
    # Left (old note): c19 on-demand Cms read (case c), c22 removal from circuitValues, radiator c/d (step 6/7 adopt), radiator typed-last.
  - n: 5
    worker: sonnet
    do: "Driver typed last wins: typing Cms works out Vas, typing Vas works out Cms, as the radiator does. Case b green."
    done: "case b green; driver solve tests green."
  - n: 6
    worker: sonnet
    do: "Bring T732 (branch t732, held) onto this: radiator pick keeps the stated values; which wins comes from CmsSource. Case e green. T732 is closed into T744, not landed separately."
    done: "case e green; pr-typed-value-wins, pr-spec-resolve, pr-spec-conflict, pr-adopt-datasheet-figures green."
    # Step 6 state (9 Nov): carried T732 (0f1e8963c, 56a17d9fe) and T713 (dfc08cc68) by cherry-pick, then fitted by hand.
    #   Carried: typed-last-wins on every radiator pair (prSpec `follows` list replaces T744's single `partner`; kept T744's `shown` read),
    #     pr-typed-value-wins.test.ts, bug files, parity/accuracy rows, FIELD_CLEAR_RULE.md, recordBuilders half-widths, pr-sd-edit, winisdDeviation text, T732/T713 task files.
    #   Dropped: the tests' claim that a stated Cms/Mms/Rms reads entered at the pick (T744 goal_detail 5: the box shows the chart figure, calculated, with the warning;
    #     the record keeps the stated value). pr-adopt-datasheet-figures, pr-spec-resolve and 2 hook tests went back to T744's expectations.
    #   DONE (9 Nov, wizard): the wizard 'typed Cms' hook test was never red in the app; the worktree's node_modules was a symlink to ../openisd/node_modules, so ui specs imported @openisd/design from the MAIN checkout (stale). node_modules is now a real dir linking @openisd/* to this worktree. Added pr-standalone-typed-cms.test.ts. With correct resolution two other hook tests are red against T744 behaviour ((a) clearing Vas expects null; SP22R Qms 4.813 vs 4.8365): stale expectations, John's verdict needed.
    #   Open: the radiator browser specs from T732/T713
    #     (new-project-radiator-eight-figures, original-driver-bundle-selection, original-pr-tab) still assert the entered-as-stated reading and need rewriting to T744.
  - n: 7
    worker: sonnet
    do: "Warning text on the existing conflict check: says the two disagree and which the charts use. Field-note popup (T729 style)."
    done: "warning unit test green."
  - n: 8
    worker: sonnet + agy
    do: "Screen: the switch shows in the WinISD Compatibility panel through CompatSwitch.OPTIONS (no UI code per switch). Before/after pictures, both skins: the panel, the Cms box with warning (driver and radiator, P173). mark-diff boxes, agy checks, Look at / Recommend / Checked, impact line; page passes check-answerable.mjs. To John before landing."
    done: "page link with agy PASS, sent to John on the board."
  - n: 9
    worker: sonnet
    do: "Records: WINISD_PARITY.md row (an option, not a bug); WINISD_EQUIVALENCE register cell and README parity bullets if a cell changes; close bugs/BUG_20261108_driver-typed-cms-mms-rms-ignored-by-charts.md and the T732 bug; help page entry for the switch; the (?) help for Cms, Vas, Fs, Mms, Qms and Rms on driver and radiator says in plain words that in each pair the one you typed last wins and the other is worked out again (John, QO470: last wins is ok as long as the help says so)."
    done: "docs committed."
  - n: 10
    worker: sonnet (read-only reviewer)
    do: "Architecture review against ~/.claude/CLAUDE.md guardrails: one decision point, no string routing, no casts, no new constants, exhaustive match, no wrapper methods. Findings go to the leader; fixes are a new worker."
    done: "no open findings."
  - n: 11
    worker: leader
    do: "Set done_test, bash scripts/land.sh T744."

