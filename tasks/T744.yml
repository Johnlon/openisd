owner: leader
status: in_progress
# ruling text: QO534 - John, 11 Nov 2026: "an entered value is never overwritten with a calculated value"; "going forward the editor and pr settings will use the [on-screen] values not hidden recalcs always"; on the warning mark: "all get the mark".
# ruling: QO535 - John, 11 Nov 2026 (What-if): "what if is all about tweaking things you need to buy a different driver to obtain, ie experiments and learning"; "I only want to add inputs" (Qts, Sensitivity, Cms, Rms).
# ruling: QO532 - John (decided highlight): the boxes that feed the engine are "not dimmed, just accentuated"; "ok but not like that with the input cell fucked up".
# The gate reads the first bare ruling line; QO534 is the driver-model ruling for this task (openIsdDriverSpec.ts changes).
ruling: QO534
why: 'John, 11 Nov 2026 (QO534): "the editor and pr settings will use the [on-screen] values not hidden recalcs always"; (QO535) What-if is for experiments and learning'
release_note: The driver editor and the passive radiator settings chart exactly the values in their boxes; a value you type is never replaced, and when boxes disagree every box involved is marked and its note says what the maths gives. The boxes that feed the charts are highlighted. The What-if panel gains Qts, Sensitivity, Cms and Rms, and a typed value moves the figures that follow it, so the boxes always agree.
goal: The editor and radiator settings chart what the boxes show; What-if gains four inputs and a move rule; the engine-feeding boxes are highlighted
goal_detail:
  - "QO534 driver editor and radiator settings: an entered value is never overwritten with a calculated value; an empty box is calculated and shown. The charts use the boxes that feed the engine (Sd, Mms, Cms, Rms, Bl, Re, Le) as they show, never worked out again from Fs, Vas and the Q's. Test: packages/design/test/domain/on-screen-values.test.ts rows 0-4 and the radiator cases."
  - "QO534 warning mark: when boxes disagree, every box in the disagreeing relation carries the existing warning mark; its popup names the boxes and says what the maths gives (e.g. 'Fs, Mms and Cms disagree: Fs = 1/(2π·√(Mms·Cms)) gives Fs 34.9 Hz, the box says 40.00 Hz'). Test: on-screen-values.test.ts 'row 1: the popup'."
  - "QO535 What-if: adds Qts and Sensitivity to the main group and Cms and Rms to Derived beside Bl and Mms (no read-outs, groups unchanged). A typed result (Fs, Vas, Qts, Qes, Qms, Sensitivity) keeps the other results and moves the parts; a typed part (Mms, Cms, Rms, Bl, Sd, Re) keeps the other parts and moves the results that depend on it. No warning marks in What-if; it never writes to the project. Tests: packages/design/test/engine/what-if-moves.test.ts rows 0-8, packages/design/test/domain/what-if-driver.test.ts, packages/ui/test/hooks/OriginalWhatIf-hooks.test.ts."
  - "QO532 highlight: the boxes that feed the engine (driver Sd, Mms, Cms, Rms, Bl, Re, Le; radiator Sd, Mms, Cms, Rms) get an accent outline and a bold value in the driver editor (phone and desktop), the Driver tab and the radiator settings; box size and padding unchanged. The list is one typed list in packages/design. Help text says these boxes drive the charts."
  - "WinISD difference: WinISD charts Cms from Vas and Mms from Fs, ignoring a typed Cms, Mms or Rms. Recorded in docs/research/WINISD_PARITY.md and ACCURACY_IMPROVEMENTS.md; the not-equal-W cue sits by Mms and Cms."
  - "Removed from the earlier T744 build (older rule): the 'Cms from Vas' option, the typed-last memory (TypedFigure), the 'shown' chain that replaced a stated Cms/Mms/Rms on screen, and the typed-last-wins pairs."
  - "Done when: the tests above are green; typecheck green; before/after page under ui-gallery/T744-rules passes check-answerable."
done_test: bash scripts/test.sh packages/design/test/domain/on-screen-values.test.ts
