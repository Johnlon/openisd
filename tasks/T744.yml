id: T744
repo: openisd
owner: leader
status: done
# ruling text: QO534 - John, 11 Nov 2026: "an entered value is never overwritten with a calculated value"; "going forward the editor and pr settings will use the [on-screen] values not hidden recalcs always"; on the warning mark: "all get the mark".
# ruling: QO535 - John, 11 Nov 2026 (What-if): "what if is all about tweaking things you need to buy a different driver to obtain, ie experiments and learning"; "I only want to add inputs" (Qts, Sensitivity, Cms, Rms).
# ruling: QO532 - John (decided highlight): the boxes that feed the engine are "not dimmed, just accentuated"; "ok but not like that with the input cell fucked up".
# ruling: QO532 - John, 11 Nov 2026, on the "Desktop: driver editor, Parameters page, Blue dot" picture: "do this" (a blue dot right of the label; no ring, no bold).
# ruling: QO539 - John, 11 Nov 2026, on driver files whose Mms, Cms, Rms disagree with their Fs, Vas, Qms: "B" (the charts keep the on-screen boxes; an option "Chart from Fs, Vas, Qms (WinISD's way)", unticked by default, charts them WinISD's way; openisdSchema.ts gains the switch).
# ruling: QO539 help text - John approved 16 Nov 2026 14:51 UTC (woody board QO946.c167) the switch help "Chart from Fs, Vas, Qms: WinISD draws its charts from Fs, Vas and Qms ... Tick this to draw from Fs, Vas and Qms as WinISD does." (field.ts ADV_WINISDCHARTFROMFSVASQMS; phone line in phoneText.ts).
# ruling text: John, 21 Nov 2026 (desktop What-if widths): "only the col that needed widening really needs the fix".
# ruling text: John, 21 Nov 2026 (desktop Driver editor help): "big text dialogues can scroll if needed, better than losing good explanations, or the key words can be expanding for more info, that kind of thing".
# QO946.c187 (lead): Vd top limit 10,000 cm3
# The gate reads the first bare ruling line; QO534 is the driver-model ruling for this task (openIsdDriverSpec.ts changes).
ruling: QO534
why: 'John, 11 Nov 2026 (QO534): "an entered value is never overwritten with a calculated value"; "the editor and pr settings will use the [on-screen] values not hidden recalcs always"; "all get the mark". (QO535) What-if is for experiments and learning: "I only want to add inputs". (QO532) the boxes the charts read get a blue dot. (QO539, B) WinISD''s way stays one tick away, unticked by default. John, 21 Nov 2026 (desktop What-if widths): "only the col that needed widening really needs the fix".'
release_note: The driver editor and the passive radiator settings chart exactly the values in their boxes; a value you type is never replaced, and when boxes disagree every box involved is marked and its note says what the maths gives. The boxes that feed the charts are highlighted. The What-if panel gains Qts, Sensitivity, Cms and Rms, and a typed value moves the figures that follow it, so the boxes always agree.
visual_note: The boxes the charts read (Sd, Mms, Cms, Rms, BL, Re, Le) have a small blue dot right of their label, and the WinISD Compatibility panel has a new unticked switch, Chart from Fs, Vas, Qms. The What-if gains Qts, Sensitivity, Cms and Rms; screens that show a project's saved size show it a few bytes larger (the new switch). The desktop driver editor help sheets are capped at 680 px wide and scroll inside the editor when their text exceeds the available height.
goal: The driver editor and radiator settings chart what the boxes show and mark every box of a disagreeing set; What-if gains Qts, Sensitivity, Cms and Rms and a move rule; a blue dot marks every box the charts read; the "Chart from Fs, Vas, Qms" switch (unticked) charts WinISD's way
goal_detail:
  - "QO534 driver editor and radiator settings: an entered value is never overwritten with a calculated value; an empty box is calculated and shown. The charts use the boxes that feed the engine (Sd, Mms, Cms, Rms, Bl, Re, Le) as they show, never worked out again from Fs, Vas and the Q's. Test: packages/design/test/domain/on-screen-values.test.ts rows 0-4 and the radiator cases."
  - "QO534 warning mark: when boxes disagree, every box in the disagreeing relation carries the existing warning mark; its popup names the boxes and says what the maths gives (e.g. 'Fs, Mms and Cms disagree: Fs = 1/(2π·√(Mms·Cms)) gives Fs 34.9 Hz, the box says 40.00 Hz'). Test: on-screen-values.test.ts 'row 1: the popup'."
  - "QO535 What-if: adds Qts and Sensitivity to the main group and Cms and Rms to Derived beside Bl and Mms (no read-outs, groups unchanged). A typed result (Fs, Vas, Qts, Qes, Qms, Sensitivity) keeps the other results and moves the parts; a typed part (Mms, Cms, Rms, Bl, Sd, Re) keeps the other parts and moves the results that depend on it. No warning marks in What-if; it never writes to the project. Tests: packages/design/test/engine/what-if-moves.test.ts rows 0-8, packages/design/test/domain/what-if-driver.test.ts, packages/ui/test/hooks/OriginalWhatIf-hooks.test.ts."
  - "QO532 highlight: the boxes that feed the engine (driver Sd, Mms, Cms, Rms, Bl, Re, Le; radiator Sd, Mms, Cms, Rms) carry a blue dot (8 px, 4 px right of the label text, ChartInputs in packages/design) in the driver editor (phone and desktop), the phone Driver tab and the radiator settings; no input changes size, padding or font (no ring, no bold, no tighter spacing). The label column keeps room for the dot so it never runs into the warning mark or the box. Tests: driver-editor-cms-note and original-pr-cms-note browser specs, packages/design/test/fields/chartInputs.test.ts."
  - "WinISD difference: WinISD charts Cms from Vas and Mms from Fs, ignoring a typed Cms, Mms or Rms. Recorded in docs/research/WINISD_PARITY.md and ACCURACY_IMPROVEMENTS.md; the not-equal-W cue sits by Mms and Cms."
  - "QO539 option: \"Chart from Fs, Vas, Qms (WinISD's way)\" under \"Enable WinISD-style\", unticked in a new project and in a file that does not say; ticked, the charts work Cms, Mms and Rms out from Vas, Fs and Qms as WinISD does (DriverEngine.winisdCircuitValues); the boxes and their warning marks stay either way. Tests: compat-switch.test.ts, driver-circuit-values.test.ts, driver-edit-parity-e150he-44.test.ts (E150HE-44 as its file states). The switch covers the passive radiator too (DriverEngine.winisdRadiatorMechanics, the driver's routes): pr-chart-from-fs-vas-qms.test.ts."
  - "Removed from the earlier T744 build (older rule): the 'Cms from Vas' option, the typed-last memory (TypedFigure), the 'shown' chain that replaced a stated Cms/Mms/Rms on screen, and the typed-last-wins pairs."
  - "Done when: the tests above are green; typecheck green; before/after page under ui-gallery/T744-rules passes check-answerable."
tests_changed: >-
  QO960 (WinISD project import, John, 20 Nov 2026): "if you open a wpr then it gets converted immediately to OpenISD model and the app is unaware of provenance, if the user wants some legacy behave we have flags for that".
  The WinISD reference cases explicitly tick 'Chart from Fs, Vas, Qms' because the sealed Box readout follows the calculation selected for the charts (QO959).
  Their expected values, tolerances and assertions stay the same in vented-lossless-winisd.test.ts, isobarik-power-winisd.test.ts, sealed-readout-heats-coil.test.ts, coil-alfavc-driver-first.test.ts, sealed-triple.test.ts, field-clear-rule.test.ts and the WinISD-reference cases in sealed-readout-counts-drivers.test.ts.
  The branch adds ticked chart-peak cases, an unticked Qtc round trip and a test that a .wpr opens with the switch unticked.
  OriginalWhatIf-hooks.test.ts requires clearing Mms to restore a calculated, non-null figure.
  original-driver-bundle-selection.browser.spec.ts checks the editor's displayed states against the bundle and its entered numbers against the bundled figures, and checks all eight displayed passive radiator figures and states against the saved selection. This enforces John's on-screen values ruling (QO534), "an entered value is never overwritten with a calculated value".
  All four historical layout-6 storage recordings keep the original sealed Qtc of 0.7101774159567577.
  load-repair-report.test.ts checks Qtc 0.8193428312756991 and the on-open note from both layout-5 and layout-6 saves. storageUpgrade.test.ts checks the exact recalculated Qtc in today's writes and the original bytes when a layout-6 backup is restored and exported as-is, following John's older-save ruling, "D: new calculation + note".
  The desktop What-if layout checks 102 px boxes and 38 px chips for Cms and Rms, with 93 px boxes and 29 px chips for the other fields.
  Desktop help checks that every sheet fits the editor and viewport at 1280 × 720 and that scrolling reaches its last paragraph. The large-window check still requires help that fits to be fully visible on opening. The overview now checks that its full text is reachable by scrolling at 680 px.
  The passive radiator label-span cap (62 to 74 px) remains a branch change pending picture review.
