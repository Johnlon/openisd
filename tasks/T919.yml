visual_note: The Iso-Barik choice is no longer greyed or marked (not modelled): the desktop Driver tab and New Project have a working radio, and the phone Driver tab has a new Placement row under Drivers. Iso-Barik is drawn both ways, clamshell and back to front: drivers only on the New Project step and the Driver tab, the box with the pair in it on both Box tabs.
note: Iso-Barik is offered by one component, DriverPlacement.vue, bound to project.loading. Old assertions that pinned "not modelled" (new-project-wizard-walk and phone-classic-rows specs, phoneWizardText.test.ts) were changed to the new behaviour. Open (reported, not changed): OpenISDDriver.ventedDesign uses one driver's Vas for any driver count and loading, and no WinISD reference run exists for it.
