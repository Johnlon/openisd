id: T919
release_note: "Iso-Barik loading is on: pick it on the Driver tab or in New Project, on desktop and phone, and the Box tab, charts and sealed picker give the isobaric result, matching WinISD for every box type."
repo: openisd
owner: t919
status: claimed
label: fixes
goal: The Iso-Barik (isobaric, clamshell) choice on the Driver tab and in New Project, desktop and phone, is no longer greyed as "not modelled". It writes the project's loading; the engine's isobaric rule (half the Vas, the pair's impedance) drives every readout and chart; each box type matches WinISD's own Iso-Barik curves.
why: "John, 18 Nov 2026, QO953.c38: 'A: turn on isobaric (about 1 day)'. Context QO953.c33: the clamshell diagram is right; no distortion work (QO953.c34-c37)."
