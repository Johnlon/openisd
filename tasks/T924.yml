note: "Reuses T918's load repair pass, field-driven (NumberField.loadRepair, new 'band' break and 'empty' target); the record rules (projectLoadRepairRules.ts) run on the record before the first resolve. A box volume of 0 is not repaired: a built project holds 0 for an undesigned chamber (ProjectBuilder.empty()). Normal bands live on the fields (NumberField.plausible): T 174-373 K (WinISD Options), p 30-110 kPa, c 260-500 m/s, rho 0.15-2.25 kg/m3. The pressure band 30-110 kPa (and the c and rho bands) are the agent's choice, not a ruling: John can change them on NumberField.plausible. The band warning is its own issue kind ('outside-normal-band', consistency.ts NormalBandIssue): its note has no 'Conflicts with other values:' prefix, the box is amber (dq-warn, var(--acc2)) not red, and the note is the amber warning note; flags and conflicts keep their prefix and red look. The warning is added by the domain air resolve, the air solver's own issues are unchanged. tests_changed (approved by the lead under John's ruling QO953.c14, 18 Nov 2026: 'Agree: refuse impossible, warn odd' - refuse humidity outside 0-100 %): num-input.browser.spec.ts humidity -20 and 250 (was: accepted with a dq-flag, the 17 Sep 2026 contract) now refused, box red, the exact refusal note, sound velocity and density unchanged, Esc restores; original-advanced-tab.browser.spec.ts humidity 153 (was: kept with a dq-flag) now refused with the exact note, 80 % stays in the sums. Every other expectation in those tests is kept. air-limits.browser.spec.ts (desktop and phone) checks the warning text without the prefix and the amber, not red, box."
