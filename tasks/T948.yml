id: T948
release_note: Basket Diameter keeps the previous value when you enter an impossible size. Imported driver dimensions keep the values in the file and show data-quality warnings beside impossible or unusual values.
repo: openisd
owner: lead
status: done
label: fixes
goal: Refuse typed Basket Diameter outside 10–1000 mm with the existing note. Keep loaded driver dimensions as written, warn beside impossible or unusual values, and keep chart data finite.
why: Replacing a dimension on opening can misrepresent the file and change a subsequent export. (John, 21 Nov 2026, QO972: "a bad idea if it misrepresent data, a dq is better and more consistent".)
ruling: QO972
