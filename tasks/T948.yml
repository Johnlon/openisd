id: T948
release_note: Basket Diameter keeps the previous value when you enter an impossible size. Opening a file repairs impossible dimensions and lists them in one message. Unusual but possible sizes load as written, with a warning.
repo: openisd
owner: lead
status: done
label: fixes
goal: Refuse typed Basket Diameter outside 10–1000 mm with the existing note. Repair impossible loaded driver dimensions, report each repair, and keep unusual but possible dimensions as written with a warning. Keep chart data finite.
why: The load repair replaced the 55 m Basket in John's WinISD probes with 10 mm and exported the wrong value. John's 21 Nov 2026 ruling keeps possible values as written. The 18 Nov QO953 ruling repairs impossible values on opening.
