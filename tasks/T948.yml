id: T948
release_note: Basket Diameter keeps the previous value when you enter an impossible size. Imported driver dimensions keep the values in the file, with a data-quality warning for unusual sizes.
repo: openisd
owner: lead
status: done
label: fixes
goal: Refuse typed Basket Diameter outside 10–1000 mm with the existing note. Preserve loaded driver dimensions in .wdr, .owdr and .owpr files, show the data-quality warning for an unusual value, and keep chart data finite.
why: The load repair replaced the 55 m Basket in John's WinISD probes with 10 mm and exported the wrong value. John's 21 Nov 2026 ruling applies the typing limits only to edits and requires loaded values to be read as their formats specify.
ruling: QO953
