note: >-
  John, 18 Nov 2026, QO953, “refuse impossible, warn odd”. John clarified on 21 Nov, 01:11–01:14,
  “if a user is editing it that is different” and “WinISD file's basket is read exactly as WinISD's
  format states it, never squashed”, which “same applies to owdr and Owpr files”. At about 02:40
  John ruled “a bad idea if it misrepresent data, a dq is better and more consistent”. Loaded zero,
  negative and overflowing dimensions keep their values with a field warning. A 55 m Basket keeps
  its range warning. Tests cover finite sweeps, genuinely empty calculated fields, and the import
  message and warning beside a zero Basket in the Driver Editor.
