note: >-
  John, 18 Nov 2026, QO953, “refuse impossible, warn odd”. John clarified on 21 Nov, 01:11–01:14,
  “if a user is editing it that is different” and “WinISD file's basket is read exactly as WinISD's
  format states it, never squashed”, which “same applies to owdr and Owpr files”. The unit regression
