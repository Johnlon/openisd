id: T838
release_note: internal
repo: openisd
owner: wiringrow
status: done
goal: The project's one coil-wiring control, labelled Coil wiring on both skins, is the project's own wiring field (data version 5); it converts Re, Le, Znom and BL by the coil-count factors (a yellow switch gives WinISD's Re-and-BL-only way) for any coil count above one, shows one line with the coil count and the figures, is greyed on the desktop and absent on the phone for one coil, and absent for an unstated wiring.
ruling: QO941
why: John, 2026-11-15: the driver wiring is the measured setup and the project wiring is the usage of the driver (QO941.c14); for now replicate WinISD (QO941.c24); isolate the two issues (QO942.c2)
done_test: bash scripts/test.sh packages/design/test/engine/wiring-conversion.test.ts
