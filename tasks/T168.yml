release_note: Options has one "Your data" tab. Storage shows how much each kind of data takes, with Empty Bin and Delete all backups. Backups lists everything kept, newest first, with when and why it was made; you can restore everything, restore one project, export or delete each one. The newest 3 backups are kept, plus the last one made before an app update. Export / Import is the same tab.
