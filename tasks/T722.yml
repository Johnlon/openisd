id: T722
release_note: internal
repo: openisd
owner: leader
status: open
goal: land.sh lands tasks side by side, each with its own GitHub run started at once; a landing waits only when two tasks clash
why: John, 8 Nov 2026, "stop wasting my time with sequentia stuff" (a one-change release waited behind an unrelated landing; each task gets its own ~10 min run).
starts: after OpenISD 7.0.960 is out (John: release first).
correction: John, 8 Nov 2026, "NO ) mena stop parallelising stuff unless there is a clash" (read as stop serialising): no batch queue.
plan:
  - Landings no longer hold one lock for the whole run. Each task rebases, runs its fast gates and starts its own GitHub run on land/<task> at once, side by side with others.
  - Only the final push to main is serialised (a short lock). Green and main unchanged since the candidate: push.
  - Green but main moved meanwhile: rebase onto the new main. No clash (the tasks changed disjoint files and the rebase is clean): push without a new run. Clash (shared files or a rebase conflict): run again on the rebased candidate, then push.
  - Red: refused with its run link, as today.
  - Fail fast (John, 8 Nov ~02:20, via cover (2)): the task-file checks (done_test kind, allowlist) run before any gate; T720 spent 285 s on gates and was then refused for naming a browser spec in done_test.
  - The visual SOURCES.sha256 check also runs first: T717 and T712 were each refused late by it on 8 Nov (no picture changed, only the hash).
  - Gates in parallel (John, via cover (2)): lint, typecheck, unit, architecture tests and done_test run side by side; the first red kills the rest (about 30 s instead of 90 s).
  - GitHub at once (John, via cover (2): "why not run the tests on gh already"): right after the rebase, land.sh pushes land/<task> and starts the suite, with the local gates running alongside; the first red from either side refuses the landing and cancels the other; main moves only when all are green.
  - Drop the local repeats (John, 8 Nov, via cover (2): "what is the point of the local tests at all?"): suite.yml already runs lint, typecheck, unit and architecture tests, so land.sh stops running them. It keeps only the seconds-long checks GitHub does not do (task file, allowlist, attribution, gate files, model ruling, visual sources, done_test kind), then starts the GitHub run at once. This supersedes the parallel-gates item for those four gates.
  - Find and cut the ~190 s before the first gate (lock, rebase, setup), measured from the land logs.
  - Proven first in a scratch repo with real processes and two concurrent landings, one clashing pair and one disjoint pair (processes.md rule 7), wired in only when no landing or post-land run is active.
done_test: bash scripts/land/test/land-side-by-side.e2e.test.sh
files:
  - tasks/T722.yml
