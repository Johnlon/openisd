id: T057
repo: openisd
owner: fable
status: held
after: T055, T056
goal: The app shows every release and every storage snapshot. About lists versions with links; Options gets a Storage history page.
spec: |
  Versions
  - App fetches /v/index.json at start, no store, no schema. About shows Versions: current highlighted, each row the date as "1 Jan 2026, 01:02", links to /v/<stamp>/ and its GitHub release. Fetch failure shows current only.
  - Old build shows "latest is <date>" when the index lists a newer stamp.
  Storage history
  - Options menu page: one row per snapshot (build date, layout, project count, size) with Export to file, Restore (confirm; snapshots the live store first), Delete, plus Snapshot now.
  - All logic in packages/design or persistence, UI display only. Mobile skin gets the same page as a full-screen dialog.
done_test: |
  bash scripts/test.sh packages/ui/test/logic/versionIndex.test.ts
  bash scripts/test.sh packages/ui/test/logic/storageHistory.test.ts
files:
  - tasks/T057.yml
  - packages/ui/src/logic/versionIndex.ts
  - packages/ui/src/logic/storageHistory.ts
